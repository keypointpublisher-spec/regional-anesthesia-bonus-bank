/kg","At least 30 minutes after stability, with a maximum of about 25 mL/kg in total","Stop at stability, with no ceiling"],"k":2,"e":"The 2017 advisory said at least 10 minutes. The 2020 checklist says at least 15, and the later checklist is followed here. The maximum is about 12 mL/kg."},{"c":17,"id":"Q17-15","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"Despite the first lipid bolus, the patient remains hemodynamically unstable. What does the checklist advise?","o":["Stop the lipid and give vasopressin as the next step","Halve the infusion rate until the heart rhythm settles","Switch from lipid emulsion to propofol infusion","Repeat the bolus and double the infusion rate","Give a calcium channel blocker for the arrhythmia and continue standard resuscitation"],"k":3,"e":"If the patient is unstable the checklist advises repeating the bolus and doubling the infusion."},{"c":17,"id":"Q17-16","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"During resuscitation from local anesthetic toxicity, what epinephrine dosing does the checklist describe?","o":["Standard 1 mg doses every 3 to 5 minutes, as in a usual arrest","10 micrograms/kg every minute","Small doses, starting at 1 microgram/kg or less, rather than standard doses","No epinephrine under any circumstances","A single 40-unit dose of vasopressin instead"],"k":2,"e":"Resuscitation differs from standard advanced life support: small epinephrine doses are used, and local anesthetics, beta blockers, calcium channel blockers and vasopressin are avoided."},{"c":17,"id":"Q17-17","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"A patient has a seizure from local anesthetic toxicity. Which treatment is described?","o":["A benzodiazepine; propofol only in small increments, never in place of lipid and avoided when the circulation is compromised","Propofol in a full induction dose as the first choice for the seizure itself","Lipid emulsion alone, with no drug given for the seizure itself","A neuromuscular blocker given without any sedative drug","Observation only, because the seizure will stop by itself"],"k":0,"e":"Benzodiazepine is preferred. Propofol is not a substitute for lipid emulsion, and it should be avoided when the circulation is compromised."},{"c":17,"id":"Q17-18","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"How long should a patient be monitored after stabilization from local anesthetic toxicity, according to the checklist?","o":["30 minutes after a seizure and 2 hours after cardiovascular instability, in all patients","24 hours in every case","No monitoring is needed after stabilization","1 hour after a seizure and 12 hours after cardiovascular instability","At least 2 hours after a seizure and 4 to 6 hours after cardiovascular instability"],"k":4,"e":"The checklist calls for at least 2 hours after a seizure, 4 to 6 hours after cardiovascular instability, and as appropriate after cardiac arrest."},{"c":17,"id":"Q17-19","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"Before relying on printed lipid doses at the bedside, what should you do?","o":["Check them against the current ASRA checklist, as an update is expected in early 2027","Nothing, because printed doses are fixed and cannot change over the years ahead","Use the 2017 advisory instead of the 2020 checklist, because it was published first","Use the standard advanced life support doses throughout the whole resuscitation","Treat the printed doses as optional and rely on clinical judgment in each case"],"k":0,"e":"The 2020 checklist is under review by ASRA, with an update expected in early 2027. The doses are reproduced as the checklist gives them and must be checked against the current version."},{"c":17,"id":"Q17-20","s":"17.3 Hemodynamic Collapse and High or Total Spinal","q":"A patient develops low blood pressure and a slow heart rate within minutes of a spinal anesthetic, with normal hand strength and breathing. At approximately which spinal levels does the block affect the heart?","o":["C3 to C5","T1 to T4, the level at which the heart is blocked","C6 to C8","L1 to L2 or lower","S1 to S3"],"k":1,"e":"At T1 to T4 the heart is blocked, with low blood pressure and slow heart rate. At C6 to C8 the hands tingle or weaken, and at C3 to C5 the shoulders are weak and breathing fails."},{"c":17,"id":"Q17-21","s":"17.3 Hemodynamic Collapse and High or Total Spinal","q":"After an epidural top-up a patient has weak shoulders and rapidly deteriorating breathing. At which levels is the block most likely to extend?","o":["T1 to T4","C3 to C5, where the shoulders weaken and breathing fails","L1 to L2","T10 to T12","S2 to S4"],"k":1,"e":"At C3 to C5 the shoulders are weak and breathing fails, with desaturation and then respiratory arrest. When the spread reaches the head, speech slurs and consciousness is lost."},{"c":17,"id":"Q17-22","s":"17.3 Hemodynamic Collapse and High or Total Spinal","q":"Which of the following can contribute to a high or total spinal?","o":["A very small dose of local anesthetic given in the sitting position by an experienced operator","A concurrent peripheral nerve block given at a distant site","Use of a pencil-point needle for a spinal in a young patient","An unrecognized dural puncture with intrathecal injection, or injection during a cough","A normal body temperature during the whole procedure"],"k":3,"e":"Contributing factors include dose, position, an epidural block already in place, an unrecognized dural puncture, subdural or intradural catheter placement, injection speed, excessive barbotage, and injecting during a cough, contraction or Valsalva maneuver."},{"c":17,"id":"Q17-23","s":"17.3 Hemodynamic Collapse and High or Total Spinal","q":"Minutes after a block, a patient develops a rash, wheeze and facial swelling. What does the collapse differential suggest?","o":["Vasovagal reaction: lay flat and observe only, with no other action or investigation","High spinal: give a vasopressor and position head-up only","Allergic reaction: stop the agent, give epinephrine and treat as anaphylaxis","Toxicity: give lipid emulsion first and then reassess","Bleeding: image urgently and call the surgeon at once"],"k":2,"e":"Rash, wheeze and swelling point to an allergic reaction to a drug or latex, which calls for stopping the agent, epinephrine and standard anaphylaxis care."},{"c":17,"id":"Q17-24","s":"17.4 Respiratory Compromise and Pneumothorax","q":"A patient has no respiratory symptoms after an ultrasound-guided supraclavicular block, but later reports pain on the non-operative side. What does the case teach?","o":["Pain on the opposite side makes pneumothorax impossible","Pneumothorax after a supraclavicular block always presents at once in the recovery room","Delayed pneumothorax may first present as pain on the non-operative side","Pneumothorax cannot occur when ultrasound guidance is used","The pain must be a vasovagal reaction that will settle quickly"],"k":2,"e":"In the reported case the first sign was delayed pain on the non-operative side, which is why recognition was late, and the authors call for specific training in needle visualization."},{"c":17,"id":"Q17-25","s":"17.4 Respiratory Compromise and Pneumothorax","q":"In a review of 529 patients who had 2,163 ultrasound-guided thoracic paravertebral injections for breast surgery, which finding was reported?","o":["No pleural puncture was recognized, and two patients had a pneumothorax on later radiography","Twenty patients had a recognized pleural puncture during the blocks, and all of them needed a chest drain","No pneumothorax occurred in any of the 529 patients who were reviewed in the series","A pneumothorax occurred in about every tenth patient who was reviewed in the series","Pneumothorax occurred only in the patients who had a catheter placed in the space"],"k":0,"e":"The rate was 3.6 per 1,000 surgeries or 0.9 per 1,000 levels blocked."},{"c":17,"id":"Q17-26","s":"17.4 Respiratory Compromise and Pneumothorax","q":"A patient is discharged after a block close to the pleura. Which instruction should be given in writing?","o":["Report chest pain, cough or breathlessness, which can begin hours after recovery","No instructions are needed if the radiograph taken in recovery was normal and the patient feels well","Report only fever, since a pneumothorax never causes any other symptoms","Report only pain at the injection site and nothing else after the block","Report only tingling in the fingers on the side that was blocked"],"k":0,"e":"Symptoms of pneumothorax can start hours after the patient has left the recovery room, so the discharge instructions must name them."},{"c":17,"id":"Q17-27","s":"17.5 Nerve Injury: Recognition and Work-Up","q":"Among the blocks in the 32-study review of neurologic complications, which had the highest reported rate of neuropathy?","o":["Femoral block, 2.84 per 100","Axillary block, 0.34 per 100","Interscalene block, 2.84 per 100","Spinal anesthesia, 2.84 per 100","Epidural anesthesia, 1.48 per 100"],"k":2,"e":"Neuropathy was reported in 2.84 per 100 interscalene blocks, 1.48 per 100 axillary blocks and 0.34 per 100 femoral blocks, and permanent injury was rare."},{"c":17,"id":"Q17-28","s":"17.5 Nerve Injury: Recognition and Work-Up","q":"The second ASRA practice advisory on neurologic complications names which situations as areas of concern?","o":["Blocks in awake patients under ultrasound guidance, with a slow, low-pressure injection and a nerve stimulator check","Blocks in anesthetized or deeply sedated patients, and in those with pre-existing neurologic disease","Blocks that include epinephrine in the local anesthetic mixture for the patient","Blocks in children only, whatever the technique or the setting used","Blocks lasting less than one hour in healthy volunteers who are fully awake"],"k":1,"e":"The advisory also addresses the role of ultrasound and injection pressure monitoring as preventive tools and offers a diagnostic and treatment algorithm."},{"c":17,"id":"Q17-29","s":"17.5 Nerve Injury: Recognition and Work-Up","q":"In the 32-study review, how often was permanent neuropathy found across the peripheral block studies?","o":["Permanent neuropathy occurred in one in ten blocks in the studies reviewed","Only one permanent neuropathy was found across 16 studies","Ten permanent neuropathies in 16 studies","None, and no long-term injury was reported anywhere","Permanent neuropathy occurred in every study"],"k":1,"e":"Long-term injury after central block was 0 to 4.2 per 10,000 for spinal and 0 to 7.6 per 10,000 for epidural blocks, and only one permanent neuropathy was found across 16 peripheral block studies."},{"c":17,"id":"Q17-30","s":"17.6 Hematoma and Infection: Recognition and Escalation","q":"In the Swedish review of about 1.7 million neuraxial blocks, the risk of spinal hematoma varied widely. Which pair is correct?","o":["About 1 in 3,600 after an obstetric epidural and 1 in 200,000 in women having knee replacement","About 1 in 20 in both groups","About 1 in 2 million in both groups","About 1 in 200 after an obstetric epidural and 1 in 36 in women having a knee replacement operation","About 1 in 200,000 after an obstetric epidural and 1 in 3,600 in women having knee replacement"],"k":4,"e":"The risk was lowest in obstetric epidurals and highest in women having knee replacement."},{"c":17,"id":"Q17-31","s":"17.6 Hematoma and Infection: Recognition and Escalation","q":"A patient with a neuraxial block develops leg weakness. What was the usual first sign in the reviews of hematoma cases?","o":["Severe back pain in nearly every case of spinal hematoma that was reported","Fever and headache in most of the cases that were reviewed by the authors","Progression of a sensory or motor block, in 68% of cases; severe back pain was not typical","Bowel or bladder dysfunction in nearly every case that was reviewed in the series by the authors","A rise in blood pressure before any other deficit appeared in the patient"],"k":2,"e":"Progression of sensory or motor block was seen in 68% of cases and bowel or bladder dysfunction in 8%. Numbness or weakness is easy to blame on a long-acting drug, which delays the diagnosis."},{"c":17,"id":"Q17-32","s":"17.6 Hematoma and Infection: Recognition and Escalation","q":"In the Swedish series of 33 patients with spinal hematoma, how many recovered, and what did the authors attribute this to?","o":["Only 5 of 33 recovered, attributed by the authors to delays in diagnosis and treatment","Thirty of 33 recovered, because of rapid treatment and early imaging in most patients seen","Only 5 recovered, because the hematomas were all small and spread across few segments","All 33 recovered fully once surgical decompression had been done in each case","None recovered, because decompression is ineffective in this setting at any time"],"k":0,"e":"The authors attributed the poor recovery to delays in diagnosis and in treatment, which is why a new deficit is treated as a hematoma until imaging says otherwise."},{"c":17,"id":"Q17-33","s":"17.6 Hematoma and Infection: Recognition and Escalation","q":"The ASA and ASRA advisory on infectious complications of neuraxial techniques recommends which of the following?","o":["Change the epidural catheter every 24 hours in all patients receiving an infusion of local anesthetic","Limit disconnections, keep catheters short-term, consider filters","Leave catheters in place for as long as is practical in every single case","Disconnect the infusion often, so that the patient can move more freely around","Avoid cultures when an abscess is suspected, to prevent any contamination"],"k":1,"e":"The advisory also recommends culturing and imaging promptly when an abscess or a neurologic deficit is suspected."},{"c":17,"id":"Q17-34","s":"17.6 Hematoma and Infection: Recognition and Escalation","q":"Of the 127 severe complications in the Swedish review, how many patients had permanent neurologic damage?","o":["8","27","45","85","127"],"k":3,"e":"Of the 127 patients with severe neurologic complications, 85 had permanent damage."},{"c":17,"id":"Q17-35","s":"17.7 Debrief, Reporting, and Prevention","q":"Wrong-site nerve blocks made up what share of wrong-site procedures reported to the Pennsylvania Patient Safety Reporting System between 2004 and 2017, and what safeguards are named?","o":["About 2%; routine ultrasound","About 60%; patient self-marking only","Nearly 26%; a verbal check by the nurse only, at the time of the block","Nearly 26%; a site mark and a bedside time-out","About 5%; a second operator in all cases"],"k":3,"e":"The Principles for Reliable Performance of Correct-Site Nerve Blocks contain 21 principles, 12 for the process of care and 9 for facility structure and safety culture."},{"c":17,"id":"Q17-36","s":"17.7 Debrief, Reporting, and Prevention","q":"According to the 2025 ASRA time-out minimum, when should the time-out be repeated?","o":["Only once, in the preoperative holding area, and not again after","Immediately before the procedure and again whenever something changes, such as the position","Only after the block has been placed, as a final check of the site","Only when the surgeon asks for it during the operation itself","Only when the patient is already under general anesthesia"],"k":1,"e":"The time-out is done immediately before the procedure and again when something changes, such as the position, with all providers stopping and taking part."},{"c":17,"id":"Q17-37","s":"17.7 Debrief, Reporting, and Prevention","q":"Why is toxicity reporting described as weak, particularly for catheter and infusion cases?","o":["Toxicity never occurs with catheters, so there is nothing at all that needs to be reported or recorded","All published trials report every adverse event in full detail in their results","Reporting is mandatory worldwide and complete for every infusion that is given","Only single-shot blocks are reportable to a local safety system or to a registry","Detection is weakest there, and 18 of 68 lidocaine infusion trials did not report adverse events"],"k":4,"e":"Standardized reporting is weak, and a Cochrane review of 68 lidocaine infusion trials found that 18 did not report adverse events at all. Report toxicity events to the local safety system and, if possible, to a registry."},{"c":17,"id":"Q17-38","s":"17.1 Block Failure and Rescue Strategies","q":"A block fails completely. You consider simply repeating the injection to get the numbness you wanted. Why does a complete failure raise your concern about toxicity?","o":["A complete failure usually means the injection went into muscle, where uptake into the blood is faster, so a repeat injection raises the risk of toxicity","A complete failure means the injection went into the nerve, so a repeat injection will cause nerve injury","A complete failure means the drug was too dilute, so a repeat injection is safe at any dose","A complete failure means the patient has an allergy, so a repeat injection will cause anaphylaxis","A complete failure means the needle was in a vessel, so a repeat injection is the safest option"],"k":0,"e":"A complete failure usually means the injection went into muscle, where uptake into the blood is faster than around a nerve, so the risk of toxicity with a repeat injection rises. Count the dose already given before you inject again. Do not read a failed block as a sign that you can safely inject more."},{"c":17,"id":"Q17-39","s":"17.6 Hematoma and Infection: Recognition and Escalation","q":"A patient with a spinal hematoma is considered for surgery. In the case series summarized by Horlocker, how did the recovery vary with the time from the onset of paralysis to surgery?","o":["Within 8 hours, 2 of 12 had recovery; at 8 to 24 hours, 3 of 7 did; after more than 24 hours, 10 of 13 did","Recovery was the same in every group, whatever the delay","Within 8 hours, 13 of 13 had full recovery, and no patient recovered after 8 hours","Recovery was better when surgery was delayed for more than 24 hours, to let the swelling settle","Within 8 hours, 10 of 13 recovered well or partly; at 8 to 24 hours, 3 of 7; after 24 hours, 2 of 12"],"k":4,"e":"Among patients operated within 8 hours of the onset of paralysis, 10 of 13 had good or partial recovery; among those operated at 8 to 24 hours, 3 of 7 did; and among those operated after more than 24 hours, 2 of 12 did. The numbers are small, so treat them as a reason for speed and not as a threshold. In the Swedish series only 5 of 33 patients with hematoma recovered, which the authors attributed to delays."},{"c":17,"id":"Q17-40","s":"17.6 Hematoma and Infection: Recognition and Escalation","q":"A patient who had a spinal anesthetic yesterday still has a leg block that seems to be progressing, but denies severe back pain. What does the reported experience with spinal hematoma suggest?","o":["A progressing sensory or motor block, not severe back pain; treat it as a hematoma until imaging says otherwise","Severe back pain, so the absence of back pain makes a hematoma unlikely and imaging can wait until the morning round","The usual first sign was a fever, so look for an infection first","A progressing block is expected for two days and needs no action","Wait 24 hours and re-examine before you arrange imaging"],"k":0,"e":"In reported spinal hematoma the first sign was usually progression of a sensory or motor block, not severe back pain. A new or progressing deficit after a neuraxial block is a hematoma until imaging says otherwise. Whether a hematoma ends in recovery depends on how early someone notices it. Do not let the absence of pain reassure you, and do not wait."}]}</script>
<script>
(function(){
var P=JSON.parse(document.getElementById('payload').textContent);
var Q=P.q,T=P.titles;window.BANK=Q;
var app=document.getElementById('app');
var perf={}; // in memory only
var S=null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function ids(ch){var r=[];for(var i=0;i<Q.length;i++)if(ch==null||Q[i].c===ch)r.push(i);return r}
function start(list,label){S={list:list,pos:0,label:label,ans:{},sel:{},rev:{}};render()}
function home(){
 S=null;var tot=Q.length,done=0,right=0;for(var k in perf){done++;if(perf[k])right++}
 var h='<h2>Start a set</h2><div class="row modes"><button class="primary" id="mix">Mixed set: 20 random questions</button><button id="weak">Weak-area drill: 20 questions</button></div>';
 h+='<p class="tag">The weak-area drill starts with questions you missed in this session, then fills the set from the chapters where you have scored lowest. Your score is kept only while this page is open.</p>';
 if(done)h+='<div class="score">This session: '+right+' correct of '+done+' answered ('+Math.round(100*right/done)+'%).</div>';
 h+='<h2>Choose a chapter</h2><ul class="chs">';
 for(var c=1;c<=17;c++){var n=ids(c).length;h+='<li><button class="name" data-ch="'+c+'">Chapter '+c+'. '+esc(T[c])+' <span>('+n+' questions)</span></button><button class="rnd" data-rnd="'+c+'" title="20 random questions from this chapter">Random 20</button></li>'}
 h+='</ul>';app.innerHTML=h;
 document.getElementById('mix').onclick=function(){start(shuffle(ids()).slice(0,20),'Mixed set')};
 document.getElementById('weak').onclick=weak;
 app.querySelectorAll('[data-ch]').forEach(function(b){b.onclick=function(){var c=+b.dataset.ch;start(ids(c),'Chapter '+c)}});
 app.querySelectorAll('[data-rnd]').forEach(function(b){b.onclick=function(){var c=+b.dataset.rnd;start(shuffle(ids(c)).slice(0,20),'Chapter '+c+', random 20')}});
 window.scrollTo(0,0)}
function weak(){
 var missed=[],i;for(i=0;i<Q.length;i++)if(perf[i]===false)missed.push(i);
 var list=shuffle(missed).slice(0,20);
 if(list.length<20){var st={};for(i=0;i<Q.length;i++){if(perf[i]!==undefined){var c=Q[i].c;st[c]=st[c]||[0,0];st[c][1]++;if(perf[i])st[c][0]++}}
  var order=Object.keys(st).map(Number).sort(function(a,b){return st[a][0]/st[a][1]-st[b][0]/st[b][1]});
  var pool=[];order.forEach(function(c){shuffle(ids(c)).forEach(function(j){if(list.indexOf(j)<0&&perf[j]===undefined)pool.push(j)})});
  var rest=shuffle(ids()).filter(function(j){return list.indexOf(j)<0&&pool.indexOf(j)<0&&perf[j]===undefined});
  pool=pool.concat(rest);while(list.length<20&&pool.length)list.push(pool.shift())}
 start(list,'Weak-area drill')}
function render(){
 if(S.pos>=S.list.length)return summary();
 var qi=S.list[S.pos],q=Q[qi],rev=S.rev[qi],sel=S.sel[qi];
 var h='<div class="bar"><span>'+esc(S.label)+': question '+(S.pos+1)+' of '+S.list.length+'</span><span id="sc"></span></div>';
 h+='<div class="tag">Chapter '+q.c+(q.s?', '+esc(q.s.replace(/^Ch \d+,?\s*/,'').replace(/^section /i,'Section ')):'')+'</div>';
 h+='<p class="stem" id="stem">'+esc(q.q)+'</p><ul class="opts">';
 for(var i=0;i<5;i++){var cl='opt';if(rev){if(i===q.k)cl+=' right';else if(i===sel)cl+=' wrong'}else if(i===sel)cl+=' sel';
  h+='<li><button class="'+cl+'" data-o="'+i+'"'+(rev?' disabled':'')+'><span class="l">'+'ABCDE'[i]+'</span><span>'+esc(q.o[i])+'</span></button></li>'}
 h+='</ul><div class="row"><button class="primary" id="show"'+(rev?' disabled':'')+'>Show Answer</button><button id="jump">Jump to explanation</button></div>';
 h+='<div id="ex" class="exp'+(rev?'':' hidden')+'"><div id="verdict" class="verdict"></div><h3>Explanation (correct answer: '+'ABCDE'[q.k]+')</h3><div>'+esc(q.e)+'</div><div class="row"><button id="back">Back to question</button></div></div>';
 h+='<div class="row"><button id="prev"'+(S.pos?'':' disabled')+'>Previous</button><button id="next">'+(S.pos===S.list.length-1?'Finish':'Next')+'</button><button id="quit">Quit to menu</button></div>';
 app.innerHTML=h;score();if(rev)verdict(qi);
 app.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(){S.sel[qi]=+b.dataset.o;render()}});
 document.getElementById('show').onclick=function(){reveal(qi)};
 document.getElementById('jump').onclick=function(){if(!S.rev[qi])reveal(qi);document.getElementById('ex').scrollIntoView({behavior:'smooth',block:'start'})};
 document.getElementById('back').onclick=function(){document.getElementById('stem').scrollIntoView({behavior:'smooth',block:'start'})};
 document.getElementById('prev').onclick=function(){S.pos--;render();window.scrollTo(0,0)};
 document.getElementById('next').onclick=function(){S.pos++;render();window.scrollTo(0,0)};
 document.getElementById('quit').onclick=home}
function reveal(qi){var q=Q[qi];S.rev[qi]=true;if(S.sel[qi]!==undefined){perf[qi]=(S.sel[qi]===q.k)}var p=S.pos;render();
 document.getElementById('ex').classList.remove('hidden')}
function verdict(qi){var q=Q[qi],v=document.getElementById('verdict'),s=S.sel[qi];
 if(s===undefined){v.className='verdict';v.textContent='You did not choose an answer, so this question is not scored.'}
 else if(s===q.k){v.className='verdict ok';v.textContent='Correct.'}else{v.className='verdict no';v.textContent='Not quite. You chose '+'ABCDE'[s]+'.'}}
function score(){var n=0,r=0;S.list.forEach(function(i){if(S.rev[i]&&S.sel[i]!==undefined){n++;if(S.sel[i]===Q[i].k)r++}});document.getElementById('sc').textContent='Score: '+r+' / '+n}
function summary(){
 var n=0,r=0,by={},missed=[];S.list.forEach(function(i){if(S.rev[i]&&S.sel[i]!==undefined){n++;var c=Q[i].c;by[c]=by[c]||[0,0];by[c][1]++;if(S.sel[i]===Q[i].k){r++;by[c][0]++}else missed.push(i)}});
 var h='<h2>Set complete</h2><div class="score">'+esc(S.label)+': '+r+' correct of '+n+' scored'+(n?' ('+Math.round(100*r/n)+'%)':'')+' out of '+S.list.length+' questions.</div>';
 var keys=Object.keys(by).map(Number).sort(function(a,b){return a-b});
 if(keys.length){h+='<table><tr><th>Chapter</th><th>Correct</th></tr>';keys.forEach(function(c){h+='<tr><td>'+c+'. '+esc(T[c])+'</td><td>'+by[c][0]+' / '+by[c][1]+'</td></tr>'});h+='</table>'}
 h+='<div class="row"><button class="primary" id="rev"'+(missed.length?'':' disabled')+'>Review missed ('+missed.length+')</button><button id="again">Repeat this set</button><button id="menu">Back to menu</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 document.getElementById('rev').onclick=function(){start(missed.slice(),'Missed questions')};
 document.getElementById('again').onclick=function(){var l=S.list.slice(),lb=S.label;start(l,lb)};
 document.getElementById('menu').onclick=home}
home()})();
</script></body></html>
