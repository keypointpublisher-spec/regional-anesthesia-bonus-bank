 section 8.1","q":"A 30-year-old man has a femoral nerve injury and you review the lumbar plexus. From which spinal roots does the plexus form?","o":["C5 to T1","L1 to S1","T12 to L4","T4 to L1","L4 to S3"],"k":2,"e":"The lumbar plexus forms from the T12 to L4 roots inside the posterior part of the psoas major muscle."},{"c":8,"id":"8.B02","s":"Ch 8, section 8.1","q":"Which nerve arises from L2 and L3 and carries sensation only, with no motor supply?","o":["Lateral femoral cutaneous nerve","Saphenous nerve","Genitofemoral nerve","Obturator nerve","Femoral nerve"],"k":0,"e":"The lateral femoral cutaneous nerve (L2, L3) is a pure sensory nerve to the lateral thigh. The femoral and obturator nerves carry motor fibers."},{"c":8,"id":"8.B03","s":"Ch 8, section 8.1","q":"A patient has weakness of thigh adduction after a pelvic operation. Which nerve supplies the adductor muscles of the thigh?","o":["Genitofemoral nerve","Lateral femoral cutaneous nerve","Obturator nerve","Femoral nerve","Sciatic nerve"],"k":2,"e":"The obturator nerve supplies the adductor muscles of the thigh and a variable patch of medial thigh skin."},{"c":8,"id":"8.B04","s":"Ch 8, section 8.1","q":"Which nerve gives sensation to the medial leg and foot and is a branch of the femoral nerve?","o":["Sural nerve","Obturator nerve","Saphenous nerve","Lateral femoral cutaneous nerve","Superficial peroneal nerve"],"k":2,"e":"The saphenous nerve (L3, L4) is the femoral branch that supplies the medial leg and foot."},{"c":8,"id":"8.B05","s":"Ch 8, section 8.1","q":"Why is no single block a perfect hip block?","o":["The hip is supplied only by the sciatic nerve","All hip branches leave the pelvis through the sciatic notch","The hip is supplied only by the lumbar plexus roots directly","The hip capsule is supplied by articular branches of several nerves, including the femoral, obturator and accessory obturator","The hip capsule has no sensory supply"],"k":3,"e":"The anterior capsule receives articular branches from the femoral nerve and from the obturator nerve and its accessory branch, so covering the hip means choosing which nerves to reach."},{"c":8,"id":"8.B06","s":"Ch 8, section 8.1","q":"In what proportion of patients is an accessory obturator nerve described, according to the teaching source reviewed?","o":["In every patient","About 90%","Roughly 8% to 30%","About 50%","Less than 1%"],"k":2,"e":"An accessory obturator nerve is present in roughly 8% to 30% of patients, arises from L3 and L4, and supplies the hip joint."},{"c":8,"id":"8.B07","s":"Ch 8, section 8.2","q":"You are scanning for the femoral nerve and see the deep femoral artery beside the main vessel. What should you do?","o":["Scan more proximally to see the nerve before it divides","Move distally to the knee","Inject at this level without further scanning","Switch to an out-of-plane approach at the deep femoral artery","Stop and use a general anesthetic"],"k":0,"e":"If the deep femoral artery is visible, the nerve has begun to divide, and scanning more proximally allows you to see it before it divides."},{"c":8,"id":"8.B08","s":"Ch 8, section 8.2","q":"Which of the following is a recognized risk of an out-of-plane approach in femoral nerve block?","o":["Spinal cord injury from a needle placed too deep","Pneumothorax from the needle passing through the pleura","Brachial plexus injury","A higher risk to the nerve","Phrenic palsy"],"k":3,"e":"An out-of-plane approach carries a higher risk to the nerve, which is one reason an in-plane approach is preferred."},{"c":8,"id":"8.B09","s":"Ch 8, section 8.2","q":"A cadaver study of suprainguinal fascia iliaca block found that about 62.5 mL of dye was needed to stain the femoral, lateral femoral cutaneous and obturator nerves in 90% of specimens. How should this be interpreted?","o":["It shows how large a volume spreads in a cadaver and is not a recommended dose for patients","It shows small volumes are always sufficient for blocking all three nerves in living patients","It is the standard clinical dose","It proves the obturator nerve is always blocked whenever the fascia iliaca block is performed","It applies only to the infrainguinal approach"],"k":0,"e":"The volume is much larger than clinicians usually inject. Dye in a cadaver is not local anesthetic in a living patient, so it is a reminder of spread, not a dose."},{"c":8,"id":"8.B10","s":"Ch 8, section 8.2","q":"An emergency department compares fascia iliaca block with femoral 3-in-1 block in 178 patients with a femoral neck fracture. What was concluded for pain at 60 minutes?","o":["Neither reduced pain","The two were equivalent","Fascia iliaca doubled opioid use","3-in-1 was much better","Fascia iliaca was much better"],"k":1,"e":"Pain at 60 minutes was equivalent between the two blocks, with a mean difference of about 3 mm on a 100 mm scale."},{"c":8,"id":"8.B11","s":"Ch 8, section 8.2","q":"In an 87-patient trial of femoral nerve block versus fascia iliaca block for femoral fractures, which finding was reported?","o":["Success rates differed by 40%","Neither block reduced fentanyl use","Femoral block took longer and gave worse pain relief","Pain at 60 minutes and fentanyl use were lower after femoral nerve block, and the fascia iliaca block was quicker to perform","Fascia iliaca block was clearly more successful"],"k":3,"e":"Success rates were almost identical (82.5% and 83.0%), but the femoral block gave lower pain at 60 minutes and less fentanyl, and the fascia iliaca block took two minutes less."},{"c":8,"id":"8.B12","s":"Ch 8, section 8.3","q":"You plan a lateral femoral cutaneous nerve block. Which landmark is most reliable?","o":["The patella and the tibial tuberosity, which are the landmarks for the infrapatellar branches","The lateral edge of the sartorius muscle below the anterior superior iliac spine","The femoral artery at the groin crease, which lies medial to the nerve in the femoral triangle","The pubic tubercle","The greater trochanter"],"k":1,"e":"The lateral edge of the sartorius is the landmark that does not change; the nerve lies in the plane between the tensor fasciae latae and the sartorius."},{"c":8,"id":"8.B13","s":"Ch 8, section 8.3","q":"A skin graft will be taken from the lateral thigh and a surgeon asks about the nerve. In about what proportion does the lateral femoral cutaneous nerve also supply part of the anterior thigh?","o":["About 90%","About 45%","Never","About 100%","About 5%"],"k":1,"e":"The territory varies; in about 45% of patients the nerve also supplies part of the anterior thigh."},{"c":8,"id":"8.B14","s":"Ch 8, section 8.3","q":"In a case series of 30 patients, the interfascial obturator block placed local anesthetic between which planes?","o":["Between pectineus and adductor brevis, then between adductor brevis and adductor magnus","Between psoas and iliacus, deep to the iliacus fascia in the pelvis near the inguinal ligament","Between sartorius and rectus femoris, in the anterior compartment of the thigh below the femoral triangle","Between vastus medialis and lateralis","Between gluteus maximus and minimus"],"k":0,"e":"Half the volume was injected between pectineus and adductor brevis, then the needle was advanced to the plane between adductor brevis and adductor magnus. 28 of 30 patients lost at least half their thigh adduction strength at 15 minutes."},{"c":8,"id":"8.B15","s":"Ch 8, section 8.3","q":"An orthopedic surgeon asks for an obturator nerve block to prevent the adductor jerk during transurethral bladder tumor resection. Is this a reasonable use?","o":["Yes; prevention of adductor jerk is a recognized use","No; it blocks the diaphragm and would cause respiratory compromise","No; the obturator nerve has no motor fibers and so cannot cause the jerk","No; it only supplies the skin","Yes, but only by a landmark hip injection"],"k":0,"e":"Obturator block is used for medial knee analgesia as a supplement, relief of adductor spasm and prevention of the adductor jerk during transurethral bladder surgery. It is not a hip block."},{"c":8,"id":"8.B16","s":"Ch 8, section 8.4","q":"The first description of the PENG block was in which type of report?","o":["A large randomized trial with several hundred hip fracture patients","A case series of five patients with hip fracture","A registry of 500 patients","A Cochrane review of randomized trials of hip blocks","A cadaver-only study"],"k":1,"e":"The original description was a case series of five patients with hip fracture, using anatomy from an earlier anatomical study."},{"c":8,"id":"8.B17","s":"Ch 8, section 8.4","q":"A surgeon plans a lateral approach to the hip, and a PENG block is given. What additional step may be needed for the lateral incision?","o":["Nothing; PENG covers the skin of the lateral thigh and the incision","A lateral femoral cutaneous nerve block or surgical infiltration","A sciatic nerve block only","An interscalene block","A caudal block"],"k":1,"e":"PENG targets the anterior capsule and does not cover the skin of the lateral thigh or a lateral incision, so a lateral femoral cutaneous block or surgical infiltration is added."},{"c":8,"id":"8.B18","s":"Ch 8, section 8.4","q":"A systematic review pooled six trials of PENG versus fascia iliaca block for hip surgery. Which result was reported?","o":["Pain scores were similar, 24-hour opioid use was lower after PENG, and motor data were inconsistent","Fascia iliaca block reduced opioid use by half","PENG caused more pain at 24 hours","No trials reported opioid use","PENG clearly preserved quadriceps strength in all trials"],"k":0,"e":"Pain scores were not different and opioid use was lower after PENG by about 8.6 oral morphine milligram equivalents, but data on quadriceps strength were few and inconsistent."},{"c":8,"id":"8.B19","s":"Ch 8, section 8.4","q":"According to a Cochrane review, nerve blocks for hip fracture reduced chest infection with what certainty of evidence?","o":["The effect was harmful","High certainty","Very low certainty","No evidence was found","Moderate certainty"],"k":4,"e":"Nerve blocks probably reduced chest infection (relative risk 0.41, moderate certainty), whereas pain on movement and acute confusion were rated high certainty."},{"c":8,"id":"8.B20","s":"Ch 8, section 8.4","q":"In the Cochrane review of nerve blocks for hip fracture, what was the finding for death within six months?","o":["Blocks doubled mortality","Mortality was unchanged with high certainty","Mortality was not measured","Blocks halved mortality","The effect was uncertain"],"k":4,"e":"The effect on death within six months was uncertain, and myocardial infarction was too rare in the trials to judge."},{"c":8,"id":"8.B21","s":"Ch 8, section 8.5","q":"After total knee replacement, a patient with a femoral nerve block cannot lift the leg. In a randomized trial, what happened to quadriceps strength after a femoral block compared with an adductor canal block?","o":["Strength was identical after both","Strength fell to 16% of baseline after the femoral block and was well preserved after the adductor canal block, with similar pain","Pain was much worse with the adductor canal block","Strength fell more after the adductor canal block","Neither block affected strength"],"k":1,"e":"In a trial of 50 patients, quadriceps strength fell to 16% of baseline after the femoral block, was well preserved after the adductor canal block, and pain scores were similar."},{"c":8,"id":"8.B22","s":"Ch 8, section 8.5","q":"On ultrasound at the adductor canal, where does the saphenous nerve lie?","o":["Inside the wall of the femoral artery, within the adventitia","Medial to the gracilis","Lateral to the vastus lateralis, beside the iliotibial tract","Posterolateral to the artery","Anteromedial to the femoral artery, deep to the sartorius"],"k":4,"e":"The saphenous nerve is a bright, oval structure anteromedial to the artery, deep to the sartorius, with the nerve to the vastus medialis anterolateral to the artery."},{"c":8,"id":"8.B23","s":"Ch 8, section 8.5","q":"An adductor canal block is performed with a trans-sartorial approach. Which sign suggests the tip is NOT in the canal?","o":["Fluid spreads in a semilunar pattern anteromedial to the artery","The injection is easy","The artery moves away from the needle","The saphenous nerve is surrounded by fluid","The sartorius lifts before the artery moves"],"k":4,"e":"The endpoint is a semilunar spread anteromedial to the nerve and artery. If the sartorius lifts before the artery moves, the tip is probably not in the canal."},{"c":8,"id":"8.B24","s":"Ch 8, section 8.5","q":"Which area does an adductor canal block NOT cover?","o":["The anteromedial knee","The skin over the medial malleolus","The medial foot","The posterior knee","The medial leg"],"k":3,"e":"The block covers the anteromedial knee and the medial leg and foot through the saphenous nerve. It does not cover the posterior or lateral knee."},{"c":8,"id":"8.B25","s":"Ch 8, section 8.5","q":"A 62-year-old is having total knee replacement. A colleague suggests a large volume adductor canal injection to improve coverage. What is the main concern?","o":["Larger volumes cause pneumothorax","Larger volumes are ineffective because the nerve is blocked by the first few milliliters","Larger volumes block the diaphragm","Larger volumes may spread proximally to the femoral nerve and weaken the quadriceps","Larger volumes block the sciatic nerve"],"k":3,"e":"Use the smallest volume that spreads around the saphenous nerve. Larger volumes can reach the femoral nerve and weaken the quadriceps."},{"c":8,"id":"8.B26","s":"Ch 8, section 8.6","q":"A patient with a femoral neck fracture needs pain relief during positioning for a spinal anesthetic. Which block is suggested by the choice table?","o":["Obturator block alone, injected between the adductor muscles","Digital block at the base of the toe","PENG block with a low volume","Sciatic nerve block","Adductor canal block"],"k":2,"e":"For pain during positioning for a spinal, the PENG block is the first choice, with 20 mL giving similar pain relief to 30 mL and less weakness."},{"c":8,"id":"8.B27","s":"Ch 8, section 8.6","q":"For analgesia after total knee replacement, what should be added to an adductor canal block for the posterior knee?","o":["An interscalene block","A cervical plexus block","A digital block","A caudal block","A posterior knee block"],"k":4,"e":"The adductor canal block does not cover the posterior knee, so a posterior knee block is added."},{"c":8,"id":"8.B28","s":"Ch 8, section 8.6","q":"A patient has medial knee pain after surgery. What supplementary block may help?","o":["Obturator block, because the posterior branch may reach the medial knee","Ankle block of the saphenous nerve and the posterior tibial nerve at the malleolus","Lateral femoral cutaneous block","Pudendal block","Stellate ganglion block"],"k":0,"e":"The obturator posterior branch is mainly motor but may give articular branches to the medial knee, so an obturator block is a supplement for medial knee pain."},{"c":8,"id":"8.B29","s":"Ch 8, section 8.6","q":"A patient with a leg fracture is given a regional block. What special concern applies?","o":["Blocks cause compartment syndrome by raising tissue pressure in the limb","Blocks cure compartment syndrome by relieving the pain in the limb","Pain after a block is always benign","Blocks are contraindicated in all fractures","A block must not be relied on to hide compartment syndrome"],"k":4,"e":"Pain out of proportion and a tense leg are warning signs of compartment syndrome. A block may mask them, so do not rely on a block to hide it."},{"c":8,"id":"8.B30","s":"Ch 8, section 8.6","q":"After a femoral nerve block, what instruction protects the patient on the ward?","o":["Encourage immediate unassisted walking to prevent stiffness in the knee","Discontinue all analgesics","Remove the dressing early","Apply ice only","Do not allow unassisted standing, because the quadriceps may be weak"],"k":4,"e":"Quadriceps weakness is a fall risk. Tell the patient and the nurses and do not allow unassisted walking after a femoral block."},{"c":8,"id":"8.B31","s":"Ch 8, section 8.6","q":"A patient on an anticoagulant needs a fascia iliaca block for a hip fracture. What is the correct first step?","o":["Proceed regardless because it is a superficial block","Check the agent, the time of the last dose and kidney function against the current anticoagulation guideline","Inject a larger volume to compensate","Cancel all regional anesthesia permanently","Give protamine before the block"],"k":1,"e":"Anticoagulation timing rules come from the current guideline, and the agent, the dose and kidney function decide whether a block can proceed."},{"c":8,"id":"8.B32","s":"Ch 8, section 8.2","q":"A 72-year-old man with a hip fracture receives a fascia iliaca block. Which nerves does the block usually reach?","o":["The saphenous nerve only","The femoral nerve almost always and the lateral femoral cutaneous nerve in most patients, with the obturator nerve often spared","The genitofemoral nerve only","The obturator nerve reliably but not the femoral nerve","The sciatic nerve and the pudendal nerve"],"k":1,"e":"The fascia iliaca block reaches the femoral nerve and usually the lateral femoral cutaneous nerve. The obturator nerve is often spared, and the anterior branch must be blocked separately if needed."},{"c":8,"id":"8.B33","s":"Ch 8, section 8.4","q":"What is the anatomical idea behind the PENG block?","o":["To block the obturator nerve in the canal","To anesthetize the skin of the lateral thigh","To block the lumbar plexus inside the psoas","To block the sensory articular branches to the anterior hip capsule while sparing the motor branches of the femoral nerve","To block the sciatic nerve at the greater sciatic notch"],"k":3,"e":"The block targets the articular branches of the femoral and accessory obturator nerves to the anterior capsule and aims to leave the motor branches of the femoral nerve alone."},{"c":8,"id":"8.B34","s":"Ch 8, section 8.1","q":"Which muscles does the femoral nerve supply?","o":["Gastrocnemius and soleus","Tibialis anterior and extensor hallucis longus","Adductor longus and gracilis","Quadriceps, sartorius and articularis genu","Hamstrings and gluteus maximus"],"k":3,"e":"The femoral nerve is the largest branch of the lumbar plexus and supplies the quadriceps, sartorius and articularis genu muscles."},{"c":8,"id":"8.B35","s":"Ch 8, section 8.1","q":"The genitofemoral nerve arises from L1 and L2. Into which branches does it divide?","o":["A medial and lateral plantar branch to the sole of the foot","A cutaneous branch to the knee only, with no genital component","A genital branch and a femoral branch to the upper thigh","An anterior and a posterior branch to the buttock","A saphenous and a sural branch"],"k":2,"e":"The genitofemoral nerve (L1, L2) divides into a genital branch and a femoral branch to the upper thigh."},{"c":8,"id":"8.B36","s":"Ch 8, section 8.5","q":"A study of 190 patients mapped the adductor canal using a skeletal landmark. Which landmark lay within the canal in 182 of 190?","o":["The pubic symphysis","The inguinal crease","The midpoint between the greater trochanter and the superior edge of the patella","The tibial tuberosity","The midpoint of the line from the anterior superior iliac spine to the patella, in the middle of the thigh"],"k":2,"e":"The midpoint between the greater trochanter and the superior edge of the patella lay within the canal in 182 of 190 patients, in agreement with the finding that the traditional thigh midpoint lies above the canal."},{"c":8,"id":"8.B37","s":"Ch 8, section 8.4","q":"In the Cochrane review of nerve blocks for hip fracture, by about how much was time to first mobilization shortened?","o":["About 10.8 hours (moderate certainty)","About 3 days","About 30 minutes","About 108 hours","It was lengthened by about 10 hours"],"k":0,"e":"Nerve blocks shortened the time to first mobilization by about 10.8 hours, with moderate certainty."},{"c":8,"id":"8.B38","s":"Ch 8, section 8.2","q":"You perform a fascia iliaca block in the emergency department and the ultrasound shows the local anesthetic spreading above the fascia. What is the right approach to the volume and the needle?","o":["The block depends on a very small volume, so stop injecting and accept the spread above the fascia","The block depends on spread inside the femoral artery, so move the needle toward the vein","The block depends on spread under the fascia, so use a high volume; spread above the fascia or into muscle means the needle must be moved","The block depends on spread inside the muscle, so inject deeper into the iliopsoas","The block depends on an ultrasound-guided catheter, so no further needle changes are needed"],"k":2,"e":"A fascia iliaca block uses a high volume, because the block depends on spread under the fascia, toward the femoral nerve medially and under the sartorius laterally. Spread above the fascia or into muscle means the needle must be moved, because it gives no block. The femoral and lateral femoral cutaneous nerves are the usual result, and the obturator nerve is often spared."},{"c":8,"id":"8.B39","s":"Ch 8, section 8.4","q":"You prepare to perform a PENG block. Which probe and orientation are described?","o":["A high-frequency linear probe, above 10 MHz, held transverse at the femoral crease over the femoral vessels","A curved probe, 3 to 5 MHz, held transverse over the greater trochanter at the level of the femoral head","A linear probe, 10 to 15 MHz, oriented along the line from the umbilicus to the xiphoid","A phased-array probe held in the parasagittal plane at L3","A curved probe, 3 to 5 MHz, oriented along the line from the anterior superior iliac spine toward the pubis"],"k":4,"e":"For a PENG block, position the patient supine and use a curved probe at 3 to 5 MHz, oriented along the line from the anterior superior iliac spine toward the pubis. The needle comes in plane from lateral to medial, with the tip on the bone in the groove between the iliopsoas tendon and the iliopubic eminence. A linear probe at the femoral crease is for the femoral nerve."},{"c":8,"id":"8.B40","s":"Ch 8, section 8.2","q":"You scan the femoral crease with a linear probe before a femoral nerve block. Where does the femoral nerve lie?","o":["Medial to the femoral vein, above the fascia iliaca and below the skin, about 0.5 cm deep, beside the pectineus","Between the femoral artery and the vein, under the inguinal ligament, about 6 cm deep, beside the psoas tendon","Lateral to the femoral artery, under the fascia iliaca and above the iliopsoas, about 2 to 4 cm deep","Lateral to the iliopsoas muscle and deep to the sartorius, about 8 cm deep","Medial to the femoral vein and below the pectineus, about 4 cm deep"],"k":2,"e":"The femoral nerve lies lateral to the femoral artery, under the fascia iliaca and above the iliopsoas muscle, at a depth of about 2 to 4 cm at the femoral crease, and the femoral vein lies medial to the artery. Find the artery and vein first, then look lateral for the bright, triangular or oval nerve."},{"c":9,"id":"9.B01","s":"Ch 9, section 9.1","q":"A 52 year old man is having fixation of a medial malleolus fracture under a popliteal sciatic block. He asks why the surgeon also wants the inner side of the leg numb. What is the anatomical reason a saphenous block is added?","o":["The saphenous nerve is the third terminal branch of the sciatic nerve in most patients","The saphenous nerve is a branch of the femoral nerve, not part of the sciatic nerve","The tibial component of the sciatic nerve does not reach the ankle or the medial malleolus","The popliteal block always spares the medial side of the thigh","The common peroneal nerve supplies the medial malleolus"],"k":1,"e":"The sciatic nerve supplies the leg and foot below the knee except the inner side. The inner leg and ankle are supplied by the saphenous nerve, a branch of the femoral nerve, so almost every foot and ankle plan pairs a sciatic block with a saphenous block."},{"c":9,"id":"9.B02","s":"Ch 9, section 9.1","q":"You scan a patient's right popliteal fossa at the crease and see two separate nerves. A colleague suggests injecting around each. You want a single injection around both components. What is the best next step?","o":["Tilt the probe caudally until the two nerves merge into a single round structure","Inject at the crease anyway, because the nerves always share a sheath there","Slide the probe proximally until the two nerves come together in one sheath","Switch to a subgluteal approach","Ask the patient to flex the knee to bring the two nerves together in one sheath"],"k":2,"e":"The point of division varies, and in a volunteer ultrasound study the mean distance from the crease was close to 6 cm. A popliteal block is done where the scan shows the nerve beginning to part, so you scan proximally first."},{"c":9,"id":"9.B03","s":"Ch 9, section 9.1","q":"A 36 year old woman is having bilateral foot surgery. You measured the level at which the sciatic nerve divides on her right leg. What can you assume about the left leg?","o":["It is the same, because the division level is symmetrical between the legs of any person","It may differ: in over a quarter of volunteers the legs differed by more than 2 cm","It is always more proximal than the right, because the left nerve is larger","It is always at the popliteal crease in both legs of every adult","It can be predicted from her height and weight measured before the block"],"k":1,"e":"In the volunteer study, 28% had legs that differed by more than 2 cm in the level of division. Each leg should therefore be scanned on its own."},{"c":9,"id":"9.B04","s":"Ch 9, section 9.1","q":"A resident asks whether you can predict from a patient's sex and body habitus how far above the popliteal crease the sciatic nerve will divide. What does the volunteer ultrasound study support?","o":["No measured patient characteristic predicted the level well, so each leg is scanned","Division is always above 7 cm in men and below 5 cm in women","Division is always within 2 cm of the crease in women of any size","Body mass index predicts the division level accurately in adults","Height alone predicts the division level to within a millimeter"],"k":0,"e":"The mean distances were similar in women and men, 5.77 cm and 6.02 cm, and none of the measured characteristics predicted the level well. The only reliable method is to look at each leg with ultrasound."},{"c":9,"id":"9.B05","s":"Ch 9, section 9.1","q":"During a popliteal block the consensus text describes a subparaneural injection. Where does the local anesthetic go?","o":["Inside the epineurium of the tibial nerve, deep to the perineurium of the fascicles within the trunk","In the subcutaneous fat superficial to the biceps femoris","Between the popliteal artery and the femur","In the fascial plane between gluteus maximus and quadratus femoris, deep to the sciatic nerve in the buttock","Inside the paraneural sheath and outside the epineurium of the individual nerves"],"k":4,"e":"Subparaneural means within the outer paraneural envelope but outside the epineurium that covers each nerve. This position lets the injectate reach both components sharing the sheath without entering either nerve."},{"c":9,"id":"9.B06","s":"Ch 9, section 9.1","q":"After a popliteal sciatic block, a patient cannot lift the foot but has intact sensation on the sole. Which component of the nerve is most affected?","o":["The common peroneal component","The tibial component","The saphenous nerve","The posterior femoral cutaneous nerve","The sural nerve alone"],"k":0,"e":"The common peroneal component supplies the muscles that lift the foot and sensation to the outer leg and top of the foot. The tibial component supplies the calf muscles and the sole."},{"c":9,"id":"9.B07","s":"Ch 9, section 9.2","q":"A 110 kg man is having a hamstring tendon repair and you plan a high sciatic block. You place the curvilinear probe at the gluteal fold. Which landmarks should you find first to locate the sciatic nerve?","o":["The posterior superior iliac spine and the sacrum at the level of S2","The greater trochanter and the ischial tuberosity","The lateral epicondyle and the head of the fibula at the knee","The femoral artery and the inguinal ligament","The iliac crest and the twelfth rib"],"k":1,"e":"In the gluteal region the sciatic nerve lies between the greater trochanter and the ischial tuberosity, below the lower border of the gluteus maximus and on the quadratus femoris. Finding those two bony landmarks first keeps the probe over the nerve in a large patient, in whom gluteal tissue can blur the plane."},{"c":9,"id":"9.B08","s":"Ch 9, section 9.2","q":"A 68 year old woman is scheduled for a below knee amputation. Which regional plan covers the nerves that will be cut?","o":["A sciatic block combined with a saphenous or femoral block, possibly with catheters","An ankle block alone, because the sciatic nerve is not involved","A serratus anterior plane block combined with an erector spinae block","A parasternal intercostal plane block combined with a rectus sheath block","A rectus sheath block combined with an ilioinguinal block"],"k":0,"e":"For a below knee amputation, the nerve that is cut is the nerve that should be blocked. The sciatic and saphenous territories are both involved, so a sciatic block is combined with a saphenous or femoral block."},{"c":9,"id":"9.B09","s":"Ch 9, section 9.2","q":"In the subgluteal space technique, where does the local anesthetic spread to reach the sciatic nerve?","o":["Between the popliteal artery and the femur, behind the knee capsule","Between the biceps femoris tendon and the semitendinosus, at the knee","Beneath the piriformis within the pelvis","In the plane between the gluteus maximus and the quadratus femoris","Inside the epineurium at the gluteal fold"],"k":3,"e":"The subgluteal space technique injects into the tissue plane between the gluteus maximus and quadratus femoris that surrounds the nerve. In a randomized comparison this took less time than injecting around the nerve at the infragluteal level."},{"c":9,"id":"9.B10","s":"Ch 9, section 9.2","q":"A patient will have a subgluteal sciatic block for foot surgery. Which area will remain sensate after a successful block?","o":["The sole of the foot","The outer leg","The back of the lower leg","The inner leg and ankle","The dorsum of the foot lateral to the extensor tendons"],"k":3,"e":"A sciatic block at the subgluteal level covers the sciatic territory below the gluteal fold. The inner leg and ankle are supplied by the saphenous nerve, which needs a separate block."},{"c":9,"id":"9.B11","s":"Ch 9, section 9.2","q":"A 70 year old man having total knee arthroplasty receives a parasacral ischial plane catheter in a study of 30 patients. Which complications were reported in the first stage?","o":["Two cases of foot drop and one hematoma at the insertion site","One catheter clog and two leaks at the insertion site","Three catheter displacements and one infection of the skin","Persistent sciatic neuropathy in two patients","Bladder retention in five patients"],"k":1,"e":"In the first stage the catheter was successful in 27 of 30 patients, 96.3% were in place on day 3, and the complications were one clog and two leaks at the insertion site. The study was a single arm proof of concept, so it supports feasibility and does not compare the technique with a randomized control."},{"c":9,"id":"9.B12","s":"Ch 9, section 9.2","q":"A 45 year old man has a pelvic fracture fixation needing sciatic coverage above the gluteal fold. Which approach reaches the nerve as it leaves the pelvis?","o":["Popliteal approach","Ankle block","Subgluteal approach","Parasacral approach","Iliohypogastric approach"],"k":3,"e":"The parasacral approach reaches the sciatic nerve or sacral plexus as it leaves the greater sciatic foramen below the piriformis. For a problem confined to the leg, the subgluteal approach is simpler."},{"c":9,"id":"9.B13","s":"Ch 9, section 9.3","q":"A 29 year old man with an external fixator on his lower leg needs a single injection popliteal sciatic block. The prone position is difficult. Which position works best?","o":["Sitting upright with the knee extended","Lateral decubitus with the operative leg down","Supine with the leg raised on folded blankets","Prone with the knee flexed","Supine with the leg abducted and externally rotated"],"k":2,"e":"For a single injection a supine position with the leg raised on folded blankets works well and is more comfortable, especially with an external fixator. A catheter is generally placed prone."},{"c":9,"id":"9.B14","s":"Ch 9, section 9.3","q":"While sliding the probe proximally in the popliteal fossa you see the two nerves look like a peanut or a figure of eight. What does this indicate?","o":["The sciatic nerve has already separated into its two branches long ago and cannot be seen","The tibial and common peroneal nerves are about to merge but still share a sheath","The probe is lying over the saphenous nerve and the great saphenous vein at the knee","The nerves have entered the epineurium of the femoral nerve itself","The popliteal vein is distended and compressing the nerve from behind"],"k":1,"e":"Just before the two components merge they appear as a peanut or a figure of eight. This is the level at which a single injection around both nerves is most reliable."},{"c":9,"id":"9.B15","s":"Ch 9, section 9.3","q":"You plan a popliteal sciatic catheter for a patient having a complex foot reconstruction. Where is the catheter best placed according to the published technique?","o":["At the point where the nerve divides","At the popliteal crease","About 5 cm above the point where the nerve divides","Below the division at the common peroneal nerve only","Within the epineurium of the tibial nerve"],"k":2,"e":"A published account favors a catheter placed about 5 cm above the point of division over one placed at the division, because of better analgesia. The same account recommends checking the catheter position with saline or air before relying on it."},{"c":9,"id":"9.B16","s":"Ch 9, section 9.3","q":"A randomized trial of 88 patients found that an intraneural popliteal injection worked faster than a subparaneural one. A resident concludes that you should deliberately inject inside the nerve. What is the best response?","o":["Correct, because success was higher and there were no changes in nerve function at follow up","Correct, but only if the injection is delivered under high pressure to ensure spread","No: both groups showed a subclinical drop in nerve action potential amplitude at 5 weeks","Incorrect, because the intraneural group had permanent clinical weakness at 6 months","Incorrect, because the trial found no difference in onset or success between the groups"],"k":2,"e":"Onset was 10 minutes against 25 minutes and success 95.3% against 62.5%, but electrophysiology at 5 weeks showed a small drop in sciatic action potential amplitude in both groups. Deliberate injection inside the nerve is not a recommended technique."},{"c":9,"id":"9.B17","s":"Ch 9, section 9.3","q":"During a popliteal block the patient complains of pain at injection and you see the nerve swell on the screen. Opening pressure is high. What should you do?","o":["Continue injecting more slowly to complete the block","Increase the injection pressure to overcome the resistance","Advance the needle deeper to the popliteal artery","Inject saline to confirm the position and then proceed","Stop, withdraw the needle a few millimeters and reassess"],"k":4,"e":"Pain, nerve swelling and high opening pressure suggest an intraneural injection. Stop, withdraw and reassess, and do not inject under resistance."},{"c":9,"id":"9.B18","s":"Ch 9, section 9.3","q":"A surgeon is performing a knee operation near the lateral side after a popliteal sciatic block. Postoperatively the patient has foot drop. Why does the block complicate assessment?","o":["A common peroneal block can mask a nerve injury caused by the surgery","Foot drop after a block always means permanent nerve injury from the operation","The block raises the risk of compartment syndrome in every patient who receives it","The tibial nerve alone controls dorsiflexion","Foot drop is impossible after a popliteal block"],"k":0,"e":"The common peroneal block causes foot drop, and a surgical injury to the common peroneal nerve at the knee would be hidden. If drop persists beyond the expected block duration it should not be assumed to be the block."},{"c":9,"id":"9.B19","s":"Ch 9, section 9.3","q":"You block the sciatic nerve at the popliteal crease, but the nerves have already separated at that level. The block is patchy. What is the likely explanation and remedy?","o":["The nerves are too deep for the beam, so use a higher frequency probe and repeat","The injectate reached only one nerve, and each nerve can be blocked separately","The paraneural sheath was missed, so wait for 60 minutes","The saphenous nerve was blocked instead; repeat the injection","The epineurium was punctured, so abandon the block"],"k":1,"e":"A block placed after the division may fail when it reaches only one of the nerves. Blocking the tibial and common peroneal nerves separately in the fossa is a reliable alternative."},{"c":9,"id":"9.B20","s":"Ch 9, section 9.3","q":"Compared with a single injection proximal to the division, blocking the tibial and common peroneal nerves separately in the popliteal fossa gave:","o":["Slower onset","The same onset but longer duration","A block of the thigh as well","A lower success rate at 30 minutes","Faster onset"],"k":4,"e":"Separate blocks of the two nerves in the fossa gave faster onset than a block placed proximal to the division. A single injection around the unseparated nerve is slower, which is why the level of division matters."},{"c":9,"id":"9.B21","s":"Ch 9, section 9.4","q":"A 68 year old man has total knee arthroplasty and receives an iPACK injection. After the block he cannot lift his foot. What was the probable cause?","o":["The tip was placed too close to the popliteal vein and compressed the tibial nerve","The injection was made too superficially, in the fat beneath the skin","The tibial nerve was the intended target of the block","The needle tip was placed too far lateral to the popliteal artery","The femoral artery was punctured during the approach from the medial side"],"k":3,"e":"A tip placed more than about 2 cm beyond the lateral border of the popliteal artery may block the common peroneal nerve and cause foot drop. This is the number that keeps the iPACK block from becoming a sciatic block."},{"c":9,"id":"9.B22","s":"Ch 9, section 9.4","q":"A surgeon asks what the iPACK block targets. Which description is correct?","o":["The tibial and common peroneal nerve trunks at the level of the popliteal crease","The saphenous nerve as it travels in the adductor canal of the mid thigh","The lateral femoral cutaneous nerve as it crosses the inguinal ligament","The obturator nerve as it leaves the pelvis through the obturator canal","Articular branches to the posterior capsule, between the popliteal artery and the femur"],"k":4,"e":"The iPACK block places local anesthetic between the popliteal artery and the posterior capsule of the knee, aiming at articular branches of the tibial and obturator nerves while leaving the main trunks unblocked. The injection is made in divided doses as the needle is withdrawn, after negative aspiration."},{"c":9,"id":"9.B23","s":"Ch 9, section 9.4","q":"A triple blinded trial of 105 patients compared a proximal iPACK, a distal iPACK and a tibial nerve block after total knee arthroplasty. Which was more common after the tibial nerve block?","o":["Common peroneal motor block","Posterior knee pain","Quadriceps weakness","Hemidiaphragm paralysis","Sensory loss over the anterior thigh"],"k":0,"e":"Common peroneal motor block was more common after the tibial nerve block than after either iPACK injection, and tibial motor function was better preserved with iPACK. Common peroneal motor block was significantly more common after the tibial nerve block (P = 0.001 for each comparison)."},{"c":9,"id":"9.B24","s":"Ch 9, section 9.4","q":"In a triple blinded trial of 105 patients comparing a proximal iPACK, a distal iPACK and a tibial nerve block after total knee arthroplasty, posterior knee pain over 24 hours was higher in one group. What did the authors conclude about the best technique?","o":["The proximal iPACK injection gave the best pain relief and the best motor function","The tibial nerve block gave the best pain relief with no motor effects at all","The distal iPACK injection kept effective posterior knee pain relief while preserving motor function","iPACK injections gave no posterior knee pain relief compared with the tibial block","The proximal iPACK injection was best because it blocked the tibial nerve trunk"],"k":2,"e":"Posterior knee pain was higher in the proximal iPACK group than in the other two, and the authors concluded that the distal injection kept effective pain relief while preserving motor function. The proximal injection was the one associated with the higher posterior knee pain over 24 hours (P = 0.001)."},{"c":9,"id":"9.B25","s":"Ch 9, section 9.4","q":"A randomized trial of 72 patients added an iPACK injection to local infiltration and a continuous adductor canal block. Which finding was reported?","o":["A large reduction in 24 hour morphine use that was statistically significant, with worse mobility","Worse mobility on day 1 and a longer hospital stay in the group that received the block","No significant reduction in 24 hour morphine, but better Timed Up and Go on days 1 and 2 and a shorter stay","No difference in any outcome, including mobility, pain, opioid use and length of stay","Foot drop in about a third of the patients who received the iPACK injection"],"k":2,"e":"Morphine use was not significantly different and pain scores did not differ clinically, so the authors concluded that iPACK did not reduce opioid use or improve analgesia. Timed Up and Go was better on days 1 and 2 and stay was shorter in the iPACK group."},{"c":9,"id":"9.B26","s":"Ch 9, section 9.4","q":"You position a patient supine with the knee flexed and the hip abducted in a frog leg position for an iPACK block. How did the original description position the patient?","o":["The original description used a standing patient","The original description used a sitting patient with the knee extended","The original description used a lateral decubitus patient with a curvilinear probe over the hip","The original description used a supine patient with a probe over the groin","The original description used a prone patient with the probe at or just above the popliteal crease"],"k":4,"e":"The frog leg position is a supine technique with a blanket roll under the thigh. The original description used a prone patient with the probe at or just above the popliteal crease."},{"c":9,"id":"9.B27","s":"Ch 9, section 9.4","q":"A patient after total knee arthroplasty needs posterior knee analgesia, but you want to spare plantar flexion and sole sensation. Compared with an iPACK block, a tibial nerve block at the popliteal level:","o":["It spares the sole completely and preserves plantar flexion","It weakens plantar flexion and reduces sole sensation","It blocks only the common peroneal nerve and spares the tibial","It is the safer option for avoiding foot drop after knee surgery","It reaches the anterior knee capsule through the adductor canal"],"k":1,"e":"A tibial nerve block treats the back of the knee but weakens plantar flexion and reduces sole sensation. In the 105 patient trial it also caused more common peroneal motor block than iPACK."},{"c":9,"id":"9.B28","s":"Ch 9, section 9.5","q":"A surgeon plans a forefoot procedure. You prepare five ankle injections. Which group correctly lists the two deep and three superficial nerves?","o":["Deep: tibial and sural. Superficial: deep peroneal, saphenous and superficial peroneal","Deep: saphenous and tibial. Superficial: sural, deep peroneal and superficial peroneal","Deep: deep peroneal and sural. Superficial: tibial, saphenous and superficial peroneal","Deep: tibial and saphenous. Superficial: sural, superficial peroneal and deep peroneal","Deep: tibial and deep peroneal. Superficial: superficial peroneal, sural and saphenous"],"k":4,"e":"The tibial and deep peroneal nerves are the deep ones. The superficial peroneal, sural and saphenous nerves are superficial, and the saphenous is the one that does not come from the sciatic nerve."},{"c":9,"id":"9.B29","s":"Ch 9, section 9.5","q":"At the ankle you scan the medial side to block the tibial nerve. Where do you find it?","o":["Immediately behind the posterior tibial artery at or just above the medial malleolus","Lateral to the anterior tibial artery at the extensor retinaculum, in front of the ankle","Beside the small saphenous vein above the lateral malleolus","On the surface of the extensor hallucis longus tendon","Between the peroneal tendons behind the lateral malleolus"],"k":0,"e":"The tibial nerve lies at or just above the medial malleolus, immediately behind the posterior tibial artery. The deep peroneal nerve lies at the extensor retinaculum near the anterior tibial artery."},{"c":9,"id":"9.B30","s":"Ch 9, section 9.5","q":"A trial compared a low volume ultrasound guided ankle block (ropivacaine 0.5%) with a larger-volume landmark block in 72 adults. What was the main finding?","o":["The low volume block had much higher success than the landmark block in all the nerves","The landmark group needed more rescue tramadol than the ultrasound group did","Success was similar, but the low volume group needed more rescue tramadol","Both blocks failed in most patients, so the trial was stopped early","The ultrasound group reported no pain at all over the first 24 hours"],"k":2,"e":"Success in recovery was 89% with ultrasound and 80% with the landmark technique, a difference that was not significant. The ultrasound group had marginally higher pain and more rescue tramadol, so the low volume gave high success but slightly worse analgesia over the first day."},{"c":9,"id":"9.B31","s":"Ch 9, section 9.5","q":"After an ankle block for hallux valgus surgery, the inner border of the foot is patchy at 20 minutes. Which nerve was most likely missed, and what is the remedy?","o":["The sural nerve, and a block at the popliteal crease is needed instead of a supplement","The tibial nerve, and the entire block must be repeated from the start at the ankle","The superficial peroneal nerve, and general anesthesia is required","The saphenous nerve, and a small supplement at its territory on the inner leg","The sciatic nerve itself, and a parasacral block is required"],"k":3,"e":"Missing the saphenous or deep peroneal nerve is the usual reason for a patchy ankle block. Adding a saphenous block at the inner leg or ankle covers the inner foot."},{"c":9,"id":"9.B32","s":"Ch 9, section 9.6","q":"A patient needs a below knee operation that requires a thigh tourniquet. A colleague plans a popliteal sciatic block alone. What is the problem?","o":["A sciatic block causes paralysis of the thigh muscles that the tourniquet needs","Thigh tourniquets cannot be used in any patient who has had a peripheral nerve block","The popliteal block covers only the thigh and does not reach the leg or foot","A sciatic block does not cover a thigh tourniquet, so neuraxial or general anesthesia is needed","The block would cause compartment syndrome in the leg that is being operated on"],"k":3,"e":"A block below the knee does not cover tourniquet pain at the thigh, so neuraxial or general anesthesia should be planned, with a block for postoperative pain. The tourniquet pain is not carried by the sciatic nerve, so a sciatic block alone leaves it uncovered."},{"c":9,"id":"9.B33","s":"Ch 9, section 9.4","q":"A 66 year old woman is planning total knee arthroplasty and values early mobility. In a network meta-analysis of 27 trials, which approach had the highest probability of being best for function?","o":["Continuous adductor canal block without iPACK","Single injection adductor canal block with iPACK","Local infiltration alone","Single injection iPACK alone","Tibial nerve block alone"],"k":0,"e":"Continuous adductor canal block without iPACK had the highest probability for function (87%). Continuous adductor canal block with a single injection iPACK had the highest probability for pain over 24 to 48 hours (89%), and the authors questioned the clinical size of the extra benefit."},{"c":9,"id":"9.B34","s":"Ch 9, section 9.3","q":"A patient has a popliteal sciatic block for surgery at the knee and wakes with a foot drop. What is reported about the transient neurologic complications of this block and about foot drop?","o":["Reported transient complications are always zero, and foot drop is never related to the surgery","Reported transient complications occur in about one in two patients, and foot drop is always due to the block","Reported transient complications are rare, and foot drop can be ignored until the block has worn off for three weeks","Reported transient complications range up to a few percent, and foot drop proves that the injection was intraneural","Reported transient neurologic complications range from nearly none to a few percent, one study reported short-term neuropathic complications in about one in ten, and foot drop can mask a nerve injury caused by the surgery"],"k":4,"e":"Reported transient neurologic complications after popliteal sciatic block range from nearly none to a few percent, and one study reported short-term neuropathic complications in about one patient in ten. Foot drop from the common peroneal block can mask a nerve injury caused by the surgery, which matters in operations at the knee. Record the baseline and the motor examination, and follow the deficit up."},{"c":9,"id":"9.B35","s":"Ch 9, section 9.1","q":"The ASRA-ESRA consensus nomenclature for limb blocks (2024) is used in this book. How does it name a block?","o":["By the name of the person who first described the block","By the approach of the needle, such as lateral or posterior, and not by the nerve","By the volume and drug class of the local anesthetic used","By the nerve plus the anatomical location where it is blocked","By the surgery for which the block is used, such as knee or foot"],"k":3,"e":"The consensus nomenclature for limb blocks gives block names as the nerve plus the anatomical location, with names agreed by strong consensus in 38 cases. Naming by nerve and place makes the block predictable from the name and avoids eponyms."},{"c":9,"id":"9.B36","s":"Ch 9, section 9.5","q":"A surgeon asks whether an ankle block will leave a patient comfortable for as long as a popliteal sciatic block for forefoot surgery. What did the randomized trial find for the time to the first morphine request?","o":["It was 20.0 hours with the ankle block and 15.4 hours with the popliteal block, and the difference was significant","It was 2 hours with the ankle block and 20 hours with the popliteal block","It was the same, exactly 15.4 hours, with both blocks","15.4 hours with the ankle block and 20.0 hours with the popliteal block, not significantly different","It was 30 hours with the ankle block and 5 hours with the popliteal block"],"k":3,"e":"The times were 15.4 hours and 20.0 hours, with P = 0.32, so the difference was not significant. The popliteal group was numerically longer, which is the part that tempts you into calling it better. For forefoot surgery an ankle block was nearly as good in that trial."},{"c":10,"id":"10.B01","s":"Ch 10, section 10.1","q":"A 44 year old man has a single fractured rib and you plan an intercostal nerve block. Where do you aim the needle relative to the rib?","o":["At the upper edge of the rib, away from the pleura and the neurovascular bundle","At the lower edge of the rib, where the nerve runs in the costal groove","On the middle of the rib surface","At the transverse process","Between the rib and the skin, superficial to the muscle layer of the chest wall"],"k":1,"e":"The intercostal nerve runs in the groove along the lower border of its rib with the vein above and the artery between vein and nerve. The needle is walked off the lower edge of the rib and advanced only a few millimeters."},{"c":10,"id":"10.B02","s":"Ch 10, section 10.1","q":"A 71 year old woman has one rib fracture and a chest tube site. Which block is the most proportionate choice for a small, single area of chest wall pain?","o":["Intercostal nerve block","Thoracic epidural","Paravertebral catheter at several levels","Parasternal intercostal plane block","Thoracic erector spinae plane catheter"],"k":0,"e":"The intercostal nerve block is a single injection for a limited area such as a single rib fracture or chest tube site. For large or bilateral injuries other options are better."},{"c":10,"id":"10.B03","s":"Ch 10, section 10.1","q":"After an intercostal nerve block at the angle of the rib, a patient reports numbness of the lateral chest but no loss of sensation over the paraspinal muscles of the back. Why?","o":["The intercostal nerve does not supply the lateral chest wall at all","The injectate was placed in the paravertebral space instead of the costal groove","The block failed because the rib was missed","Visceral pain pathways were blocked instead","The block does not cover the posterior ramus of the spinal nerve"],"k":4,"e":"The intercostal nerve block numbs the skin and muscle of the dermatome blocked, but it does not cover the posterior ramus, so the back is spared. It does not cover visceral pain."},{"c":10,"id":"10.B04","s":"Ch 10, section 10.1","q":"A bedside prospective case series used ultrasound guided percutaneous intercostal nerve cryoneurolysis after traumatic rib fracture. How should this evidence be characterized?","o":["A randomized trial showing better outcomes than thoracic epidural analgesia in every patient","A meta-analysis showing a reduction in mortality after traumatic rib fracture","A small descriptive series in which pain fell quickly in most patients, though relief did not always last","A large registry with long term follow up of pulmonary outcomes","A trial showing complete and permanent pain relief in every patient who received it"],"k":2,"e":"The series included six patients, five of whom completed it, and was descriptive only. Pain fell quickly in most patients, but the relief did not always last."},{"c":10,"id":"10.B05","s":"Ch 10, section 10.2","q":"A surgeon asks which structures the original Pecs II technique was designed to reach. Which list is correct?","o":["Pectoral nerves, intercostobrachial nerve, intercostal nerves III to VI and long thoracic nerve","Phrenic nerve, intercostal nerves I and II, the suprascapular nerve and the dorsal scapular nerve","Dorsal rami of T4 to T9 and the thoracic sympathetic chain","Anterior cutaneous branches near the sternum and the internal thoracic nerve","Thoracodorsal nerve, axillary nerve and the dorsal scapular nerve"],"k":0,"e":"The first description, in 2012, introduced Pecs II as a modification of Pecs I aimed at the pectoral nerves, the intercostobrachial nerve, intercostal nerves III to VI and the long thoracic nerve. The block was later renamed in the consensus as an interpectoral plane block plus a pectoserratus plane block."},{"c":10,"id":"10.B06","s":"Ch 10, section 10.2","q":"Your chart note for a patient reads that you injected between the pectoralis major and the pectoralis minor. Under the consensus nomenclature, what is this block called?","o":["Pectoserratus plane block","Superficial serratus anterior plane block","Deep parasternal intercostal plane block","Interpectoral plane block","Retrolaminar block"],"k":3,"e":"An injection between the pectoralis major and minor is the interpectoral plane block, which replaces the name PECS I. The consensus for this name was weak (73%)."},{"c":10,"id":"10.B07","s":"Ch 10, section 10.2","q":"A patient is having axillary clearance. Which injection plane is the usual addition for axillary coverage, between the pectoralis minor and which other muscle?","o":["The latissimus dorsi","The serratus anterior","The rhomboid major","The transversus thoracis","The intercostal muscles"],"k":1,"e":"The pectoserratus plane block places local anesthetic between the pectoralis minor and the serratus anterior. It replaces the second, deeper injection of PECS II."},{"c":10,"id":"10.B08","s":"Ch 10, section 10.2","q":"In a randomized trial of 120 women having modified radical mastectomy, adding Pecs I and II blocks to general anesthesia improved several outcomes. What was the comparator?","o":["Paravertebral block","Thoracic epidural","General anesthesia alone","Serratus anterior plane catheter","Erector spinae plane block"],"k":2,"e":"The trial compared the blocks with general anesthesia alone and not with a paravertebral block. Pain scores, morphine use, fentanyl use, nausea and stay were lower with the blocks."},{"c":10,"id":"10.B09","s":"Ch 10, section 10.2","q":"During an interpectoral plane block, which vessel is a useful marker in the plane between the pectoralis major and minor?","o":["The internal thoracic artery","The thoracoacromial artery","The thoracodorsal artery","The intercostal artery","The suprascapular artery"],"k":1,"e":"The thoracoacromial artery runs in the plane between the pectoral muscles, where the interpectoral injection goes. Injection into the thoracoacromial vessels is a recognized complication."},{"c":10,"id":"10.B10","s":"Ch 10, section 10.2","q":"A woman after mastectomy still has deep anteromedial chest wall pain near the sternum despite a good interpectoral and pectoserratus block. What explains this, and what could cover it?","o":["Anterior branches near the sternum are not reliably covered, and a parasternal intercostal plane block could be added","The block works only on the posterior chest wall, so a paravertebral block is always required","The pectoral nerves also supply the sternum, so the same block should be repeated","The intercostobrachial nerve covers the sternum, so it must be blocked separately","The long thoracic nerve is blocked only by an epidural, so one should be placed"],"k":0,"e":"The Pecs blocks do not reliably cover the deep breast tissue or the anteromedial chest, which are supplied by anterior branches near the sternum. The parasternal intercostal plane blocks cover this area."},{"c":10,"id":"10.B11","s":"Ch 10, section 10.3","q":"A 2013 study first described the serratus plane block. How strong was its evidence base?","o":["A randomized trial in 400 patients with chronic pain after thoracotomy","Four female volunteers had MRI mapped spread, and the authors called it a preliminary study","A meta-analysis of twelve trials of regional analgesia for breast surgery","A single case report in a trauma patient with multiple rib fractures","A cadaver study with no clinical component and no volunteers"],"k":1,"e":"The serratus plane block was described in four volunteers with MRI to map the spread. All had an effective block, and the authors called the study preliminary."},{"c":10,"id":"10.B12","s":"Ch 10, section 10.3","q":"Under the 2021 consensus, the superficial serratus anterior plane block places local anesthetic where?","o":["Superficial to the serratus anterior, between the serratus and the latissimus dorsi","Between the serratus anterior and the rib periosteum","Between the internal intercostal and transversus thoracis muscles at the sternal border","Between the erector spinae and the transverse process","Behind the superior costotransverse ligament, within the paravertebral space of the thorax"],"k":0,"e":"The superficial form lies between the serratus anterior and the latissimus dorsi. The deep form lies between the serratus and the rib periosteum, and the two planes behave differently."},{"c":10,"id":"10.B13","s":"Ch 10, section 10.3","q":"A patient with lateral rib fractures also has pain in the front of the chest at the sternum and in the paraspinal region. Why does a serratus anterior plane block fail to relieve this?","o":["The injectate always stays within the axilla and cannot spread further","It is a lateral block that does not reliably cover the anterior or posterior chest wall","The serratus anterior is innervated only by the long thoracic nerve, which is not blocked","The block reaches only the phrenic nerve in the cervical region and not the thoracic wall","The block acts only on visceral pain and not on the chest wall"],"k":1,"e":"The serratus anterior plane block covers the lateral hemithorax and does not reach the front or the back of the chest well. For the front of the chest near the sternum a parasternal intercostal plane block is the better match, and for the back a paravertebral or erector spinae block."},{"c":10,"id":"10.B14","s":"Ch 10, section 10.3","q":"During a serratus anterior plane block you identify the muscle over the fifth rib at the midaxillary line. Which nerves are found on or passing through the serratus anterior?","o":["The pectoral nerves on its surface, and the thoracodorsal nerve passing through the muscle","The phrenic nerve on its surface, and the vagus nerve passing through the muscle","The long thoracic nerve on its surface, and lateral cutaneous branches passing through it","The dorsal rami on its surface, and the sympathetic chain passing through the muscle","The suprascapular nerve on its surface, and the axillary nerve passing through the muscle"],"k":2,"e":"The long thoracic nerve runs on the surface of the serratus anterior, and the lateral cutaneous branches of the intercostal nerves pass through it. The block reaches these lateral branches without going near the pleura at the level of the injection."},{"c":10,"id":"10.B15","s":"Ch 10, section 10.4","q":"The consensus gathered eight described parasternal approaches under how many named blocks?","o":["One: the transversus thoracis plane block, which absorbed all of the earlier names","Three: transversus thoracis, pecto-intercostal and sternal blocks, each kept by the consensus","Four: one for each side and level","Eight: all names were kept","Two: the superficial and deep parasternal intercostal plane blocks"],"k":4,"e":"The consensus replaced eight parasternal block names with two, the superficial and deep parasternal intercostal plane blocks. The older transversus thoracis plane and pecto-intercostal fascial blocks fall under these two."},{"c":10,"id":"10.B16","s":"Ch 10, section 10.4","q":"For the deep parasternal intercostal plane block, the local anesthetic is placed between which structures?","o":["The pectoralis major and the intercostal muscles, in the anterior chest wall","The serratus anterior and the rib","The erector spinae and the lamina, at the level of the thoracic spine","The internal intercostal and the transversus thoracis muscles","The pectoralis major and pectoralis minor"],"k":3,"e":"The deep form places local anesthetic between the internal intercostal and the transversus thoracis muscles. The superficial form lies superficial to the internal intercostal muscles and deep to the pectoralis major."},{"c":10,"id":"10.B17","s":"Ch 10, section 10.4","q":"A randomized trial in 118 cardiac surgery patients compared a bilateral transversus thoracic muscle plane block with a pecto-intercostal fascial block after sternotomy. Why can't it show that either block beats no block?","o":["Opioid use differed markedly between the groups","There was no control group without a block","The trial was not blinded","Only one side was blocked","Pain scores were not measured"],"k":1,"e":"Opioid use, pain scores, extubation and intensive care times were similar between the two blocks, but with no control group the trial cannot say that either beats no block. The two forms of the block had similar opioid use over 24 hours, but similar results between two blocks say nothing about either against nothing."},{"c":10,"id":"10.B18","s":"Ch 10, section 10.4","q":"A cardiac patient who will receive heparin is scheduled for a deep parasternal intercostal plane block. What additional concern applies?","o":["Phrenic nerve palsy from spread of the injectate to the neck","Heparin makes the block ineffective by binding the local anesthetic","The internal thoracic vessels lie in the same region, so the deep plane needs a plan for bleeding","Hypotension is certain because the plane contains the sympathetic chain","The block is contraindicated in every cardiac patient with a sternal wound"],"k":2,"e":"The internal thoracic artery and vein run in the same region. In a patient who will be given heparin, the deeper plane next to the internal mammary vessels needs a plan for bleeding."},{"c":10,"id":"10.B19","s":"Ch 10, section 10.5","q":"A thoracic paravertebral block is performed. Which structure bounds the paravertebral space behind and which in front, per the consensus definition?","o":["The erector spinae behind and the vertebral body in front","The lamina behind and the transverse process in front","The latissimus dorsi behind and the serratus anterior in front","The superior costotransverse ligament behind and the parietal pleura in front","The rib behind and the diaphragm in front"],"k":3,"e":"The consensus describes the block as an injection into the thoracic paravertebral space between the superior costotransverse ligament and the parietal pleura. This is why the pleura is the structure to watch."},{"c":10,"id":"10.B20","s":"Ch 10, section 10.5","q":"A thoracic surgeon asks you about pulmonary complications after paravertebral block compared with thoracic epidural for thoracotomy. What did the Cochrane review find?","o":["Paravertebral block halved pulmonary complications with high certainty evidence","Epidural halved pulmonary complications with high certainty evidence","Paravertebral block doubled pulmonary complications","Pulmonary complications were not measured in any trial","No difference in pulmonary complications, on low to very low quality evidence"],"k":4,"e":"Pulmonary complications did not differ between the two techniques, though the evidence was low to very low in quality. Paravertebral block caused much less hypotension and urinary retention."},{"c":10,"id":"10.B21","s":"Ch 10, section 10.5","q":"A review of 1,152 patients (1,322 injections) who had paravertebral block before breast surgery reported complications. Which statement is accurate?","o":["Pneumothorax in 12%, with half of the patients needing a chest tube","Pneumothorax never occurred in any of the 1,322 injections that were reviewed","Pleural puncture occurred in 0.6% and pneumothorax in 0.26%, in a retrospective single center study","Ultrasound guidance clearly reduced the rate of pneumothorax compared with landmarks","Local anesthetic toxicity occurred in about one patient in every ten, mostly with bilateral blocks"],"k":2,"e":"Pleural puncture occurred in 0.6% and pneumothorax in 0.26%. Hypotension or bradycardia that mattered occurred in 2.2% and suspected toxicity in 0.17%. The study was retrospective and single center."},{"c":10,"id":"10.B22","s":"Ch 10, section 10.5","q":"A 55 year old man is having an open thoracotomy and the team chooses a paravertebral block. What does the PROSPECT guidance recommend regarding technique?","o":["A single shot paravertebral block only","A bilateral serratus anterior plane block","Intercostal blocks at every level","A paravertebral catheter","No block, because systemic analgesia is enough"],"k":3,"e":"PROSPECT recommends thoracic epidural or paravertebral block as first-line for open thoracotomy, with a paravertebral catheter if that block is chosen. This is first-line guidance, with erector spinae plane, rhomboid intercostal and intercostal nerve blocks listed second."},{"c":10,"id":"10.B23","s":"Ch 10, section 10.5","q":"Shortly after a bilateral thoracic paravertebral block a patient becomes hypotensive and bradycardic. What is the most likely mechanism?","o":["Tension pneumothorax from pleural puncture on both sides","Sympathetic chain block within the paravertebral space, with possible epidural or intrathecal spread","Anaphylaxis to the local anesthetic","Spinal cord ischemia from needle trauma","Phrenic nerve palsy with respiratory failure"],"k":1,"e":"The paravertebral space contains the sympathetic chain, and sympathetic block can cause hypotension and bradycardia. Epidural or intrathecal spread should also be considered."},{"c":10,"id":"10.B24","s":"Ch 10, section 10.6","q":"The erector spinae plane block was first described in 2016 in which setting?","o":["A randomized trial of cardiac surgery patients under general anesthesia","Ten volunteers undergoing MRI after a high volume injection","A series of children having thoracotomy","A cadaver study of the paravertebral space","Two patients with severe thoracic neuropathic pain"],"k":4,"e":"It was described in two patients with severe thoracic neuropathic pain, one from metastatic disease of the ribs and one from malunion of multiple rib fractures, and it produced an extensive multidermatomal sensory block in both. Its mechanism is still debated, and a later volunteer MRI study showed that spread to the paravertebral space is common but not guaranteed."},{"c":10,"id":"10.B25","s":"Ch 10, section 10.6","q":"Under the consensus, an injection into the plane between the erector spinae muscles and the lamina is called:","o":["Erector spinae plane block","Intertransverse process block","Thoracic paravertebral block","Deep serratus anterior plane block","Retrolaminar block"],"k":4,"e":"The erector spinae plane block is an injection between the erector spinae muscles and the transverse process. The retrolaminar block is between the erector spinae muscles and the lamina. The level goes in front of the name."},{"c":10,"id":"10.B26","s":"Ch 10, section 10.6","q":"An MRI study of 10 volunteers given a high volume erector spinae block compared MRI spread with sensory testing. What did the authors note?","o":["Sensory testing over-estimated the spread seen on the MRI images","The two methods agreed exactly in every one of the ten volunteers","Sensory testing under-represented the spread seen on MRI","MRI could not detect the injectate","No spread was seen beyond the injection site"],"k":2,"e":"The injectate reached the paravertebral space in 9 of 10 and the epidural space in 4 of 10. Four volunteers lost sensation both behind and in front of the midaxillary line, and sensory testing under-represented the spread. Testing sensation alone would therefore underestimate how far a high volume injection can travel."},{"c":10,"id":"10.B27","s":"Ch 10, section 10.6","q":"A meta-analysis of 12 trials in 699 women having breast cancer surgery assessed erector spinae plane block. How did the authors view the findings?","o":["Large and clinically important, so they supported routine use in all patients","Showing worse pain with the block than with systemic analgesia alone","Not interpretable, because only a single trial was included","Statistically significant but clinically unimportant, since the morphine saving was below the authors threshold","Showing frequent block related complications in every trial"],"k":3,"e":"The 24 hour morphine saving of 17.6 mg was below the 30 mg threshold the authors set for clinical importance. Opioid related side effects were lower, and no block related complications occurred in 213 patients."},{"c":10,"id":"10.B28","s":"Ch 10, section 10.6","q":"A 68 year old man is having an open thoracotomy and neither a thoracic epidural nor a paravertebral block can be used. Which blocks does PROSPECT list as second-line?","o":["Erector spinae plane, rhomboid intercostal or intercostal nerve block","Serratus anterior plane block and interpectoral plane block","Parasternal intercostal plane block and rectus sheath block","Transversus abdominis plane block and quadratus lumborum block","Caudal epidural and sciatic nerve block"],"k":0,"e":"For open thoracotomy, thoracic epidural or paravertebral block is first-line. Erector spinae plane, rhomboid intercostal or intercostal nerve block is second-line when neither first-line technique is used."},{"c":10,"id":"10.B29","s":"Ch 10, section 10.7","q":"A multicenter study of 354 adults with multiple rib fractures compared thoracic epidural, serratus anterior plane catheter and paravertebral catheter. What can be concluded?","o":["Epidural analgesia was clearly superior for mortality, and the study proved this directly","The serratus plane catheter clearly reduced mortality compared with epidural analgesia","All three improved pain and spirometry, but a design with no no-block group cannot show superiority","Paravertebral catheters were clearly the worst of the three techniques in every outcome","All three techniques clearly increased the length of hospital stay compared with no block"],"k":2,"e":"About 98% had moderate or severe pain before the block and 34% after, and inspiratory volume rose by about 789 mL. Pain relief, crude mortality of 13.2% and length of stay did not differ significantly between block types."},{"c":10,"id":"10.B30","s":"Ch 10, section 10.7","q":"A network meta-analysis of 27 randomized trials in 1,586 patients with blunt thoracic trauma ranked analgesic modalities. Which statement is supported?","o":["Intercostal block was clearly the best option, and the confidence in this finding was high","Fascial blocks were clearly worse than systemic analgesia alone, with high confidence","Erector spinae plane block increased hospital stay in most of the included trials","No benefit of any regional technique was found, and confidence in this was high","Thoracic epidural was most consistent, and fascial blocks were comparable, with low to moderate confidence"],"k":4,"e":"Thoracic epidural analgesia gave better pain control at 24 hours and shorter ventilation and hospital stay. Erector spinae plane block reduced pain and stay, and confidence was low to moderate mainly because of imprecision."},{"c":10,"id":"10.B31","s":"Ch 10, section 10.7","q":"A 62 year old man needs an open thoracotomy for lung resection. Based on current guidance, what is the first choice?","o":["Thoracic paravertebral catheter or thoracic epidural","Intercostal nerve block at one level on the side of the incision","Interpectoral plane block with a low volume of local anesthetic","Parasternal intercostal plane block","Superficial serratus anterior plane block alone"],"k":0,"e":"PROSPECT recommends thoracic epidural or paravertebral block as first-line for open thoracotomy. Paravertebral block gives comparable pain relief with less hypotension and urinary retention."},{"c":10,"id":"10.B32","s":"Ch 10, section 10.7","q":"A ventilated patient has several bilateral posterior rib fractures. Coagulation is normal. Which block gave the most consistent benefit in the network meta-analysis?","o":["Intercostal nerve block alone","Interpectoral plane block","Parasternal intercostal plane block","Thoracic epidural analgesia","Retrolaminar block alone"],"k":3,"e":"Thoracic epidural analgesia gave the most consistent benefit in blunt thoracic trauma, with better pain control at 24 hours and shorter ventilation and hospital stay, provided coagulation allows. Epidural analgesia needs normal coagulation, which is why fascial plane catheters are chosen when the patient is anticoagulated."},{"c":10,"id":"10.B33","s":"Ch 10, section 10.7","q":"A 50 year old woman is having a mastectomy with axillary clearance. Which regional options match the evidence?","o":["Interpectoral and pectoserratus plane blocks, or a paravertebral block","Parasternal intercostal plane block performed alone, on the side of the incision","Intercostal nerve block at one level only, on the side of the incision","Thoracic epidural analgesia only, placed at the level of the incision","Caudal epidural analgesia, placed at the sacral hiatus before the incision"],"k":0,"e":"A randomized trial of Pecs I and II blocks showed lower pain scores and opioid use after mastectomy. Paravertebral block is the other established option, and evidence is weak for deep breast tissue."},{"c":10,"id":"10.B34","s":"Ch 10, section 10.1","q":"You are teaching a trainee about the intercostal nerve block before choosing a block for a patient with a few fractured ribs who will be watched afterward. Which statement from the teaching-site review is correct?","o":["Blood levels after intercostal block are lower than after most other techniques, and arterial levels peak after about 2 hours","Blood levels after intercostal block are higher than after most other regional techniques, arterial levels peak within 5 to 10 minutes, and pneumothorax occurs in about 1%","Blood levels are similar to a paravertebral block, and pneumothorax never occurs with ultrasound","Blood levels peak within 5 to 10 minutes, and pneumothorax occurs in about 20%","Blood levels are the lowest of any block in the chest, so the block is the first choice for bilateral injuries"],"k":1,"e":"The nerve runs under the lower edge of its rib, and absorption from the intercostal space is rapid, so blood levels are higher than after most other regional techniques. Arterial levels peak within 5 to 10 minutes, and pneumothorax occurs in about 1%. For these reasons it is a block for limited areas and for a clinician who can watch the patient afterward."},{"c":10,"id":"10.B35","s":"Ch 10, section 10.6","q":"A volunteer MRI study examined where a high-volume erector spinae plane injection goes. What did it find?","o":["Contrast reached the paravertebral space in 9 of 10 volunteers and the epidural space in 4 of 10","Contrast stayed in the erector spinae plane in all volunteers","Contrast reached the epidural space in 9 of 10 volunteers and the paravertebral space in 4 of 10","Contrast reached the pleural space in most volunteers","Contrast reached neither space in any volunteer"],"k":0,"e":"After a high-volume injection, the spread reached the paravertebral space in 9 of 10 volunteers and the epidural space in 4 of 10. The spread is variable, which helps to explain why the clinical effect of the block is variable. The numbers are easy to reverse, so read them carefully."},{"c":10,"id":"10.B36","s":"Ch 10, section 10.6","q":"You scan for an erector spinae plane block with a paramedian sagittal probe about 2 cm from the midline. Which sonoanatomy is expected?","o":["The transverse process shows as a round dark circle without a shadow, and above it lie the serratus anterior and the pleura, just beneath the skin and the fat","The rib shows as a flat hyperechoic line with a shadow, and above it lie the pectoralis major and the transversus thoracis, just beneath the skin and the fat","The transverse process shows as a flat hyperechoic line with a shadow, and above it lie the trapezius and the erector spinae","The lamina shows as a sawtooth line, and above it lies the dura with the spinal cord, just beneath the skin and the fat","The transverse process shows as a flat hyperechoic line with a shadow, and above it lie the rectus abdominis and the peritoneum, just beneath the skin and the fat"],"k":2,"e":"With a paramedian sagittal probe about 2 cm from the midline, the transverse process shows as a flat hyperechoic line with a shadow. Above it lie the trapezius and the erector spinae, and the rhomboid major above about the fifth thoracic level. The injectate goes into the plane deep to the erector spinae, on the transverse process."},{"c":11,"id":"11.B01","s":"Ch 11, section 11.1","q":"A 48 year old woman is having open cholecystectomy through a
