edle placement for:","o":["1 day","2 days","5 days","7 days","10 days"],"k":1,"e":"Cilostazol: avoid needle placement for 2 days after stopping (grade IIC). Catheters are removed before restarting it, and the first postoperative dose follows 6 hours after removal."},{"c":4,"id":"BQ 4.23","s":"Ch 4, section 4.2","q":"A patient takes aspirin 81 mg daily and nothing else. A neuraxial block is planned. Which statement reflects the guideline?","o":["Aspirin alone adds no specific timing concern for single-injection or catheter techniques","Aspirin must be stopped 7 days before any neuraxial block, whatever other medicines the patient takes","A platelet function assay is required first","The block is permitted only after a 3 day hold","A neuraxial catheter is contraindicated"],"k":0,"e":"Aspirin and other NSAIDs alone carry no added risk (grade IC). Take care with dual therapy or a residual NSAID effect, and note that combining them with heparins, oral anticoagulants or thrombolytics raises the hematoma risk."},{"c":4,"id":"BQ 4.24","s":"Ch 4, section 4.2","q":"A patient has had a puncture of a non-compressible vessel. The guideline advises avoiding thrombolytic therapy for:","o":["24 hours","48 hours","5 days","10 days","14 days"],"k":3,"e":"Avoid thrombolytics for 10 days after puncture of a non-compressible vessel (grade IA). After thrombolytic therapy, avoid needle placement for at least 48 hours and document normal clotting studies including fibrinogen."},{"c":4,"id":"BQ 4.25","s":"Ch 4, section 4.2","q":"A patient received abciximab. Needle placement should be avoided until platelet function has recovered, which is given as:","o":["6 to 12 hours","24 to 48 hours","5 days","7 to 10 days","14 days"],"k":1,"e":"For abciximab the guideline asks you to avoid needle placement until platelet function has recovered, 24 to 48 hours. For the other glycoprotein IIb/IIIa agents, follow the guideline table."},{"c":4,"id":"BQ 4.26","s":"Ch 4, section 4.2","q":"A patient with an epidural catheter is about to have cardiac surgery with full anticoagulation. According to the fifth-edition guideline, the best plan is to:","o":["Keep the catheter and give protamine early to reverse the heparin effect","Convert the catheter to a deep plexus catheter and check anti-Xa levels each day","Keep the catheter if the platelet count is normal","Not maintain the neuraxial or deep catheter during full anticoagulation","Keep the catheter and check an INR every hour"],"k":3,"e":"The guideline advises against maintaining a neuraxial or deep catheter during full anticoagulation for cardiac surgery (grade IIC, a change). Plan the analgesic technique with that in mind."},{"c":4,"id":"BQ 4.27","s":"Ch 4, section 4.2","q":"A patient with an epidural catheter has been on unfractionated heparin for 6 days. In addition to the usual checks, the guideline asks for:","o":["A thromboelastogram every 12 hours","Routine anti-Xa monitoring","A bleeding time","A platelet count","A D-dimer level"],"k":3,"e":"The guideline asks for a platelet count if unfractionated heparin continues beyond 4 days (grade IC). Routine anti-Xa monitoring is not recommended."},{"c":4,"id":"BQ 4.28","s":"Ch 4, section 4.3","q":"A patient on high-dose low-molecular-weight heparin needs a lumbar plexus block. Under the fifth-edition guideline, which rules apply?","o":["Rules for subcutaneous injection only","No restrictions, because there is no epidural space","Only the platelet count threshold","Superficial block rules, because it is a peripheral block","The neuraxial rules, because lumbar plexus is a deep block"],"k":4,"e":"The guideline applies the neuraxial intervals to deep plexus and deep peripheral blocks, and gives more flexibility only for superficial, compressible blocks. Deep sites cannot be compressed or watched."},{"c":4,"id":"BQ 4.29","s":"Ch 4, section 4.3","q":"An umbrella review of bleeding after peripheral nerve block in patients on antithrombotics counted 80 events in 9,738 observational blocks. Most events followed:","o":["Interscalene block","Axillary block","Digital block","Lumbar plexus block","Wrist block"],"k":3,"e":"Most of the 80 events followed lumbar plexus block, and one was fatal. The review also described bleeding as rare overall, about 0.82% in one estimate."},{"c":4,"id":"BQ 4.30","s":"Ch 4, section 4.3","q":"The umbrella review's conclusion about deep cervical plexus block in a patient taking antithrombotic drugs was that it:","o":["Was safe with ultrasound guidance only","Was safe if the INR was normal","Was recommended in preference to superficial block","Needed no precautions","Was not recommended"],"k":4,"e":"Deep cervical plexus block was not recommended in a patient on antithrombotic drugs. Head and neck blocks otherwise showed little bleeding."},{"c":4,"id":"BQ 4.31","s":"Ch 4, section 4.4","q":"A catheter removed on day 3 from an afebrile patient with a clean, nontender site grows coagulase-negative staphylococci. The best management is to:","o":["Start intravenous antibiotics","Remove all the remaining catheters","Culture the patient's blood three times and start treatment if any bottle grows organisms","Treat the patient if they look infected; do not treat the culture result alone","Order magnetic resonance imaging"],"k":3,"e":"In the 1,416-patient series, 28.7% of catheters grew bacteria and abscess occurred in 0.07%. Colonization is common and usually harmless, so treat a patient who looks infected, not a positive culture."},{"c":4,"id":"BQ 4.32","s":"Ch 4, section 4.4","q":"Which patient is at highest risk of local inflammation or infection from a continuous peripheral catheter, based on the risk factors in the prospective series?","o":["A woman on a ward with a catheter for 24 hours and antibiotic prophylaxis given at insertion","A man in intensive care with a catheter in place for 4 days and no antibiotic prophylaxis","A woman with a catheter for 12 hours","A man on a ward with a catheter for 24 hours who had antibiotic prophylaxis","A woman on a ward with a catheter for 36 hours"],"k":1,"e":"Risk factors were intensive care monitoring, catheter duration over 48 hours, male sex and the absence of antibiotic prophylaxis. The man in intensive care has all four."},{"c":4,"id":"BQ 4.33","s":"Ch 4, section 4.4","q":"For an epidural infusion that is going to be extended, the ASA advisory on infectious complications suggests:","o":["Replacing the catheter with a peripheral catheter at a site away from the groin","Adding prophylactic antibiotics to the infusion","Changing the catheter every 24 hours","Routine daily blood cultures","Considering a bacterial filter, and limiting disconnections of the system"],"k":4,"e":"The advisory recommends considering a bacterial filter when an infusion is extended, limiting disconnections, and not leaving catheters in longer than necessary. It also asks for prompt culture and imaging when abscess or neurologic dysfunction is suspected."},{"c":4,"id":"BQ 4.34","s":"Ch 4, section 4.5","q":"According to the ASRA neurologic complications advisory, which pre-existing condition is associated with a slightly higher risk of neuraxial complication?","o":["Spinal stenosis","Mild asthma","Type 2 diabetes mellitus","Hypertension","Obesity"],"k":0,"e":"The advisory reports an association between spinal stenosis and a slightly higher risk of neuraxial complication. Document the baseline neurologic state and weigh the benefit of the block."},{"c":4,"id":"BQ 4.35","s":"Ch 4, section 4.5","q":"A patient with a tibial fracture is being watched for compartment syndrome, and the surgeon asks for a dense nerve block for pain control. The best approach is to:","o":["Place the densest possible block and remove the observation plan, since pain is not a reliable warning sign","Place the block and check the limb once a day","Use a catheter and stop neurologic checks","Add epinephrine to prolong the block","Avoid a block that could hide a symptom you need to see, and agree a monitoring plan"],"k":4,"e":"A new weakness or pain in a limb watched for compartment syndrome is a message you want to receive. Do not use a block to mask a symptom that matters."},{"c":4,"id":"BQ 4.36","s":"Ch 4, section 4.6","q":"A patient develops chest pain and a cough on the day after a thoracic paravertebral block. Which block-specific harms must you consider?","o":["Globe perforation and brainstem anesthesia","Hemidiaphragm paralysis only","Pneumothorax, and also epidural or intrathecal spread and hypotension","Horner syndrome only","Retroperitoneal hematoma from lumbar plexus block"],"k":2,"e":"The thoracic wall and paravertebral region carry the harms of pneumothorax, epidural or intrathecal spread and hypotension. A pneumothorax may not appear in the recovery room, so tell the patient to return if symptoms develop."},{"c":4,"id":"BQ 4.37","s":"Ch 4, section 4.7","q":"A patient leaves with a perineural catheter for home. Which items should the block note record so the next clinician can manage it?","o":["The patient's occupation and the surgeon's name only, recorded on the front of the notes","The depth at the skin, the securing method, the infusion plan and who will check it","Only the time of insertion","The block note is not needed for catheters","Only the drug name"],"k":1,"e":"For a catheter, the note should record the depth at the skin, the securing method, the infusion plan and who will check it, in addition to the usual block details and the postoperative instructions."},{"c":4,"id":"BQ 4.38","s":"Ch 4, section 4.3","q":"A reviewer tells a block service to classify every interscalene block as superficial and low risk for bleeding, citing an umbrella review. How did the reviews classify blocks?","o":["The reviews agreed that every block above the clavicle is superficial and carries no bleeding risk","The reviews agreed that the interscalene block is high risk and that the supraclavicular block is superficial","The reviews disagreed on how to classify the same block: one called the interscalene block superficial with little risk, which the umbrella review's authors found questionable, and the supraclavicular block was linked to hemothorax","The reviews provided a ranking that the book adopts as a rule for every block","The reviews found no bleeding events in any peripheral nerve block"],"k":2,"e":"The reviews summarized in the umbrella review disagreed on how to classify the same block. One considered the interscalene block superficial with little clinically significant risk, which the authors found questionable, and the supraclavicular block was linked to hemothorax. The review does not supply a ranking you can use as a rule, and the book does not invent one."},{"c":4,"id":"BQ 4.39","s":"Ch 4, section 4.7","q":"At a monthly review of a block service, a colleague proposes to discuss only the events that led to patient harm. Which addition is recommended?","o":["Include only the events that had a reportable outcome, because near misses have no outcome that can be audited or counted","Include the successful blocks of the most experienced operators, so that the service can set a standard for everyone else to follow","Include only complications reported by the patient within 24 hours, because later events cannot be linked to the block with any confidence","Include the near misses: an injection caught by aspiration, a wrong-side block stopped at the time-out, and a missing anticoagulant entry","Include the cost of each block, since the review should focus on how many blocks each operator completes"],"k":3,"e":"A block service should keep a log of its blocks and complications, review each serious event, and share the lessons. The review should include the near misses, such as an intravascular injection caught by aspiration, a wrong-side block stopped at the time-out, and a patient whose anticoagulant was not on the chart. Near misses show where the system nearly failed, before a patient was hurt."},{"c":5,"id":"BQ 5.1","s":"Ch 5, section 5.1","q":"A 45-year-old man is scheduled for a shoulder operation. After leaving the intervertebral foramina, the roots of the brachial plexus run:","o":["Between the anterior and middle scalene muscles","Behind the middle scalene and the trapezius","In front of the anterior scalene and the sternocleidomastoid","Between the first rib and the clavicle","Inside the carotid sheath"],"k":0,"e":"The roots run between the anterior and middle scalene muscles. Near the lateral border of the scalenes they join into the trunks."},{"c":5,"id":"BQ 5.2","s":"Ch 5, section 5.1","q":"The superior trunk of the brachial plexus is formed by:","o":["C6 and C7","C7 alone","C5 and C6","C4 and C5","C8 and T1"],"k":2,"e":"The superior trunk is C5 and C6, the middle trunk is C7, and the inferior trunk is C8 and T1. The suprascapular nerve leaves the superior trunk."},{"c":5,"id":"BQ 5.3","s":"Ch 5, section 5.1","q":"After surgery a patient has numbness over the lateral upper arm and weak shoulder abduction. Which nerve is most likely involved?","o":["The long thoracic nerve","The musculocutaneous nerve","The phrenic nerve","The suprascapular nerve","The axillary nerve"],"k":4,"e":"The axillary nerve supplies the deltoid, the teres minor, the inferior capsule and the skin over the lateral upper arm. It leaves the posterior cord."},{"c":5,"id":"BQ 5.4","s":"Ch 5, section 5.1","q":"The suprascapular nerve reaches the supraspinous fossa by:","o":["Passing through the quadrangular space","Running with the radial nerve in the spiral groove of the humerus","Traveling with the thoracodorsal artery","Crossing in front of the clavicle","Passing deep to the omohyoid through the suprascapular notch"],"k":4,"e":"The suprascapular nerve leaves the superior trunk, passes deep to the omohyoid, and enters the supraspinous fossa through the suprascapular notch to supply the supraspinatus. It then runs on to the infraspinatus."},{"c":5,"id":"BQ 5.5","s":"Ch 5, section 5.1","q":"A patient's brachial plexus draws a contribution from C4. This variant is called:","o":["A prefixed plexus","A postfixed plexus","A trunk fusion","A pectoral plexus","A cervical rib plexus"],"k":0,"e":"A prefixed plexus draws on C4 and a postfixed plexus draws on T2. Variants are the rule, not the exception, so count the roots from the vertebral level."},{"c":5,"id":"BQ 5.6","s":"Ch 5, section 5.1","q":"When counting cervical roots on ultrasound, which vertebral feature helps you identify C6 and C7?","o":["Both have identical tubercles","C6 has a bifid spinous process visible anteriorly","C7 has a prominent anterior tubercle, and C6 has none or only a small one","C6 has a prominent anterior tubercle; C7 has a small or absent one","C7 has the foramen transversarium only"],"k":3,"e":"Count from the vertebral level. The C6 anterior tubercle is prominent, while C7 has a small or absent one."},{"c":5,"id":"BQ 5.7","s":"Ch 5, section 5.1","q":"At the level of the first rib, the trunks of the brachial plexus lie:","o":["Anterior to the clavicle","Above and lateral to the subclavian artery","Medial and anterior to the subclavian artery","Beneath the first rib","Within the axillary sheath"],"k":1,"e":"The trunks lie above and lateral to the subclavian artery, which rests on the first rib. The cords form around the axillary artery below the clavicle."},{"c":5,"id":"BQ 5.8","s":"Ch 5, section 5.2","q":"After an interscalene block, which part of the arm will most reliably be missed?","o":["The deltoid","The shoulder capsule","The lateral upper arm","The ulnar side of the hand","The proximal humerus"],"k":3,"e":"An interscalene block covers the shoulder and lateral upper arm but reliably misses the ulnar side of the hand. It also does not cover the skin over the clavicle."},{"c":5,"id":"BQ 5.9","s":"Ch 5, section 5.2","q":"For an interscalene block the needle is typically brought:","o":["In plane from medial to lateral through the sternocleidomastoid, with the tip under the carotid sheath","Out of plane through the anterior scalene","In plane from lateral to medial through the middle scalene, tip beside the C5 and C6 roots","Out of plane over the clavicle into the corner pocket","Posterior to the trapezius toward C7"],"k":2,"e":"The endpoint is the tip beside the C5 and C6 roots, in the groove between them, with the injectate lifting the tissue around the roots."},{"c":5,"id":"BQ 5.10","s":"Ch 5, section 5.2","q":"On ultrasound at the interscalene level, how can you tell the internal jugular vein from a root?","o":["The vein compresses under light probe pressure","The vein does not change with pressure","The vein pulses strongly","The vein has a bright rim","The vein lies between the scalenes and is deeper than the nerve cluster"],"k":0,"e":"Apply light pressure and watch the vein compress, and use color Doppler to confirm. Roots are small hypoechoic circles with a bright rim."},{"c":5,"id":"BQ 5.11","s":"Ch 5, section 5.2","q":"In a randomized trial of arthroscopic ambulatory shoulder surgery, hemidiaphragmatic paralysis after superior trunk block occurred in:","o":["0%","4.8%","23%","45%","71%"],"k":1,"e":"Hemidiaphragmatic paralysis occurred in 3 of 62 patients (4.8%) after superior trunk block versus 45 of 63 (71.4%) after interscalene block."},{"c":5,"id":"BQ 5.12","s":"Ch 5, section 5.2","q":"In the randomized trial of superior trunk versus interscalene block, Horner syndrome or hoarseness was:","o":["Seen only with interscalene catheters","More common with the superior trunk block, at a rate near 20 percent","Less common with the superior trunk block (1.6% versus 19.1%)","Equal in both groups","Absent in both groups"],"k":2,"e":"Horner syndrome or hoarseness occurred in 1.6% of patients with the superior trunk block and 19.1% with interscalene block. Worst recovery-room pain was similar."},{"c":5,"id":"BQ 5.13","s":"Ch 5, section 5.2","q":"In a trial that halved the interscalene volume from 20 mL to 10 mL at the cricoid level, hemidiaphragmatic paresis:","o":["Was eliminated","Was not reduced","Increased","Was halved","Was reduced only in obese patients"],"k":1,"e":"Decreasing the volume to 10 mL did not reduce the incidence of hemidiaphragmatic paresis. A quarter of the standard volume lowered the rate to 45% in another trial but did not remove it."},{"c":5,"id":"BQ 5.14","s":"Ch 5, section 5.2","q":"A patient who had a superior trunk block asks about hand strength. Which statement is correct?","o":["Hand motor function is better preserved than with interscalene block, but complete grip loss still occurred in 1 in 10","Grip loss is more common than with interscalene block, since the lower trunk is blocked more reliably by this approach","Grip strength is never affected","Grip is lost only with catheters, because continuous infusion keeps the lower trunk blocked for the whole infusion period","Grip is lost in all patients"],"k":0,"e":"The superior trunk block spares more of the hand's motor function than interscalene block, yet complete loss of grip strength still occurred in about 1 in 10 patients in the trial."},{"c":5,"id":"BQ 5.15","s":"Ch 5, section 5.2","q":"For prolonged analgesia after major shoulder surgery, where is a catheter easier to hold?","o":["In the axillary sheath","In the interscalene groove","On the superior trunk","In the supraspinous fossa","In the corner pocket"],"k":1,"e":"A catheter can be left in the fascial plane around the roots in the interscalene groove. A catheter is rarely chosen for the supraclavicular block because of the pleura."},{"c":5,"id":"BQ 5.16","s":"Ch 5, section 5.3","q":"A surgeon will operate on the mid-humerus. Which block gives reliable cover from the mid-humerus to the hand in a compact space at the first rib?","o":["Axillary nerve block","Suprascapular block alone","Superficial cervical plexus block","Interscalene block alone","Supraclavicular block"],"k":4,"e":"At the first rib the trunks and divisions lie close together, so a supraclavicular block covers surgery from the mid-humerus to the hand. It covers the shoulder less reliably than interscalene block."},{"c":5,"id":"BQ 5.17","s":"Ch 5, section 5.3","q":"Why is the first supraclavicular injection placed in the corner pocket?","o":["Because the vertebral artery is absent there and the needle path is therefore safe","Because the cluster spreads upward from there and carries the injectate toward the roots","Because the phrenic nerve is blocked there","Because the pleura is safest there","Because the lowest trunk lies there and is hardest to reach"],"k":4,"e":"The corner pocket is the angle between the first rib and the subclavian artery. Local anesthetic placed there reaches the lowest trunk, which hides in that angle, and the rest is injected around the cluster."},{"c":5,"id":"BQ 5.18","s":"Ch 5, section 5.3","q":"A series of 510 consecutive ultrasound-guided supraclavicular blocks reported:","o":["Pneumothorax in 10%","Symptomatic pneumothorax in 1 in 5","No clinically symptomatic pneumothorax","Pneumothorax in every patient with COPD","Pneumothorax only after catheters"],"k":2,"e":"In the 510-block series there was no clinically symptomatic pneumothorax. A larger series of periclavicular blocks reported symptomatic pneumothorax in four patients, three of them after a two-day delay."},{"c":5,"id":"BQ 5.19","s":"Ch 5, section 5.3","q":"In a cohort using 20 mL of ropivacaine 0.375% for supraclavicular block, the rate of hemidiaphragmatic paralysis was:","o":["10%","23%","45%","59.5%","95%"],"k":3,"e":"About 59.5% of patients developed hemidiaphragmatic paralysis, so the supraclavicular block is not a guarantee of a working diaphragm. Smaller volumes lower the risk without eliminating it."},{"c":5,"id":"BQ 5.20","s":"Ch 5, section 5.3","q":"On a supraclavicular ultrasound view, which structure is the first rib?","o":["A bright line with shadowing deep to the subclavian artery","A round anechoic structure","A hypoechoic circle in the cluster","The sliding line beside the rib","A hyperechoic band lateral to the omohyoid muscle and deep to the clavicle"],"k":0,"e":"The first rib is a bright line with shadowing. The pleura is the bright, sliding line beside it, and the subclavian artery is a round anechoic structure resting on the rib."},{"c":5,"id":"BQ 5.21","s":"Ch 5, section 5.4","q":"After an anterior suprascapular block alone for arthroscopic shoulder surgery, which area is most likely to remain painful?","o":["The supraspinatus","The posterior capsule","The infraspinatus","The back of the shoulder, including the posterior capsule and part of the scapula","The front and inferior shoulder, including axillary nerve territory"],"k":4,"e":"A suprascapular block alone covers the supraspinatus, the infraspinatus and part of the capsule. It does not cover the axillary nerve territory, the front of the capsule or the skin of the shoulder."},{"c":5,"id":"BQ 5.22","s":"Ch 5, section 5.4","q":"In an anterior suprascapular block, the needle tip is placed:","o":["At the C5 root in the groove","Within the quadrangular space","Posterior to the clavicle in the spinoglenoid notch, out of plane over the scapula","In the corner pocket","Beside the nerve under the omohyoid, in plane lateral to medial"],"k":4,"e":"In the supraclavicular fossa the nerve is a small round structure beside the omohyoid. Place the tip beside it under the omohyoid, keeping the needle on the screen."},{"c":5,"id":"BQ 5.23","s":"Ch 5, section 5.4","q":"An equivalence trial compared combined suprascapular and axillary nerve blocks with interscalene block. What did it show?","o":["The blocks were not equivalent: interscalene was better in recovery, the combined block at 24 hours","The combined block was better at every time point, including the recovery room and the morning after surgery","Interscalene was better at every time point","Pain scores were identical at all times","The combined block caused more hemidiaphragm paralysis"],"k":0,"e":"Recovery-room static pain favored interscalene block, 24-hour pain favored the combined block, and the two were equivalent only on day 7. The combined block had fewer adverse effects at 24 hours."},{"c":5,"id":"BQ 5.24","s":"Ch 5, section 5.4","q":"A double-blind trial compared anterior and posterior approaches to suprascapular block. What did it measure after both?","o":["Horner syndrome in both only","Quadriceps weakness","Pneumothorax in both","Hemidiaphragmatic paralysis","Complete diaphragm sparing in both"],"k":3,"e":"Phrenic paralysis was measured after both approaches. Check that the injectate did not spread into the interscalene groove if you are trying to spare the diaphragm."},{"c":5,"id":"BQ 5.25","s":"Ch 5, section 5.4","q":"What is a specific hazard when performing an axillary nerve block in the quadrangular space?","o":["The phrenic nerve lies beside the nerve","The pleura lies directly deep to the nerve, so pneumothorax is the main risk of the block here","The vertebral artery lies beside the nerve, so intravascular injection into it is the main risk","The subclavian vein lies within the space, so venous puncture is the main risk of this approach","The posterior circumflex humeral artery lies beside the nerve; intravascular injection is a risk"],"k":4,"e":"The axillary nerve travels with the posterior circumflex humeral artery, which is an intravascular risk. The block also does not cover the front of the capsule."},{"c":5,"id":"BQ 5.26","s":"Ch 5, section 5.5","q":"In a three-way trial, vital capacity after anterior suprascapular block was about this percentage of baseline:","o":["60%","76%","83%","90%","100%"],"k":3,"e":"Vital capacity was about 90% of baseline after anterior suprascapular block and about 76% after supraclavicular block. Both did better than interscalene block."},{"c":5,"id":"BQ 5.27","s":"Ch 5, section 5.5","q":"In the three-way trial of anterior suprascapular, supraclavicular and interscalene blocks, supraclavicular block:","o":["Was superior for pain","Eliminated phrenic paralysis","Was not shown to be noninferior to interscalene block for pain","Preserved vital capacity better than suprascapular block","Was shown to be noninferior"],"k":2,"e":"Anterior suprascapular block was noninferior for pain, while supraclavicular block was not shown to be noninferior."},{"c":5,"id":"BQ 5.28","s":"Ch 5, section 5.5","q":"In a randomized trial of arthroscopic shoulder surgery, costoclavicular block compared with interscalene block gave:","o":["Equivalent pain scores and no hemidiaphragmatic paralysis, though onset was slower","Better pain and faster onset","Worse pain and no paralysis","Equivalent pain and faster onset, but with more hemidiaphragmatic paralysis at 30 minutes","Equivalent pain and 100% paralysis"],"k":0,"e":"Costoclavicular block produced equivalent pain scores with no hemidiaphragmatic paralysis against 100% after interscalene block, but it was slower to start working."},{"c":5,"id":"BQ 5.29","s":"Ch 5, section 5.5","q":"A meta-analysis of suprascapular versus interscalene block for shoulder surgery found that suprascapular block:","o":["Gave much worse pain control at all times","Was superior in the recovery room","No clinically meaningful analgesic difference except worse recovery-room pain, and fewer side effects","Had more side effects","Gave much better pain control at all times, with a lower rate of side effects than interscalene block overall"],"k":2,"e":"Interscalene block gave better pain control in the recovery room, but suprascapular block had fewer side effects and no other clinically meaningful analgesic difference."},{"c":5,"id":"BQ 5.30","s":"Ch 5, section 5.5","q":"In a multicenter randomized trial, subomohyoid anterior suprascapular block compared with interscalene block for arthroscopic shoulder surgery was:","o":["Inferior","Noninferior","Not studied for pain","Associated with more phrenic paralysis","Superior in every outcome"],"k":1,"e":"A subomohyoid anterior suprascapular block was noninferior to interscalene block in a multicenter trial."},{"c":5,"id":"BQ 5.31","s":"Ch 5, section 5.5","q":"Which patient is least likely to tolerate a paralyzed hemidiaphragm after a shoulder block?","o":["A patient with severe lung disease, obesity and sleep apnea","A patient with a healthy contralateral diaphragm and normal lungs","A healthy 30-year-old","A patient with mild hay fever","A well-conditioned athlete"],"k":0,"e":"Some patients tolerate a paralyzed hemidiaphragm without symptoms. Those with severe lung disease, a contralateral diaphragm problem, obesity or sleep apnea may not, and the decision should be made before the block."},{"c":5,"id":"BQ 5.32","s":"Ch 5, section 5.5","q":"In the superior trunk versus interscalene trial, the worst recovery-room pain scores were:","o":["Not measured","Similar between the two blocks","Higher with interscalene block","Much higher with superior trunk block","Much lower with superior trunk block"],"k":1,"e":"Worst recovery-room pain was similar, while hemidiaphragmatic paralysis was far less common with the superior trunk block."},{"c":5,"id":"BQ 5.33","s":"Ch 5, section 5.6","q":"A healthy patient with normal lungs will have a major open shoulder operation. What is the most dependable block, and what can extend it?","o":["Supraclavicular block, with a catheter placed for the next three days","Axillary nerve block alone, placed in the posterior deltoid region","Digital block with sedation","Suprascapular block alone","Interscalene block, with consideration of a catheter"],"k":4,"e":"If the patient can lose a hemidiaphragm, interscalene block remains the most dependable analgesic for major shoulder surgery, and a catheter can extend it."},{"c":5,"id":"BQ 5.34","s":"Ch 5, section 5.6","q":"For arthroscopic shoulder surgery in a patient with normal lungs, why might you choose a superior trunk block over an interscalene block?","o":["Better coverage of the ulnar hand","Less diaphragm paralysis with similar early pain scores","Easier catheter placement","Complete sparing of the phrenic nerve in every patient studied","Longer block duration"],"k":1,"e":"Superior trunk block gave similar early pain scores with far less hemidiaphragmatic paralysis in one trial, but it does not completely spare the diaphragm."},{"c":5,"id":"BQ 5.35","s":"Ch 5, section 5.6","q":"A patient has a clavicle fracture needing fixation. Which combination is recommended?","o":["A digital block","A suprascapular block alone","Superficial cervical plexus block plus a trunk or supraclavicular block","An axillary nerve block","An interscalene block alone, with local infiltration over the clavicle by the surgeon"],"k":2,"e":"The skin over the clavicle comes from the cervical plexus, so add a superficial cervical plexus block to a brachial plexus block. The surgeon's infiltration may also be used."},{"c":5,"id":"BQ 5.36","s":"Ch 5, section 5.6","q":"A patient is scheduled for elbow-level or hand surgery below the shoulder. The first-choice block is:","o":["Suprascapular block","Supraclavicular block","Axillary nerve block","Interscalene block","Cervical plexus block"],"k":1,"e":"A supraclavicular block gives a compact plexus at the rib for surgery below the shoulder. Choose a lower approach if the lungs are limited."},{"c":5,"id":"BQ 5.37","s":"Ch 5, section 5.6","q":"For arthroscopic shoulder surgery in a patient with limited lungs, what drawback did the combined suprascapular plus axillary block show?","o":["More hand weakness","More phrenic paralysis than with interscalene block at 30 minutes","Inability to cover the posterior shoulder in many patients","Worse recovery-room pain than interscalene block","Higher cost"],"k":3,"e":"The combined block is a third option, but it gave worse recovery-room pain in the equivalence trial. Anterior suprascapular block or costoclavicular block are the other options."},{"c":5,"id":"BQ 5.38","s":"Ch 5, section 5.2","q":"On a transverse view of the neck at the cricoid level, you see a stack of three or four small round structures between the scalene muscles. Which description is correct for the top circle and what lies in front of it?","o":["The C5 root is the first circle at the top of the stack, and the phrenic nerve lies just in front of it","The C7 root is the first circle at the top of the stack, and the vagus nerve lies just in front of it","The C5 root is the last circle at the bottom of the stack, and the phrenic nerve lies behind it","The C6 root is the first circle at the top of the stack, and the long thoracic nerve lies in front of it","The first circle is the vertebral artery, and the phrenic nerve lies behind the middle scalene"],"k":0,"e":"The roots appear as small hypoechoic circles stacked between the scalene muscles. The C5 root is the first circle at the top of the stack, and the phrenic nerve lies just in front of it, on the anterior scalene. That closeness is why a block aimed at the roots in the neck almost always reaches the diaphragm too."},{"c":5,"id":"BQ 5.39","s":"Ch 5, section 5.2","q":"In the randomized trial of the superior trunk block, how was the injectate placed around the trunk?","o":["The needle was placed inside the trunk, and the whole volume was given in one bolus","The needle was aimed at the C7 root, with the injectate placed between the middle scalene and the trapezius","The needle was placed in the corner pocket, and the injectate was given only in front of the artery","The needle was aimed just before the branch point of the suprascapular nerve, with injectate placed behind and below the trunk, then above and in front of it","The needle was aimed at the cricoid-level C6 root, and the injectate was placed only above the roots"],"k":3,"e":"In the trial, the in-plane needle was aimed just before the branch point of the suprascapular nerve, with injectate placed behind and below the trunk and then above and in front of it. The volume is split between those two spaces, and the spread you see sets the amount. A bolus inside the trunk is not the aim, and the corner pocket belongs to the supraclavicular block."},{"c":5,"id":"BQ 5.40","s":"Ch 5, section 5.4","q":"A patient with severe lung disease is booked for arthroscopic shoulder surgery. The chapter's logic for the suprascapular block is best described by which statement?","o":["Go distal to the roots and block the nerves that carry much of the shoulder's sensation","Place the needle beside the C5 root and use a very low volume, since a low volume spares the diaphragm completely","Choose a standard-volume interscalene block, because phrenic palsy is brief and rarely matters","Avoid regional anesthesia, because no block can reach the shoulder without involving the phrenic nerve","Block the superficial cervical plexus alone, because it supplies the whole joint"],"k":0,"e":"The suprascapular block is the answer for a patient who cannot afford phrenic paralysis: go distal to the roots and block the nerves that carry much of the shoulder's sensation. A low volume at the roots lowers the rate of diaphragm paralysis but does not remove it. The superficial cervical plexus supplies the skin over the clavicle and the top of the shoulder, not the joint."},{"c":6,"id":"6.B01","s":"Ch 6, section 6.1","q":"A 45-year-old man is scheduled for ulnar-side hand surgery. You plan a coracoid-approach infraclavicular block. Which statement about its coverage is correct?","o":["It covers only the hand and wrist, leaving the forearm and elbow unblocked","It covers the arm below the shoulder but spares the shoulder","It covers the arm but spares the ulnar side of the hand, so a separate ulnar injection is needed","It blocks the suprascapular nerve reliably","It covers the shoulder and the whole arm"],"k":1,"e":"The cords lie below the point where the suprascapular nerve leaves the plexus, so the block reaches the arm from the upper arm to the hand and spares the shoulder."},{"c":6,"id":"6.B02","s":"Ch 6, section 6.1","q":"A 60-year-old woman with severe emphysema needs elbow surgery. A colleague proposes a coracoid-approach infraclavicular block. What is the main concern with this approach?","o":["Epinephrine is contraindicated because it would reduce blood flow to the cords","The musculocutaneous nerve is always spared because it leaves the plexus above the clavicle","The cords are too superficial to reach","The steep needle path can pass the artery and reach the pleura","The block always paralyzes the hemidiaphragm"],"k":3,"e":"The needle is steep and hard to see, so the tip can pass the artery toward the pleura. Pneumothorax and vascular puncture are the main risks, which is why the block is best avoided when even a small pneumothorax would not be tolerated."},{"c":6,"id":"6.B03","s":"Ch 6, section 6.1","q":"You perform an infraclavicular block and the first injection behind the axillary artery spreads well. Based on a randomized trial, what is the best next step?","o":["Add a second injection on every patient to improve success and shorten the onset time","Convert to a supraclavicular approach, which has a higher success rate in this setting","Switch to a larger needle","Stop; a single injection behind the artery worked as well as two injections","Inject the musculocutaneous nerve separately"],"k":3,"e":"In a randomized trial of 88 patients, surgical anesthesia was achieved in 93.1% to 97.7% with no difference between single and double injection in performance or onset times. A second injection is reserved for incomplete spread."},{"c":6,"id":"6.B04","s":"Ch 6, section 6.1","q":"A surgeon asks which terminal nerves arise from the posterior cord. Which pair is correct?","o":["Axillary and median nerves","Radial and axillary nerves","Ulnar and musculocutaneous nerves","Musculocutaneous and radial nerves","Median and ulnar nerves"],"k":1,"e":"The posterior cord gives the radial and axillary nerves. The lateral cord gives the musculocutaneous nerve and the lateral root of the median nerve, and the medial cord gives the ulnar nerve and the medial root of the median nerve."},{"c":6,"id":"6.B05","s":"Ch 6, section 6.1","q":"On ultrasound, you identify the axillary artery at the infraclavicular level. Where are the cords usually found in relation to it?","o":["Spread widely at 4, 8 and 12 o'clock with no consistent pattern","All three anterior to the vein","All three medial to the vein","One in front of the artery and two behind it","Most often one behind the artery and two beside it"],"k":4,"e":"The cords appear as small hyperechoic or mixed structures around the artery, most often one behind it and two beside it, although the pattern varies between patients."},{"c":6,"id":"6.B06","s":"Ch 6, section 6.2","q":"A 55-year-old man with chronic lung disease needs arthroscopic shoulder surgery. Which statement favors a costoclavicular block over a supraclavicular block?","o":["It carries no risk of vascular puncture, since the large vessels lie well away from the cluster of cords in this space","It requires less volume than every other approach","Hemidiaphragmatic paralysis was significantly less likely after costoclavicular block in a randomized trial","It blocks the suprascapular nerve directly, which makes it the best choice for shoulder surgery in every patient","It never causes any phrenic involvement"],"k":2,"e":"In a randomized trial of 80 patients the costoclavicular block caused hemidiaphragmatic paralysis significantly less often than the supraclavicular block. Vascular puncture remains a risk, and the claim that it spares the diaphragm rests on a small number of trials."},{"c":6,"id":"6.B07","s":"Ch 6, section 6.2","q":"You place the probe under the middle of the clavicle and tilt it toward the head. What do you expect to see?","o":["A single trunk anterior to the vein","The three cords spread around the artery in separate quadrants","The three cords clustered together lateral to the axillary artery","The cords medial to the vein and superficial to the pectoralis major","The pleura lying superficial to the artery"],"k":2,"e":"In the costoclavicular space the three cords form a compact group on the lateral side of the artery, which makes one central injection effective."},{"c":6,"id":"6.B08","s":"Ch 6, section 6.2","q":"A cadaver study defined the costoclavicular space. Where does the space lie?","o":["Between the sternocleidomastoid and the prevertebral fascia, at the level of the cricoid cartilage in the neck, medial to the carotid sheath","Anterior to the first rib and medial to the scalene muscles, beside the subclavian artery as it leaves the thorax, above the pleura","Deep and posterior to the midpoint of the clavicle, between the posterior surface of the clavicle and the second rib","Between the pectoralis minor and the coracoid process","Lateral to the humeral head"],"k":2,"e":"The costoclavicular space sits deep and posterior to the midpoint of the clavicle, between the posterior surface of the clavicle and the second rib, with the cords lateral to and parallel with the axillary artery."},{"c":6,"id":"6.B09","s":"Ch 6, section 6.2","q":"In a randomized comparison of lateral sagittal and costoclavicular infraclavicular approaches in 40 patients, which result was reported for the costoclavicular approach?","o":["No difference in any outcome, including onset time, success and complications","Faster sensory onset, with a median of 10 minutes against 20 minutes","Failure to block the ulnar nerve in a large proportion of the patients studied","Slower onset but longer duration","Higher rates of pneumothorax"],"k":1,"e":"Sensory onset was faster with the costoclavicular approach, 10 minutes against 20 minutes (median). A second trial of 90 patients found similar onset times, so the evidence is mixed."},{"c":6,"id":"6.B10","s":"Ch 6, section 6.2","q":"You need continuous analgesia after major elbow surgery using a costoclavicular approach. What technical point improves catheter stability?","o":["Leave the tip superficial to the pectoralis major so that it can be pulled out easily at the bedside without tunneling","Tunnel it to the neck","Advance the catheter from the costoclavicular space toward the corner pocket of the supraclavicular area","Advance it into the interscalene groove between the anterior and middle scalene muscles for a wider spread of the infusion","Place the tip in the axillary vein"],"k":2,"e":"A catheter can be advanced from the costoclavicular space toward the corner pocket of the supraclavicular area for added stability."},{"c":6,"id":"6.B11","s":"Ch 6, section 6.3","q":"During an axillary block, where is the musculocutaneous nerve found?","o":["In the muscle plane between the biceps and the coracobrachialis, away from the other three nerves","Superficial to the pectoralis major","Behind the axillary artery with the radial nerve","Medial to the vein with the ulnar nerve","Inside the carotid sheath"],"k":0,"e":"By the axilla the musculocutaneous nerve has left the group and lies in the plane between the biceps and the coracobrachialis, so it needs its own injection."},{"c":6,"id":"6.B12","s":"Ch 6, section 6.3","q":"In the randomized trial of axillary block injection distribution, about how was the volume divided?","o":["About 40% behind the artery, 20% into each upper quadrant and 20% around the musculocutaneous nerve","50% around the median nerve and 50% around the ulnar nerve, with none behind the artery or near the radial nerve","90% around the musculocutaneous nerve and the remainder behind the artery, so that the radial nerve is reached","Equal quarters around each of the four nerves","All of it behind the artery"],"k":0,"e":"The volume was divided so that about 40% went behind the artery, 20% into each of the two upper quadrants and 20% around the musculocutaneous nerve."},{"c":6,"id":"6.B13","s":"Ch 6, section 6.3","q":"Which nerve is NOT blocked by a standard axillary brachial plexus block and can be blocked separately at the quadrangular space?","o":["Musculocutaneous nerve","Axillary nerve","Ulnar nerve","Radial nerve","Median nerve"],"k":1,"e":"The axillary nerve leaves the posterior cord before the axilla and is not reached by a standard axillary block, though it can be blocked separately."},{"c":6,"id":"6.B14","s":"Ch 6, section 6.3","q":"Which statement about axillary catheters is best supported by the evidence?","o":["They are the most secure catheter site in the arm because the nerves are fixed in place","They always cause pneumothorax because the needle passes through the pleura","Kinking and dislodgement are more common than with proximal approaches","They cannot be used for postoperative analgesia","They need ultrasound guidance only for removal"],"k":2,"e":"A catheter can be placed beside the artery, but kinking and dislodgement are more common than with proximal approaches."},{"c":6,"id":"6.B15","s":"Ch 6, section 6.4","q":"A hand surgeon wants the patient's elbow to remain strong while the hand is anesthetized. In a small randomized trial, what did selective upper-arm blocks achieve compared with an axillary block?","o":["No difference in any outcome, including elbow motor function and analgesia at 24 hours","Longer onset and lower satisfaction, with more tourniquet pain in the upper arm group","Worse analgesia but better elbow strength","More preserved elbow motor function with similar postoperative analgesia","Complete elimination of tourniquet pain"],"k":3,"e":"In a trial of 24 patients, selective upper-arm blocks kept more elbow motor function than the axillary block, with similar analgesia, shorter sensory onset and higher satisfaction. The trial was small."},{"c":6,"id":"6.B16","s":"Ch 6, section 6.4","q":"Under the ASRA-ESRA consensus naming pattern, which name is correct for a block of the median nerve at the mid-forearm?","o":["Antebrachial plexus block","Forearm median plexus block","Median nerve block at the forearm","Mid-arm brachial block","Supinator canal block"],"k":2,"e":"The consensus names an individual nerve block by the nerve and the location, for example median nerve block at the forearm."},{"c":6,"id":"6.B17","s":"Ch 6, section 6.4","q":"At mid-forearm, between which structures does the median nerve lie?","o":["Between the biceps and brachialis, close to the humerus in the middle of the arm","Between the brachioradialis and the radius, beside the radial artery near the wrist","Beside the ulnar artery on its ulnar side","Under the flexor carpi ulnaris tendon","Between the flexor digitorum superficialis and profundus"],"k":4,"e":"At mid-forearm the median nerve lies between the flexor digitorum superficialis and profundus, as a flattened oval with a honeycomb pattern."},{"c":6,"id":"6.B18","s":"Ch 6, section 6.4","q":"You are finding the radial nerve at the mid-forearm. Which description fits?","o":["A fusiform structure between the biceps and the brachialis, lying close to the humerus in the middle of the arm","A structure beneath the flexor retinaculum","A large round nerve on the ulnar side of the ulnar artery, easier to see at the wrist than at the elbow","A structure inside the carpal tunnel","A thin flat structure beside the radial artery under the brachioradialis, easier to see at the elbow"],"k":4,"e":"The radial nerve is thin and flat beside the radial artery under the brachioradialis, and it is easier to see at the elbow."},{"c":6,"id":"6.B19","s":"Ch 6, section 6.4","q":"A patient has a partial brachial plexus block with a missed lateral forearm territory. Which nerve supplies the lateral antebrachial cutaneous territory?","o":["Musculocutaneous nerve","Axillary nerve","Ulnar nerve","Median nerve","Radial nerve"],"k":0,"e":"The lateral antebrachial cutaneous nerve is the sensory continuation of the musculocutaneous nerve, so a median, radial and ulnar block does not cover it."},{"c":6,"id":"6.B20","s":"Ch 6, section 6.4","q":"In a review of distal nerve blocks, which statement was reported?","o":["Ulnar block alone succeeded in 100% in two studies, but combined blocks failed in a third of cases","Distal blocks were less successful than plexus blocks in every study that compared the two approaches","Wrist blocks were never used for hand surgery","A combined median, radial and ulnar block succeeded in 97% of cases in one randomized trial","Ulnar block alone failed in half of cases"],"k":3,"e":"A combined median, radial and ulnar block succeeded in 97% in one randomized trial, and ulnar block alone succeeded in 100% in two studies."},{"c":6,"id":"6.B21","s":"Ch 6, section 6.5","q":"You are looking for a nerve at the wrist and see a bright structure that changes brightness as you tilt the probe. What is it most likely?","o":["A tendon","The ulnar nerve","The radial artery","The median nerve","The flexor retinaculum"],"k":0,"e":"A nerve keeps its shape when the probe is tilted, whereas a tendon shines and fades. Tilting is the quick way to tell them apart."},{"c":6,"id":"6.B22","s":"Ch 6, section 6.5","q":"A wrist block of the median, ulnar and radial sensory nerves is performed for hand surgery. Which territory remains unblocked?","o":["The palmar surface of the index finger, supplied by the median nerve through its digital branches","The little finger, which is supplied by the ulnar nerve through its digital branches","The ring finger","The thumb tip","The area supplied by the lateral antebrachial cutaneous nerve"],"k":4,"e":"A wrist block covers the hand but not the territory of the lateral antebrachial cutaneous nerve or the deep radial branch."},{"c":6,"id":"6.B23","s":"Ch 6, section 6.5","q":"A surgeon wants a wide-awake patient for carpal tunnel release without an arm tourniquet. Which block is suitable?","o":["Wrist block of the median nerve, with ulnar and radial blocks as needed","Interscalene block","Axillary block with tourniquet","Cervical plexus block","Bier block"],"k":0,"e":"A wrist block suits hand surgery that does not need a tourniquet above the wrist, including carpal tunnel release."},{"c":6,"id":"6.B24","s":"Ch 6, section 6.5","q":"During a median nerve block at the wrist, the patient reports a sharp electric sensation and the injection pressure is high. What is the best action?","o":["Stop injecting and withdraw, because this suggests an intraneural injection","Add epinephrine to the solution and continue the injection at the same pressure","Change to a longer needle and inject deeper to find a path with lower resistance","Continue; this is the expected endpoint","Increase the speed of injection"],"k":0,"e":"Intraneural injection into the median nerve at the carpal tunnel is a known hazard. Stop and reposition if there is pain or high resistance."},{"c":6,"id":"6.B25","s":"Ch 6, section 6.5","q":"A hand surgeon asks you to block a single finger for a nail procedure. What is the technique described?","o":["An injection into the flexor tendon sheath","A single subcutaneous injection at the base of the finger, in the fat and not in the flexor sheath","A ring block with a large volume under pressure","An ultrasound-guided block of the median nerve at the elbow","A digital tourniquet with intravenous lidocaine"],"k":1,"e":"A single subcutaneous injection at the base of the finger, away from the flexor sheath, is used, with the needle moved slowly to limit pain."},{"c":6,"id":"6.B26","s":"Ch 6, section 6.5","q":"What is the main reason many clinicians once avoided epinephrine in digital blocks?","o":["Old case reports before 1950 linked it to digital necrosis","It prevents the local anesthetic from working at the dose normally given","It is chemically incompatible with lidocaine when the two are mixed","Randomized trials showed gangrene in 5%","It causes seizures in healthy fingers"],"k":0,"e":"The teaching rests on case reports from before 1950. A review of at least 2,797 digital blocks with epinephrine found no complication attributed to it."},{"c":6,"id":"6.B27","s":"Ch 6, section 6.5","q":"Which actual hazards should you check before a digital block?","o":["Whether the finger belongs to the dominant hand of the patient","A ring on the finger and any plan for a digital tourniquet","Lidocaine allergy only, since no other factor changes the plan","The patient's body mass index","The patient's blood group"],"k":1,"e":"A digital tourniquet and a ring are the real hazards. Remove rings before the block and avoid a digital tourniquet."},{"c":6,"id":"6.B28","s":"Ch 6, section 6.6","q":"Which sequence correctly describes the safety setup for a Bier block?","o":["Use the same cannula for resuscitation and injection","Release the cuff immediately after injection","Inflate the cuff to just below systolic pressure","Place a separate intravenous line in the other arm, drain the limb, inflate the proximal cuff above systolic pressure, and confirm the pulse has stopped before injecting","Inject first, then inflate the cuff"],"k":3,"e":"A separate line allows resuscitation, the cuff must be well above systolic pressure, and the pulse should be confirmed absent before the drug is injected."},{"c":6,"id":"6.B29","s":"Ch 6, section 6.6","q":"In a systematic review of Bier block complications, which statement about seizures and cardiac arrest was reported?","o":["No arrests were reported with any drug","Seizures occurred only with lidocaine","Seizures occurred with lidocaine, prilocaine and bupivacaine, while arrests and deaths were reported only with lidocaine and bupivacaine","Arrests occurred only with prilocaine","Deaths occurred only with chloroprocaine"],"k":2,"e":"Seizures were reported with lidocaine, prilocaine and bupivacaine, and cardiac arrests and deaths with lidocaine and bupivacaine only."},{"c":6,"id":"6.B30","s":"Ch 6, section 6.6","q":"Shortly after cuff release in a Bier block, a patient develops tinnitus and perioral numbness. What is the most likely explanation?","o":["Hemidiaphragmatic paralysis","A load of local anesthetic reached the circulation when the cuff was released or leaked","Intraneural injection of the median nerve","Raised intracranial pressure","Allergy to chlorhexidine"],"k":1,"e":"Everything that can go wrong goes wrong at the cuff. Early release or a leak delivers a full dose into the circulation within seconds, and lipid emulsion and resuscitation equipment should be at hand before the cuff goes up."},{"c":6,"id":"6.B31","s":"Ch 6, section 6.6","q":"For which of these is a Bier block best suited?","o":["A two-hour tourniquet-free hand reconstruction needing a prolonged block","Surgery on the thigh, where the cuff would sit on the operative field","Postoperative analgesia for two days","Major shoulder surgery","A short forearm or hand procedure lasting well under an hour"],"k":4,"e":"The Bier block suits short procedures on the forearm and hand. Tourniquet pain develops with time and limits the block to short procedures."},{"c":6,"id":"6.B32","s":"Ch 6, section 6.7","q":"A patient needs a tourniquet-free hand operation, and the surgeon wants the elbow strong afterward. What is the best first choice?","o":["General anesthesia only","Interscalene block","Supraclavicular block","Costoclavicular block","Wrist or forearm nerve blocks"],"k":4,"e":"Wrist or forearm nerve blocks are quick and leave the elbow strong when no tourniquet above the wrist is needed."},{"c":6,"id":"6.B33","s":"Ch 6, section 6.7","q":"In a randomized trial of supraclavicular intracluster injection versus infraclavicular block, how did the supraclavicular technique perform?","o":["Onset was 30 minutes in both groups","Onset was equal and the phrenic nerve was spared","Success was lower and Horner syndrome absent","Onset was about twice as fast, 8.9 minutes against 17.6 minutes, but it carries the risks of a block above the clavicle","Onset was slower, with fewer complications"],"k":3,"e":"Injecting into the largest cluster of the plexus above the clavicle started working in about half the time of an infraclavicular block, but it carries the risks of any block above the clavicle."},{"c":6,"id":"6.B34","s":"Ch 6, section 6.3","q":"A trainee wants to choose an approach for elbow-to-hand surgery based on the randomized trial of 120 patients comparing supraclavicular, infraclavicular and axillary blocks. Which statement is supported?","o":["The infraclavicular block was clearly more successful than the other two","Success rates were about the same, the axillary block needed the most needle passes, and Horner syndrome was most common after the supraclavicular block","The supraclavicular block needed the most needle passes and caused no Horner syndrome","The axillary block had the fastest total time and the highest success","Horner syndrome occurred equally with all three blocks"],"k":1,"e":"Success was 95% to 97.5% with all three and total anesthesia-related times were 23 to 26 minutes. The axillary block needed 6.1 needle passes against 2.0 to 2.6, and Horner syndrome occurred in 37.5% with the supraclavicular block against 0% to 5% with the others. Choose among them on the patient's lungs and the surgical site, not on a difference in success."},{"c":6,"id":"6.B35","s":"Ch 6, section 6.2","q":"You perform a costoclavicular block and the spread around the cords looks incomplete. What is described?","o":["The trials injected into the artery, and a second injection is never needed because the spread is always complete","The trials injected beside the medial cord only, and a second injection is given at the elbow if the block is incomplete","The trials placed a catheter in the cluster, and a second injection is given after 4 hours if the block is incomplete","The trials injected superficial to the clavicle, and a second injection is given in the corner pocket","The trials injected into the center of the cluster, with a second injection near the lateral cord if needed"],"k":4,"e":"The trials injected into the center of the cluster of cords, and a second injection near the lateral cord is used when spread is incomplete. The three cords lie together on the lateral side of the artery at the costoclavicular space. Do not inject into the artery, and watch the spread on the screen."},{"c":6,"id":"6.B36","s":"Ch 6, section 6.2","q":"A colleague asks why a costoclavicular block, aimed at the cords in the infraclavicular region, sometimes gives a good shoulder block as well as a good arm block. What was reported?","o":["Contrast placed there stayed in the infraclavicular space in all patients, so the shoulder effect is due to a systemic effect","Contrast placed there reached the paravertebral space in most patients, which explains the shoulder effect","Contrast placed there reached the interscalene region in a computed tomography study, which may explain the effect on the shoulder, and the intercostobrachial nerve is not covered","Contrast reached the axillary sheath only, so a shoulder block is never expected","Contrast reached the interscalene region, and the intercostobrachial nerve was always covered"],"k":2,"e":"Spread through the cluster covers the arm below the shoulder, and contrast placed there has reached the interscalene region in a computed tomography study, which may explain its effect on the shoulder. The intercostobrachial nerve is still not covered, so the inner upper arm may need a subcutaneous injection if a tourniquet is used."},{"c":7,"id":"7.B01","s":"Ch 7, section 7.1","q":"A 68-year-old man will have a thyroid lobectomy under general anesthesia, and you want a block for the skin of the neck. Which nerves form the superficial cervical plexus?","o":["Greater occipital, supraorbital, mental and infraorbital nerves","Superior laryngeal, recurrent laryngeal, lingual and facial nerves","Lesser occipital, great auricular, transverse cervical and supraclavicular nerves","Phrenic, vagus, glossopharyngeal and hypoglossal nerves","Suprascapular, axillary, radial and median nerves"],"k":2,"e":"The superficial branches are the lesser occipital, great auricular, transverse cervical and supraclavicular nerves. They emerge near the posterior border of the sternocleidomastoid muscle and fan out over the neck."},{"c":7,"id":"7.B02","s":"Ch 7, section 7.1","q":"Who named the intermediate cervical plexus block, and when?","o":["Telford and Stoneham in 2004","The ASRA-ESRA consensus in 2021","Winnie in 1975","Greher and colleagues in 2010","Moore in 1965"],"k":0,"e":"The intermediate block was named by Telford and Stoneham in 2004. It places the injectate in the plane between the investing fascia and the prevertebral fascia at C4."},{"c":7,"id":"7.B03","s":"Ch 7, section 7.1","q":"In a pilot trial of cervical block techniques for carotid surgery (n = 30), how did deep cervical block compare with the intermediate block?","o":["Plasma ropivacaine levels were higher and phrenic paralysis occurred often, though without respiratory distress","Surgeon satisfaction was lower with the intermediate block","Plasma levels were lower and no phrenic paralysis occurred","Conversion to general anesthesia was common with deep block","Success rates were lower with the intermediate block"],"k":0,"e":"Plasma ropivacaine was higher after deep block than after intermediate block, and phrenic paralysis was observed frequently after deep block. None of those patients showed respiratory distress."},{"c":7,"id":"7.B04","s":"Ch 7, section 7.1","q":"A systematic review of cervical plexus block for carotid endarterectomy compared block depths. What did it find?","o":["Deep blocks had fewer complications","There was no difference between any techniques","Only intermediate blocks caused phrenic palsy","Deep or combined blocks had more serious needle-related complications than superficial or intermediate blocks","Superficial blocks had more vascular injuries"],"k":3,"e":"The review reported more serious needle-related complications with deep or combined blocks than with superficial or intermediate blocks."},{"c":7,"id":"7.B05","s":"Ch 7, section 7.1","q":"A surgeon prefers regional anesthesia for carotid endarterectomy. What is the usual reason?","o":["It eliminates the risk of stroke during the clamping of the carotid artery completely","It removes the need for any anesthesia monitoring","It is faster to perform than general anesthesia","It blocks the deep muscles of the neck completely and so improves the surgical field","It lets the surgeon test the patient's neurological function during clamping"],"k":4,"e":"Regional anesthesia lets the surgeon assess neurological function during clamping, which is the reason most centers choose it. The GALA trial of 3,526 patients compared local with general anesthesia for carotid surgery."},{"c":7,"id":"7.B06","s":"Ch 7, section 7.1","q":"What does an intermediate cervical plexus block NOT cover?","o":["The deep muscles of the neck and the areas supplied by cranial nerves","The skin over the clavicle, which is reached by the supraclavicular nerves","The skin over the thyroid, which is reached by the transverse cervical nerve","The area behind the ear","The skin of the lateral neck"],"k":0,"e":"The intermediate block reaches the superficial cervical branches. It does not cover the deep neck muscles or structures supplied by cranial nerves."},{"c":7,"id":"7.B07","s":"Ch 7, section 7.1","q":"While performing an intermediate cervical plexus block at C4, local anesthetic should be seen to spread:","o":["As a fluid layer under the sternocleidomastoid, not as a bubble inside the muscle","Around the vertebral artery in the transverse foramen","Into the carotid sheath","Into the prevertebral muscles","Into the epidural space"],"k":0,"e":"The endpoint is a visible layer of fluid along the posterior border of the sternocleidomastoid, with the carotid and vein kept out of the needle path."},{"c":7,"id":"7.B08","s":"Ch 7, section 7.2","q":"A 40-year-old woman with refractory migraine is offered a greater occipital nerve block. Which description of the nerve is correct?","o":["The posterior branch of the second cervical nerve, passing between the obliquus capitis inferior and the semispinalis capitis","The terminal branch of the vagus nerve","A branch of the trigeminal nerve","A branch of the facial nerve","The anterior branch of the third cervical nerve"],"k":0,"e":"The greater occipital nerve is the posterior branch of C2. It passes between the obliquus capitis inferior and the semispinalis capitis and then pierces the trapezius near the superior nuchal line."},{"c":7,"id":"7.B09","s":"Ch 7, section 7.2","q":"At the proximal (C2) site for greater occipital nerve block, what is the midline landmark on ultrasound?","o":["The hyoid bone","The spinous process of C2","The mastoid process","The transverse process of C7","The external occipital protuberance only"],"k":1,"e":"At C2 the spinous process is the midline landmark, with the obliquus capitis inferior running laterally from it and the nerve lying between that muscle and the semispinalis capitis."},{"c":7,"id":"7.B10","s":"Ch 7, section 7.2","q":"After a greater occipital nerve block, which scalp region is anesthetized?","o":["The lateral scalp near the ear, supplied by the auriculotemporal nerve","The back of the scalp up to the vertex on the injected side","The whole face","The neck skin below the clavicle, supplied by the supraclavicular nerves","The forehead and anterior scalp"],"k":1,"e":"The block covers the back of the scalp up to the vertex on the injected side and not the front of the scalp or the lateral scalp near the ear."},{"c":7,"id":"7.B11","s":"Ch 7, section 7.2","q":"In a placebo-controlled pilot trial of ultrasound-guided greater occipital nerve block for migraine without aura (n = 23), what was reported?","o":["Pain fell on both sides in the treated group","The block caused severe complications in half the patients","Pain fell equally in both groups","The trial found no effect and was stopped early","Pain on the injected side fell in the treated group but not in the placebo group, with no serious adverse effects"],"k":4,"e":"The decrease in monthly pain intensity on the injected side was significant in the treatment group and not in the placebo group. No serious side effect occurred, and one patient had a self-limited vasovagal syncope."},{"c":7,"id":"7.B12","s":"Ch 7, section 7.2","q":"A randomized trial compared proximal and distal ultrasound-guided greater occipital nerve injections in chronic migraine (n = 40). What did it conclude?","o":["Only the distal technique reduced headache days","Both techniques caused serious adverse effects","Both reduced headache days at one month, and the proximal technique may give more sustained benefit","There was no change in headache days with either technique","The proximal technique had no effect on sleep"],"k":2,"e":"Both techniques gave short-term improvement, with a significant reduction in headache days per week in both groups. The proximal technique may give more sustained analgesic benefit, and there were no significant adverse effects."},{"c":7,"id":"7.B13","s":"Ch 7, section 7.2","q":"A patient needs repair of a forehead laceration extending to the upper eyelid. From which nerve does the supraorbital nerve arise?","o":["The glossopharyngeal nerve, which also supplies the posterior tongue and pharynx","The mandibular division of the trigeminal nerve","The facial nerve","The frontal nerve, from the ophthalmic division of the trigeminal nerve","The maxillary division of the trigeminal nerve, through the infraorbital foramen"],"k":3,"e":"The frontal nerve, from the ophthalmic division, divides in the orbit into the larger supraorbital nerve and the smaller supratrochlear nerve."},{"c":7,"id":"7.B14","s":"Ch 7, section 7.2","q":"During a supraorbital nerve block, the patient reports sudden severe shooting pain as the needle contacts the nerve. What should you do?","o":["Add epinephrine to the solution and continue the injection","Inject rapidly to blunt the pain from the contact","Advance further to enter the foramen","Withdraw and reposition before injecting","Continue with a larger volume"],"k":3,"e":"Injecting into the nerve causes immediate severe pain. Withdraw and reposition, and do not inject if the patient reports pain at the moment of contact."},{"c":7,"id":"7.B15","s":"Ch 7, section 7.2","q":"A neurosurgeon plans a scalp block for craniotomy. Which nerve is blocked in addition to the supraorbital and supratrochlear nerves?","o":["Vagus nerve","Suprascapular nerve","Auriculotemporal nerve","Phrenic nerve","Hypoglossal nerve"],"k":2,"e":"A scalp block for craniotomy adds the zygomaticotemporal, auriculotemporal, greater auricular, lesser occipital, greater occipital and third occipital nerves to the supraorbital and supratrochlear nerves."},{"c":7,"id":"7.B16","s":"Ch 7, section 7.3","q":"A 78-year-old man is having cataract surgery under an eye block. Where is the local anesthetic placed in a peribulbar block?","o":["Behind the optic nerve sheath, in the retrobulbar fat","In the subarachnoid space around the optic nerve","Under the conjunctiva only","Outside the muscle cone, relying on spread","Inside the muscle cone"],"k":3,"e":"A retrobulbar block places the injectate inside the muscle cone (intraconal). A peribulbar block places it outside the cone (extraconal) and relies on spread."},{"c":7,"id":"7.B17","s":"Ch 7, section 7.3","q":"A patient has high myopia with a long eyeball. How should this affect the peribulbar block?","o":["Avoid hyaluronidase, since it has no effect on the spread of the anesthetic in a long eye","Use a smaller volume, because the minimum effective volume falls as axial length rises","Use a larger volume, because the orbit is larger and the anesthetic spreads further away","No change is needed","Use a retrobulbar block with a sharp needle"],"k":1,"e":"The minimum effective volume of local anesthetic in peribulbar block was strongly and inversely correlated with axial length, and a long myopic eye also has a higher risk of perforation."},{"c":7,"id":"7.B18","s":"Ch 7, section 7.3","q":"In an older randomized trial of peribulbar anesthesia (n = 50), what was the effect of adding hyaluronidase 25 IU/mL?","o":["It caused brainstem anesthesia in some of the patients in the hyaluronidase group","It reduced the volume to under 3 mL in all patients without changing akinesia","It doubled the speed of onset","It abolished the need for facial nerve block","It did not significantly shorten the time to satisfactory globe akinesia"],"k":4,"e":"Addition of hyaluronidase to a standard mixture did not significantly reduce the time to onset of satisfactory globe akinesia."},{"c":7,"id":"7.B19","s":"Ch 7, section 7.3","q":"In a large retrospective series of 17,460 needle-based eye blocks, what was the prevalence of globe penetration?","o":["About 10%, or one in ten blocks","About 0.024% (4 cases)","About 0.5%, or one in two hundred blocks","About 2.4%","Zero"],"k":1,"e":"The series found four penetrations in 17,460 procedures, a prevalence of 0.024%. Globe perforation is rare but potentially blinding."},{"c":7,"id":"7.B20","s":"Ch 7, section 7.3","q":"Several minutes after a retrobulbar injection a patient becomes apneic, hypotensive and bradycardic. Which first response is correct?","o":["Inject more local anesthetic","Support the airway and ventilation until the effect wears off","Give epinephrine and a large fluid bolus only, without airway support","Observe for 30 minutes","Proceed with surgery"],"k":1,"e":"This is brainstem anesthesia from spread along the optic nerve sheath. Treatment is airway and ventilatory support, and any facility that gives eye blocks must be able to resuscitate."},{"c":7,"id":"7.B21","s":"Ch 7, section 7.3","q":"Why might a clinician choose a sub-Tenon's block for a patient who does not need dense akinesia?","o":["It blocks the facial nerve and so prevents eyelid squeezing completely and reliably","It requires no local anesthetic","A blunt cannula avoids a sharp needle near the globe and its two disasters","It guarantees complete akinesia","It carries no risk at all"],"k":2,"e":"A blunt cannula placed between the globe and Tenon's capsule delivers local anesthetic with no sharp needle near the globe, avoiding perforation and brainstem anesthesia from a sharp-needle block."},{"c":7,"id":"7.B22","s":"Ch 7, section 7.4","q":"Where does the internal branch of the superior laryngeal nerve enter the larynx?","o":["Through the cricoid cartilage, below the vocal cords on the way to the trachea","Through the cricothyroid membrane","Between the hyoid and the mandible","Through the thyrohyoid membrane, with the superior laryngeal artery","Through the lamina of the thyroid cartilage, beside the cricothyroid muscle"],"k":3,"e":"The internal branch pierces the thyrohyoid membrane with the superior laryngeal artery and supplies the larynx down to the vocal cords."},{"c":7,"id":"7.B23","s":"Ch 7, section 7.4","q":"In a randomized trial of superior laryngeal nerve block for awake intubation (n = 50), which adverse effect was more frequent before intubation with the parasagittal approach?","o":["Pneumothorax requiring a chest drain","Sore throat that lasted for a full day","Hoarseness (72% against 40%)","Hematoma","Aspiration"],"k":2,"e":"Hoarseness before intubation was more common in the parasagittal group (72% against 40%), while sore throat at 24 hours was less common (8% against 36%)."},{"c":7,"id":"7.B24","s":"Ch 7, section 7.4","q":"After a successful superior laryngeal nerve block, which region remains unblocked?","o":["The vallecula and the surface of the epiglottis","The base of the tongue","The epiglottis and the arytenoid folds","The trachea below the vocal cords","The larynx above the cords"],"k":3,"e":"The block covers the larynx above the cords and does not cover the cords themselves or the trachea below them."},{"c":7,"id":"7.B25","s":"Ch 7, section 7.4","q":"A patient is awake and you are performing an intraoral glossopharyngeal nerve block. Where is the injection made?","o":["Submucosally at the caudal end of the posterior tonsillar pillar","At the cricothyroid membrane, in the midline below the thyroid cartilage","Behind the angle of the mandible","Into the vallecula","Into the base of the epiglottis"],"k":0,"e":"After topical anesthesia and tongue retraction, inject at the caudal end of the posterior tonsillar pillar, aspirating first. Blood on aspiration means the needle is too lateral."},{"c":7,"id":"7.B26","s":"Ch 7, section 7.4","q":"What is an added risk of the peristyloid approach to the glossopharyngeal nerve?","o":["Injury to the carotid body only, with loss of the carotid reflex","Injury to the brachial plexus from the long needle path in the neck","Blocking the hypoglossal and vagus nerves","Blocking the trigeminal nerve","Blocking the phrenic nerve"],"k":2,"e":"The peristyloid approach carries a risk of concomitant block of the hypoglossal and vagus nerves."},{"c":7,"id":"7.B27","s":"Ch 7, section 7.4","q":"Why does a transtracheal injection produce a cough, and is it a problem?","o":["It signals vascular injection and must be treated as toxicity with lipid emulsion at once","The cough is expected and spreads the local anesthetic over the cords and trachea","It is a sign of pneumothorax","It signals allergy to local anesthetic","It means the needle is in the esophagus"],"k":1,"e":"A needle through the cricothyroid membrane enters the airway below the cords, and the cough after injection is expected and spreads the local anesthetic."},{"c":7,"id":"7.B28","s":"Ch 7, section 7.5","q":"According to the Difficult Airway Society awake intubation guideline, which four tasks organize the procedure?","o":["Consent, positioning, suction and tube placement","Premedication, monitoring, ventilation and recovery","Induction, relaxation, intubation and extubation","Preoxygenation, paralysis, laryngoscopy and confirmation","Sedation, topicalization, oxygenation and performance"],"k":4,"e":"The guideline frames awake tracheal intubation as sedation, topicalization of the airway, oxygenation, and performance of the intubation, with oxygen always given."},{"c":7,"id":"7.B29","s":"Ch 7, section 7.5","q":"A review of upper airway blocks for awake difficult airway management concluded that complete anesthesia of the upper airway requires:","o":["An interscalene block","Only a topical gargle","A deep cervical plexus block","Only a superior laryngeal nerve block","Bilateral glossopharyngeal and superior laryngeal nerve blocks with a translaryngeal injection"],"k":4,"e":"Complete anesthesia needs bilateral glossopharyngeal and superior laryngeal blocks with a translaryngeal injection, with ultrasound helpful for the midline and thyrohyoid membrane."},{"c":7,"id":"7.B30","s":"Ch 7, section 7.3","q":"You prepare a peribulbar block and ask how the volume is chosen. Which description is correct?","o":["Bupivacaine 0.75% alone in a fixed volume of 20 mL for every eye, because response and eye length do not matter","A mixture of lidocaine 2% and bupivacaine 0.5% in equal parts, often with hyaluronidase; a study of minimum effective volume started at 7 mL, and the volume was then set by the response and by the axial length of the eye","Lidocaine 2% alone in a fixed volume of 7 mL, repeated every 5 minutes until the eye is akinetic","A mixture of lidocaine 2% and bupivacaine 0.5% with a volume set only by the patient's weight","Ropivacaine 0.2% with hyaluronidase, in a volume set by the surgeon's preference alone"],"k":1,"e":"A mixture of lidocaine 2% and bupivacaine 0.5% in equal parts, often with hyaluronidase, is described for the peribulbar block. A study of minimum effective volume started at 7 mL, and the volume was then set by the response and by the axial length. The volume needed falls as the eye gets longer, so a standard volume is too much for a long myopic eye."},{"c":7,"id":"7.B31","s":"Ch 7, section 7.3","q":"A pooled review of six trials compared peribulbar and retrobulbar blocks. Besides finding no difference in pain or akinesia, which pair of side effects did it report?","o":["Lid hematoma was more common after peribulbar block, and chemosis was more common after retrobulbar block","Brainstem anesthesia was more common after peribulbar block, and globe perforation was more common after retrobulbar block","Both side effects were equally common after both blocks, and neither was reported in the trials","Chemosis was more common after peribulbar block, and lid hematoma was more common after retrobulbar block","Chemosis and lid hematoma were both more common after peribulbar block, and severe complications were common in both"],"k":3,"e":"In the review of six trials, there was no difference in pain or akinesia. Chemosis, swelling of the conjunctiva, was more common after peribulbar block, and lid hematoma was more common after retrobulbar block, and serious complications were rare in both. The two pairs are easy to swap, so tie each to its technique."},{"c":7,"id":"7.B32","s":"Ch 7, section 7.2","q":"A patient with a different headache disorder asks whether a greater occipital nerve block is proven for her. Which statement matches the evidence?","o":["The trials cited are large trials in every kind of headache disorder, so the block is proven for her too","The trials cited are in cluster headache only, and they show a large effect that was repeated in every trial","The trials cited are in migraine and are small, so the evidence cannot be extended to other disorders","No trial has ever been published, and the block has no place in practice","The trials cited showed serious adverse effects in a third of the patients"],"k":2,"e":"The block has been used for several headache disorders, but the trials cited are in migraine and are small. In the trial in migraine without aura (23 patients) pain fell on the injected side in the treated group and not in the placebo group, with no serious adverse effects. That cannot be extended to other disorders."},{"c":8,"id":"8.B01","s":"Ch 8,
