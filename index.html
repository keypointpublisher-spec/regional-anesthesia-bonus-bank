 right subcostal incision. Which TAP variant is best suited to cover the upper abdomen?","o":["Subcostal TAP block","Midaxillary TAP block","Rectus sheath block at the arcuate line","Ilioinguinal iliohypogastric nerves block","Transversalis fascia plane block at the iliac crest"],"k":0,"e":"In an observational study the subcostal approach gave a median spread of 4 dermatomes with a highest level at T8, against 3 dermatomes and T10 for the older posterior approach. A midaxillary block covers the lower abdomen and a subcostal block reaches the upper abdomen."},{"c":11,"id":"11.B02","s":"Ch 11, section 11.1","q":"A 33 year old man who had a lower abdominal TAP block still reports deep cramping pain from bowel handling. What explains this?","o":["The block spread to the wrong dermatomes in the lower abdomen","The block was too superficial and only covered the skin of the wall","The nerves of the wall do not supply the peritoneum","The block lasts only 30 minutes","A TAP block numbs the abdominal wall and not the viscera"],"k":4,"e":"The TAP block numbs the skin, the muscles and the parietal peritoneum of the wall. The viscera are not numbed, and visceral pain stays, so the block is one part of a multimodal plan."},{"c":11,"id":"11.B03","s":"Ch 11, section 11.1","q":"On ultrasound at the midaxillary line you see three muscle layers over the peritoneum. Which pair of layers bounds the TAP block target?","o":["The external oblique and the internal oblique, in the lateral wall","The transversus abdominis and the peritoneum, on the deep side","The rectus abdominis and the posterior sheath","The external oblique and the subcutaneous fat","The internal oblique and the transversus abdominis"],"k":4,"e":"The sensory nerves of the wall run in the thin plane between the internal oblique and the transversus abdominis. The transversus abdominis is the deepest and thinnest layer."},{"c":11,"id":"11.B04","s":"Ch 11, section 11.1","q":"During a TAP block the transversus abdominis swells when you inject and a lens shaped pocket does not form. What does this indicate?","o":["The tip is in the muscle and needs to be moved to the plane","The block is working as expected and the tip is in the correct plane","The tip is in the peritoneal cavity and the injectate is free in the abdomen","The injectate has reached the paravertebral space","The needle is too superficial in the subcutaneous fat"],"k":0,"e":"A small test volume should separate the layers into a dark lens shaped pocket. If the muscle swells or the peritoneum bulges, the tip is in the wrong place."},{"c":11,"id":"11.B05","s":"Ch 11, section 11.1","q":"A Cochrane review of TAP blocks after abdominal surgery (5 studies, 236 patients) found a lower 24 hour morphine use overall. Which subgroup result limits the conclusion?","o":["The comparison against no block showed no difference in morphine use","Morphine use was higher with the block","The comparison against a placebo block did not reach significance","There was no reduction in pain scores in any subgroup that was analyzed","The studies all used landmark technique"],"k":2,"e":"Overall morphine use was lower by about 22 mg and the comparison with no block showed a reduction near 31 mg, but the comparison with a placebo block was not significant. The review combined only a few small studies, so its confidence in the size of the effect is limited."},{"c":11,"id":"11.B06","s":"Ch 11, section 11.1","q":"A meta-analysis of 12 trials in 641 patients compared the posterior and lateral TAP techniques for transverse lower abdominal incisions. Which finding did it report?","o":["The lateral technique reduced morphine use and the posterior did not, in a head to head comparison","Both techniques were identical in effect and had been compared head to head in several trials","Neither technique had any effect on morphine use at any time after surgery","Posterior TAP reduced morphine at 12 to 24 hours, lateral did not, and they were never compared directly","The posterior technique increased morphine use compared with no block at all"],"k":3,"e":"The posterior technique lowered morphine use by about 9 mg in the 12 to 24 hour interval and 5 mg in the 24 to 48 hour interval, while the lateral technique did not differ from control. The authors noted the two had never been compared directly."},{"c":11,"id":"11.B07","s":"Ch 11, section 11.1","q":"An older trial describes a posterior TAP block. In current consensus nomenclature, the same injection is now called:","o":["Subcostal TAP block","Lateral quadratus lumborum block","Anterior quadratus lumborum block","Transversalis fascia plane block","Posterior quadratus lumborum block"],"k":1,"e":"The older posterior TAP block placed the injection at the lateral edge of the quadratus lumborum, and the consensus gave that injection a new name, the lateral quadratus lumborum block. Older trials of posterior TAP are therefore trials of a block now called something else."},{"c":11,"id":"11.B08","s":"Ch 11, section 11.1","q":"You are asked about complications reported after TAP blocks. Which statement is correct?","o":["Liver injury is impossible with a TAP block because the plane is superficial to the peritoneum and the viscera","Complications occur only when landmark techniques are used without ultrasound, never with a needle seen on screen","The only recognized risk is mild skin bruising at the site of entry","Visceral and liver injuries have been reported, so the whole needle must be seen at all times","Injury is avoided by advancing the needle blindly until a pop is felt"],"k":3,"e":"Needle placement in the peritoneum or viscera, injection into muscle and intravascular injection can occur. The safeguard is keeping the entire needle in view."},{"c":11,"id":"11.B09","s":"Ch 11, section 11.1","q":"In an observational study of 81 TAP blocks in 50 patients, what proportion had a demonstrable sensory block?","o":["50%","68%","80%","98%","100%"],"k":3,"e":"In the observational study 98% had a demonstrable sensory block. The posterior approach gave a median spread of 3 dermatomes and the subcostal approach 4 dermatomes."},{"c":11,"id":"11.B10","s":"Ch 11, section 11.1","q":"A 39 year old woman cannot have neuraxial anesthesia for lower abdominal surgery. Why might a TAP block still be a reasonable, low risk choice?","o":["It provides complete visceral analgesia for the whole of the abdominal cavity","It is more effective than epidural analgesia for all outcomes after surgery, including pain at rest and with cough","It eliminates the need for any other analgesic drug in the first week","It lasts for a week after a single injection in most patients","It gives a modest reduction in opioid use for a day or two when no other regional technique is used"],"k":4,"e":"The practical reading of the trials is that a TAP block gives a modest reduction in opioid use for a day or two, and that it is easiest to see in studies with a control that has no block. It is a reasonable low risk choice when the neuraxial route is unavailable."},{"c":11,"id":"11.B11","s":"Ch 11, section 11.2","q":"A 4 year old boy is having an umbilical hernia repair. The anesthesiologist considers a rectus sheath block. Where is local anesthetic placed?","o":["Between the internal oblique and the transversus abdominis, at the lateral wall","Behind the quadratus lumborum","Between the rectus abdominis muscle and the posterior layer of its sheath","Deep to the erector spinae at the transverse process of the thoracic spine","Between the external oblique and the rectus abdominis"],"k":2,"e":"A rectus sheath block injects local anesthetic into the potential space between the rectus abdominis and the posterior layer of its sheath, numbing the skin and muscle at the midline. The target is the bright line behind the muscle, and a small test volume should lift the muscle away from the sheath."},{"c":11,"id":"11.B12","s":"Ch 11, section 11.2","q":"Below the arcuate line the posterior rectus sheath is absent. Which layer lies behind the muscle there?","o":["The external oblique aponeurosis","The linea alba","The transversalis fascia","The peritoneum only, with no fascia","The internal oblique muscle"],"k":2,"e":"The posterior rectus sheath is thin and absent below the arcuate line, so the transversalis fascia is the layer behind the muscle there. This matters when the needle approaches the plane below the arcuate line, where there is no posterior sheath to stop the tip."},{"c":11,"id":"11.B13","s":"Ch 11, section 11.2","q":"During a rectus sheath block, which vessels run behind the rectus muscle and can be seen with color Doppler?","o":["The deep circumflex iliac vessels","The internal thoracic vessels only","The superficial femoral vessels","The lumbar vessels","The inferior epigastric vessels"],"k":4,"e":"The inferior epigastric vessels run behind the rectus muscle, and injury to them is a recognized complication. Color Doppler helps to find them."},{"c":11,"id":"11.B14","s":"Ch 11, section 11.2","q":"A meta-analysis of four randomized trials in 143 children having umbilical hernia repair compared rectus sheath block with wound infiltration. What did it find?","o":["Rectus sheath block reduced pain scores at every time point compared with infiltration","Rectus sheath block increased nausea and morphine use compared with infiltration","Wound infiltration was clearly superior to rectus sheath block on every outcome","Pain, nausea and morphine use did not differ, and rectus sheath block was not inferior but was not better","The trials were stopped early because of peritoneal puncture in several children"],"k":3,"e":"Pain scores at 10 minutes, 30 minutes and 1 hour did not differ, nor did nausea or morphine use. The block earns its place only when it gives more than a surgeon's infiltration can."},{"c":11,"id":"11.B15","s":"Ch 11, section 11.2","q":"A 58 year old man has a midline laparotomy incision that crosses the umbilicus. How should a rectus sheath block be planned?","o":["Bilateral blocks, with or without catheters, and a plan for visceral pain","A single unilateral block placed on the side of the incision only, at the level of the umbilicus","A unilateral subcostal TAP block placed on the right side of the upper abdomen","An ilioinguinal block placed on the side of the larger incision","No block, because a midline incision cannot be blocked at all"],"k":0,"e":"For a midline wound the rectus sheath block is bilateral, and rectus sheath catheters are used after midline laparotomy. Visceral pain needs a separate plan."},{"c":11,"id":"11.B16","s":"Ch 11, section 11.3","q":"A 5 year old boy is having an inguinal hernia repair. The ilioinguinal and iliohypogastric nerves are blocked together. From which nerve roots do they arise?","o":["The iliohypogastric nerve from L3 and the ilioinguinal nerve from L4, as lumbar branches","The iliohypogastric nerve from T12 and L1, and the ilioinguinal nerve from L1","Both from T10","The iliohypogastric nerve from L1 and the ilioinguinal nerve from T12, in the reverse order","Both from S2"],"k":1,"e":"The iliohypogastric nerve arises from T12 and L1 and the ilioinguinal nerve from L1. The consensus gives the block a single name, the ilioinguinal iliohypogastric nerves block, because the two nerves are injected together. Seeing either nerve on the screen is difficult, so the pair is targeted in the plane between the muscle layers."},{"c":11,"id":"11.B17","s":"Ch 11, section 11.3","q":"On ultrasound near the anterior superior iliac spine, which vessel beside the ilioinguinal and iliohypogastric nerves is a useful marker on Doppler?","o":["The inferior epigastric artery","The deep circumflex iliac artery","The femoral artery","The superficial circumflex iliac vein only","The internal thoracic artery"],"k":1,"e":"The nerves lie in the plane between the internal oblique and transversus abdominis near the iliac crest. The deep circumflex iliac artery lies beside them and is a useful marker."},{"c":11,"id":"11.B18","s":"Ch 11, section 11.3","q":"A child has traction on the spermatic cord during orchiopexy despite a good ilioinguinal iliohypogastric block. Why?","o":["It does not cover visceral cord traction pain, nor reliably the genital branch of the genitofemoral nerve","The block spreads to the femoral nerve and produces weakness that masks the pain from the cord","The block covers only the abdominal viscera and does not reach the skin of the groin","The ilioinguinal nerve does not supply the skin of the groin or the scrotum","The block acts only on the skin of the thigh and not on the inguinal canal contents"],"k":0,"e":"The block covers the skin of the groin and the inguinal canal contents but not visceral pain from traction on the cord or peritoneum, nor the genital branch of the genitofemoral nerve. These limits are why the block is part of a multimodal plan and not a complete anesthetic for groin surgery."},{"c":11,"id":"11.B19","s":"Ch 11, section 11.3","q":"Compared with ultrasound guidance, what hazards have been reported with landmark techniques for ilioinguinal blocks?","o":["Pneumothorax and phrenic palsy, with failed blocks being most common in obese patients","Epidural hematoma and cauda equina syndrome, with failed blocks being rare overall","Bowel puncture and pelvic hematoma, with failures when the needle lies superficial to the internal oblique","Brachial plexus injury and Horner syndrome, with failed blocks being rare overall","Hypotension from sympathetic block and bradycardia, with failed blocks being rare"],"k":2,"e":"Bowel puncture and pelvic hematoma have been reported with landmark techniques, and a failed block is common when the needle is superficial to the internal oblique. Ultrasound guidance lets the operator see the muscle layers and the needle tip, which lowers these risks."},{"c":11,"id":"11.B20","s":"Ch 11, section 11.4","q":"The 2021 consensus replaced confusing types 1, 2, 3 and transmuscular names for quadratus lumborum blocks with how many names?","o":["Two, named superficial and deep, as for the parasternal blocks of the chest","Four, numbered type 1 to type 4 as in the original papers","One, called simply the quadratus lumborum block","Five, one for each lumbar level that might be targeted","Three, named by where the needle tip lies: lateral, posterior and anterior"],"k":4,"e":"The consensus named three quadratus lumborum blocks by where the needle tip lies: lateral, posterior and anterior. The lateral block corresponds to the old posterior TAP block, and the anterior block lies between the muscle and the psoas."},{"c":11,"id":"11.B21","s":"Ch 11, section 11.4","q":"In which plane is the injection placed for the posterior quadratus lumborum block?","o":["Between the quadratus lumborum and the psoas muscle, in front of the muscle","Behind the quadratus lumborum, between it and the erector spinae","At the lateral edge of the quadratus lumborum, at the lateral border","Between the rectus abdominis and its posterior sheath","Between the transversus abdominis and the transversalis fascia"],"k":1,"e":"The posterior block places the injection on the posterior surface of the quadratus lumborum, in the plane of the thoracolumbar fascia. The anterior block is between the muscle and the psoas, and the lateral block is at the lateral edge."},{"c":11,"id":"11.B22","s":"Ch 11, section 11.4","q":"In a volunteer trial of 20 adults, a large volume anterior quadratus lumborum block was compared with placebo for quadriceps strength. How should the result be interpreted?","o":["Strength did not differ from placebo within the margin, but this does not prove no patient is weakened","Quadriceps weakness was universal and lasted for several days after the block","The block proved completely safe in every patient who might receive it in practice","Strength was greatly improved by the block compared with placebo in the volunteers","The result applies equally to children and to frail older patients having surgery"],"k":0,"e":"The difference in quadriceps strength was 15.88 N (95% CI minus 12.19 to 43.94), within the non-inferiority margin. The dose used was a research dose and the trial cannot prove that no patient is ever weakened."},{"c":11,"id":"11.B23","s":"Ch 11, section 11.4","q":"In a randomized trial of 76 women having cesarean delivery under spinal anesthesia, a quadratus lumborum block was compared with a TAP block. What was found?","o":["Pain scores were much lower with the TAP block, and morphine use was identical at all times","Morphine use was lower after the TAP block at 12 hours only, with similar pain scores","Pain scores were lower after the quadratus lumborum block, with identical morphine use","Morphine use was lower after the quadratus lumborum block at 12, 24 and 48 hours, with similar pain scores","The quadratus lumborum block was abandoned because of hypotension in all patients"],"k":3,"e":"Morphine use was lower after the quadratus lumborum block at 12, 24 and 48 hours, and pain scores did not differ. The comparison was a TAP block in women having spinal anesthesia, so the result applies to that setting."},{"c":11,"id":"11.B24","s":"Ch 11, section 11.4","q":"A systematic review of 42 trials assessed quadratus lumborum block. For cesarean delivery it reported:","o":["About 24 mg oral morphine equivalents over 24 hours, no change in resting pain, only a marginal advantage","About 240 mg of oral morphine equivalents over 24 hours, with a large improvement in resting pain","No effect on opioid use at all, with worse resting pain than placebo in cesarean delivery","A large improvement in resting pain over TAP block, and a large advantage over every technique","A higher opioid use than placebo, and a clear advantage over every other regional technique"],"k":0,"e":"For cesarean delivery the review found an opioid reduction of about 24 mg of oral morphine equivalents over 24 hours with no change in resting pain. For other surgery, benefit over other regional techniques was marginal, and the authors called the findings preliminary."},{"c":11,"id":"11.B25","s":"Ch 11, section 11.4","q":"After an anterior quadratus lumborum block a patient is hypotensive and has leg weakness. Which explanations are recognized for this block?","o":["Block of the phrenic nerve causing diaphragm paralysis, with hypotension from the loss of ventilation in every case","Sympathetic spread causing hypotension, and lumbar plexus involvement causing leg weakness","Direct injury to the heart causing hypotension and leg weakness","Intrathecal injection of the entire dose in every patient, producing a total spinal block and leg weakness","A stroke caused by the injectate reaching the cerebral circulation"],"k":1,"e":"Hypotension may reflect sympathetic spread and leg weakness may reflect lumbar plexus involvement. Kidney injury and psoas hematoma are other hazards."},{"c":11,"id":"11.B26","s":"Ch 11, section 11.4","q":"The shamrock view is used for quadratus lumborum blocks. Which structures form the leaves around the vertebral body and transverse process?","o":["The rectus abdominis, external oblique and internal oblique","The psoas, the quadratus lumborum and the erector spinae","The pectoralis major, minor and serratus","The gluteus maximus, medius and minimus","The diaphragm, liver and kidney"],"k":1,"e":"The shamrock is the transverse process and vertebral body with the psoas, the quadratus lumborum and the erector spinae around it. Finding the shamrock helps the operator tell the three muscles apart before placing the needle on the chosen side of the quadratus lumborum."},{"c":11,"id":"11.B27","s":"Ch 11, section 11.5","q":"A transversalis fascia plane block places local anesthetic in which plane?","o":["Between the transversus abdominis muscle and the transversalis fascia","Between the erector spinae muscle and the tip of the transverse process of the vertebra","Between the external oblique and the internal oblique, lateral to the rectus sheath","Between the rectus abdominis and its anterior sheath at the level of the umbilicus","Between the psoas and the quadratus lumborum at the level of the iliac crest"],"k":0,"e":"The transversalis fascia lines the inner surface of the transversus abdominis. The block is a deeper cousin of the midaxillary TAP block and the target lies just deep to the muscle and above the peritoneal fat."},{"c":11,"id":"11.B28","s":"Ch 11, section 11.5","q":"A randomized trial of 68 children having inguinal herniotomy compared transversalis fascia plane block with lateral quadratus lumborum block. Which conclusion is correct?","o":["Transversalis fascia block gave much lower pain scores and far less rescue than quadratus lumborum block","Quadratus lumborum block cut the rescue rate in half and took less time to perform","Both blocks failed in most of the children, so rescue was needed in most","Rescue and pain scores were similar and the transversalis fascia block was quicker, but non-inferiority was not confirmed","Transversalis fascia block was proven non-inferior, with the upper confidence limit inside the margin"],"k":3,"e":"Rescue was needed in 20.5% and 17.6%, pain scores and acetaminophen use did not differ, and the transversalis fascia block took less time (median 3 minutes against 5). Non-inferiority was not confirmed because the upper confidence limit exceeded the margin."},{"c":11,"id":"11.B29","s":"Ch 11, section 11.6","q":"A patient is having laparoscopic cholecystectomy and you plan an erector spinae plane block. At which vertebral levels is the target for upper abdominal surgery?","o":["About C4 to C6, in the cervical spine","About L4 to L5, in the lumbar spine","About S1 to S3","About T7 to T10","About T1 to T2"],"k":3,"e":"For upper abdominal surgery the plane between the erector spinae muscle and the tip of the transverse process is targeted at about T7 to T10. The level is chosen to match the incision and port sites, and the spread of the block is variable."},{"c":11,"id":"11.B30","s":"Ch 11, section 11.6","q":"A meta-analysis of 15 randomized trials in 947 adults having laparoscopic cholecystectomy assessed erector spinae plane block. Which outcomes were improved?","o":["Pain scores were higher at 12 hours and 24-hour opioid use was higher by about 8 mg, with more nausea in the block group","Pain scores, nausea and 24-hour opioid use did not differ from control, and the pooled trials showed no heterogeneity at all","Pain scores were lower at 12 and 24 hours, 24-hour opioid use was lower by about 7.88 mg, and there was less nausea and vomiting","Pain scores were lower only at 24 hours, with no change in opioid use or in nausea and vomiting among the 947 adults","Opioid use was lower by about 30 mg, but pain scores and nausea did not differ from control at any time point"],"k":2,"e":"Pain scores were lower at 12 hours (mean difference 0.81 points) and 24 hours (0.41), 24 hour opioid use was lower by about 7.88 mg, and there was less nausea and vomiting. The pooled data come from small trials with high heterogeneity, so the effect is real but modest."},{"c":11,"id":"11.B31","s":"Ch 11, section 11.6","q":"In pooled trials of erector spinae block against TAP block for laparoscopic cholecystectomy, which additional result was reported?","o":["Pain scores were much higher with the erector spinae block, and morphine use was higher","Pain scores were lower by about half a point, not clinically meaningful, with a modest morphine saving and a later first request","Erector spinae block was no better than no block on any outcome","TAP block was far superior on every outcome, including opioid use","Pain scores differed by more than three points, a large clinical difference"],"k":1,"e":"Pain scores were lower by about half a point, judged not clinically meaningful, morphine use was lower by about 3.5 mg and the first request came about 67 minutes later. Both meta-analyses carry the limits of small trials and high heterogeneity."},{"c":11,"id":"11.B32","s":"Ch 11, section 11.6","q":"A needle for a thoracic level erector spinae block slips past the transverse process. Which complication is most important to exclude?","o":["Pneumothorax","Femoral nerve palsy","Hemidiaphragm paralysis from the phrenic nerve","Kidney laceration","Peritoneal perforation"],"k":0,"e":"At a thoracic level, pneumothorax can occur if the needle moves past the transverse process. The tip should contact the transverse process and a small test volume should lift the erector spinae off the bone."},{"c":11,"id":"11.B33","s":"Ch 11, section 11.7","q":"A 30 year old woman is having a cesarean delivery under spinal anesthesia with intrathecal morphine. A colleague suggests adding bilateral TAP blocks for everyone. What do the pooled data support?","o":["TAP block halves opioid use even when intrathecal morphine is given in the same women","TAP block replaces the need for any other analgesic drug in these women after surgery","TAP added only a small reduction in pain on movement in the first 6 hours","TAP block is harmful in women who have already received intrathecal morphine","TAP block gives better analgesia than intrathecal morphine at 24 hours in these women"],"k":2,"e":"In a meta-analysis of nine trials in 524 women, TAP block reduced opioid use at 6, 12 and 24 hours in women who did not get intrathecal morphine, but gave only a small reduction in pain on movement in the first 6 hours in those who did. The block is therefore best kept for women who cannot have intrathecal morphine or who are at high risk of nausea."},{"c":11,"id":"11.B34","s":"Ch 11, section 11.7","q":"An emergency cesarean delivery under general anesthesia is performed in a woman with severe nausea after opioids. No intrathecal morphine was given. Which choice fits best?","o":["No block, because the incision is too large for any wall block to be useful","Unilateral ilioinguinal block alone, placed on the side of the incision","Bilateral midaxillary TAP block or quadratus lumborum block","Bilateral rectus sheath blocks alone, placed at the level of the umbilicus","Parasternal intercostal plane blocks, placed on both sides of the sternum"],"k":2,"e":"Without intrathecal morphine, a TAP block reduced opioid use at 6, 12 and 24 hours and reduced pain scores for up to 12 hours, so a wall block cuts her opioid need and nausea. It covers the wound and not the deep cramping of the womb."},{"c":11,"id":"11.B35","s":"Ch 11, section 11.7","q":"Which statement compares intrathecal morphine with TAP block for cesarean delivery?","o":["TAP block gave a longer time to first rescue analgesia and more itching than morphine","Intrathecal morphine gave a later first rescue but more side effects, and the block caused less itching and nausea","Both gave identical results on every outcome in every analysis that was reported","Intrathecal morphine caused less itching and less nausea than TAP block did","TAP block was superior to intrathecal morphine in every analysis that was reported"],"k":1,"e":"Intrathecal morphine gave better analgesia at 24 hours than TAP block and a later first rescue (about 8 hours against 4), but caused more opioid side effects. The six trial meta-analysis found less itching and nausea with the block."},{"c":11,"id":"11.B36","s":"Ch 11, section 11.7","q":"A 3 year old is having an umbilical hernia repair. Based on the evidence, which approach is reasonable to consider first?","o":["A transversalis fascia plane block alone, since it is faster to perform than infiltration and covers the wound","Bilateral quadratus lumborum blocks, since they cover the whole abdominal wall","A thoracic epidural, since it gives the most reliable analgesia for any hernia","A parasternal intercostal plane block, since it covers the midline of the wall","Surgical infiltration, since rectus sheath block was not inferior to infiltration but was not better"],"k":4,"e":"The pooled analysis found rectus sheath block not inferior to wound infiltration, so the block earns its place only when it gives more than a surgeon's infiltration can. Consider infiltration first."},{"c":11,"id":"11.B37","s":"Ch 11, section 11.7","q":"A 36 year old man is having extensive lower abdominal surgery. A surgeon asks for wider spread than a wall block can give. Which block fits, and what should you watch for?","o":["A rectus sheath block, watching for pneumothorax and phrenic palsy after the injection has been made","An ilioinguinal block, watching for pneumothorax and phrenic palsy after the injection","A parasternal intercostal plane block, watching for tamponade after the injection has been given","A subcostal TAP block, watching for foot drop and urinary retention after the injection","An anterior or lateral quadratus lumborum block, watching for hypotension and leg weakness"],"k":4,"e":"The quadratus lumborum blocks reach further than a wall block, with spread toward the lower thoracic and lumbar nerves and the paravertebral space. Hypotension from sympathetic spread and leg weakness from lumbar plexus involvement are recognized hazards."},{"c":11,"id":"11.B38","s":"Ch 11, section 11.3","q":"You consider a landmark-based ilioinguinal block for a patient who must be able to walk soon after surgery. What complication is reported from landmark technique?","o":["A permanent sciatic nerve injury in half of the patients","A femoral nerve palsy that resolved within 8 hours in a case report, with an incidence of up to 5% cited, and bowel puncture and pelvic hematoma have also been reported","A pneumothorax in about one in ten blocks","A hemidiaphragmatic paralysis that lasted for days","No complications of any kind have been reported with landmark technique"],"k":1,"e":"Spread of the local anesthetic to the femoral nerve can cause leg weakness. In a case report, a landmark-based block caused femoral nerve palsy that resolved within 8 hours, and the authors cite an incidence of up to 5%. Bowel puncture and pelvic hematoma have been reported with landmark techniques, and ultrasound allowed a large reduction in the volume."},{"c":11,"id":"11.B39","s":"Ch 11, section 11.3","q":"You perform an ilioinguinal block under ultrasound in a child for inguinal surgery. A trial of 40 children tested lower volumes. What did it show?","o":["0.075 mL/kg of levobupivacaine 0.25% was fully effective, and 0.05 mL/kg failed in 4 of 10 children","0.05 mL/kg of levobupivacaine 0.25% was fully effective in every child, and 0.075 mL/kg was no better","0.075 mL/kg failed in most children, and only 0.15 mL/kg of levobupivacaine 0.25% was fully effective","A volume of 0.075 mL/kg was fully effective but only with a nerve stimulator","All volumes failed with ultrasound guidance"],"k":0,"e":"With ultrasound, 0.075 mL/kg was fully effective, and 0.05 mL/kg failed in 4 of 10 children. The ilioinguinal volume in a child can be as low as 0.075 mL/kg with ultrasound. Do not assume that a smaller volume works because ultrasound shows the spread."},{"c":11,"id":"11.B40","s":"Ch 11, section 11.4","q":"A patient scheduled for abdominal surgery with a planned anterior quadratus lumborum block is a walker whose quadriceps strength matters on day one. What did the volunteer trial of the anterior quadratus lumborum block with a large volume show?","o":["Profound quadriceps weakness in all volunteers, lasting for several hours after the injection","Quadriceps weakness that lasted for 48 hours in most volunteers","A motor block of the foot and ankle in half of the volunteers","Quadriceps strength increased compared with placebo","No clinically important quadriceps weakness compared with placebo"],"k":4,"e":"In the volunteer trial, a large-volume anterior quadratus lumborum block did not cause clinically important quadriceps weakness compared with placebo. The anterior quadratus lumborum block lies between the muscle and the psoas. It was a volunteer trial, so a surgical patient may differ."},{"c":12,"id":"Q12.1","s":"Ch 12, section 12.1","q":"A resident asks how low the spinal cord can end in a young adult. In an MRI study of 55 young adults, the lowest level at which the conus medullaris ended was:","o":["The upper third of L3","The middle third of L2","The junction of L3 and L4","The lower third of L4","The upper third of the S1 vertebra"],"k":1,"e":"The conus ranged from the lower third of T12 to the middle third of L2, with the L1-L2 junction the most common level at 25%. A needle placed at L3-4 or below is therefore well below the cord in nearly everyone."},{"c":12,"id":"Q12.2","s":"Ch 12, section 12.1","q":"You are explaining to a trainee why a lumbar needle at L3-4 enters the dural sac but not the cord. In adults the dural sac continues caudally to about:","o":["L5","L2","S2","The tip of the coccyx","The L5-S1 disc"],"k":2,"e":"The cord usually ends between T12 and L2, but the dural sac continues to about S2. A spinal needle placed at L3-4 or below is therefore in the sac and below the cord."},{"c":12,"id":"Q12.3","s":"Ch 12, section 12.1","q":"A 52-year-old man, seated and flexed, has the line between his iliac crests palpated before a spinal. Ultrasound in a study of 114 adults counted the interspace beneath this palpated line. Which level was most often beneath it?","o":["L2-3","L3-4","L4-5","L5-S1","L1-2"],"k":1,"e":"The palpated intercristal line lay over L3-4 in 73%, over L4-5 in 14% and over L2-3 in 13%. A needle placed at the line may therefore be higher than intended."},{"c":12,"id":"Q12.4","s":"Ch 12, section 12.1","q":"You are about to place a spinal in a 188 cm tall man whose body habitus makes the spaces hard to count. Which approach best fits the evidence on the intercristal line?","o":["Enter at the L2-3 space because the line marks L4 in every adult, whatever the body habitus","Assume the line always marks L4-5 and enter at that line without palpating the spinous processes","Enter above the line to reach the sac sooner","Enter at the lowest space you can identify, assuming your count may be a level high","Skip palpation and rely on the depth of the needle alone"],"k":3,"e":"In the ultrasound study the L2-3 group was taller and more often male, so a palpated line can mark a higher level than expected. Entering low and doubting the count is the safe habit."},{"c":12,"id":"Q12.5","s":"Ch 12, section 12.1","q":"A needle passes through skin and subcutaneous fat. Which is the correct order of the next structures it crosses before reaching the subarachnoid space?","o":["Ligamentum flavum, supraspinous ligament, epidural space, dura","Interspinous ligament, dura, epidural space, ligamentum flavum","Supraspinous and interspinous ligaments, ligamentum flavum, epidural space, dura","Epidural space, ligamentum flavum, supraspinous and interspinous ligaments, dura and arachnoid","Supraspinous ligament, dura, ligamentum flavum, epidural space"],"k":2,"e":"From the skin inward the layers are the skin and fat, the supraspinous and interspinous ligaments, the ligamentum flavum, the epidural space, the dura and arachnoid, and then the subarachnoid space."},{"c":12,"id":"Q12.6","s":"Ch 12, section 12.2","q":"An 82-year-old woman with a hip fracture asks whether a spinal anesthetic will lower her risk of postoperative delirium compared with general anesthesia. Based on the large randomized trial in adults 50 or older, you tell her:","o":["Delirium was similar with the two techniques, about 20% in each group","Spinal anesthesia halved the rate of delirium compared with general anesthesia","General anesthesia halved the rate of delirium compared with spinal anesthesia","Spinal anesthesia eliminated delirium during the first postoperative week","Delirium was found only after spinal anesthesia and never after general anesthesia"],"k":0,"e":"Delirium was 20.5% with spinal and 19.7% with general anesthesia. The trial did not argue against spinal anesthesia, but it does not support promising a change in outcome."},{"c":12,"id":"Q12.7","s":"Ch 12, section 12.2","q":"In the large randomized trial of 1,600 older adults having hip fracture surgery comparing spinal with general anesthesia, about what proportion of patients assigned to spinal anesthesia received general anesthesia?","o":["About 1%","About 15%","About 3%","About 40%","About 60% or more"],"k":1,"e":"About 15% of patients assigned to spinal anesthesia were given general anesthesia. Crossover is a practical reminder that the technique chosen is not always the technique delivered."},{"c":12,"id":"Q12.8","s":"Ch 12, section 12.2","q":"A 34-year-old woman with a fear of back pain after an earlier injection declines a spinal before a hernia repair, despite a full explanation. Which statement best describes how you should treat her refusal?","o":["Refusal can be overridden if the surgeon prefers a spinal","Patient refusal is the one contraindication nothing can override","Refusal is a relative contraindication that a second anesthesiologist may override","Refusal is overcome by sedation before the block","Refusal matters only for epidural, not spinal, anesthesia"],"k":1,"e":"Refusal is the only contraindication that nothing overrides. Many refusals come from fear of back pain or paralysis and may change after an honest explanation, but the choice remains hers."},{"c":12,"id":"Q12.9","s":"Ch 12, section 12.2","q":"A man with a bleeding peptic ulcer, a heart rate of 130 and a systolic pressure of 80 mm Hg needs urgent surgery. Why is a spinal not appropriate until his volume is restored?","o":["The block cannot spread in a hypovolemic patient because venous pressure is low","Hypovolemia causes the spinal needle to enter the wrong space in the lumbar spine","The block removes the sympathetic tone that is holding up his pressure","Local anesthetic is absorbed too slowly in hypovolemia","Hypovolemia raises the risk of postdural puncture headache"],"k":2,"e":"Hypovolemia removes the sympathetic tone that holds up the pressure, and a spinal then blocks what remains. A block is reasonable once volume is restored and there is no continuing loss."},{"c":12,"id":"Q12.10","s":"Ch 12, section 12.2","q":"A febrile patient with suspected bacteremia needs surgery for which a neuraxial technique is being considered. What does the infectious complications advisory support?","o":["A firm rule that neuraxial blocks are never allowed in bacteremia, whatever the clinical picture","Weighing antibiotics before the block case by case, accepting that the evidence is insufficient","A firm rule that antibiotics are never needed before a block, because neuraxial infection is so rare","Routine catheter placement to treat the infection","Using a larger needle to reach the space faster and bypass the infected tissue"],"k":1,"e":"The advisory suggests considering antibiotics before the block when a neuraxial technique is chosen in a patient with known or suspected bacteremia. It accepts that the evidence is insufficient and asks for the choice to be made case by case."},{"c":12,"id":"Q12.11","s":"Ch 12, section 12.2","q":"A 76-year-old man with critical aortic stenosis needs lower-limb surgery. Which approach is best?","o":["A rapid single-shot spinal with a large dose to secure a dense block quickly","A high dose single-shot spinal, to be sure of preventing pain throughout the procedure","An epidural bolus of the full dose given at once to speed the onset of the block","Avoid a single-shot spinal; consider a slowly built catheter technique or general anesthesia","Neuraxial blockade is required for all lower-limb surgery in this patient group, whatever the risk"],"k":3,"e":"Fixed cardiac output states tolerate vasodilation badly. A single-shot spinal in these patients is usually the wrong choice, and a slowly developing block with invasive monitoring and vasopressors ready is the alternative."},{"c":12,"id":"Q12.12","s":"Ch 12, section 12.2","q":"A patient with a known intracranial mass and raised intracranial pressure is scheduled for a lumbar puncture. Why is this a contraindication?","o":["The needle cannot pass through the ligamentum flavum when intracranial pressure is high","Local anesthetic is toxic to the brain","A leak of cerebrospinal fluid creates a pressure gradient that can lead to herniation","The dura is too thick to puncture when intracranial pressure is high","Cerebrospinal fluid cannot be seen in the hub when intracranial pressure is raised"],"k":2,"e":"Raised intracranial pressure is a contraindication to lumbar puncture because a leak of cerebrospinal fluid can create a gradient that leads to herniation."},{"c":12,"id":"Q12.13","s":"Ch 12, section 12.2","q":"A patient who speaks no English needs a spinal for a knee arthroscopy. The surgeon proposes general anesthesia to avoid communication problems. What is the right reply?","o":["A language barrier is an absolute contraindication to neuraxial blocks because consent cannot be obtained","A language barrier requires deep sedation instead, so the patient cannot refuse the block","A language barrier requires an epidural, not a spinal, because it allows slower titration","A language barrier is solved by an interpreter and is no reason to choose general anesthesia","A language barrier makes consent unnecessary"],"k":3,"e":"A language barrier is solved by an interpreter and is not itself a reason to choose general anesthesia."},{"c":12,"id":"Q12.14","s":"Ch 12, section 12.2","q":"Which description of skin preparation for a neuraxial block is consistent with the advisory on infectious complications?","o":["Povidone applied and wiped off immediately, with clean gloves and an unsterile drape","Alcohol alone from a shared bottle, applied once and left to dry on the back","Chlorhexidine with alcohol applied, then the drape placed at once while still wet, with a mask and sterile gloves","Chlorhexidine with alcohol from a single-use container, dried, with cap, mask, sterile gloves and drape","Sterile gloves only, since a mask is optional and a cap is needed only for catheters"],"k":3,"e":"The advisory asks for hand hygiene, sterile gloves, a cap, a mask covering the mouth and nose, a sterile drape and removal of jewelry, with an antiseptic such as chlorhexidine in alcohol from a single-use container, allowed to dry."},{"c":12,"id":"Q12.15","s":"Ch 12, section 12.3","q":"A 23-year-old woman is to have a spinal. A colleague asks whether a thin 27 gauge pencil-point needle or a wider 22 gauge pencil-point needle is safer for postdural puncture headache. According to the metaregression, the gauge of a pencil-point needle:","o":["Mattered more than for cutting needles","Reduced headache only when the needle was larger","Increased headache when the needle was larger","Made no difference to the risk of headache","Could not be studied in trials"],"k":3,"e":"Gauge mattered for cutting needles and not for pencil-point needles. The authors concluded that a larger pencil-point needle, which is easier to use, does not raise the risk of headache."},{"c":12,"id":"Q12.16","s":"Ch 12, section 12.3","q":"The pencil-point versus cutting needle meta-analysis included both obstetric and nonobstetric patients. What did it find?","o":["The lower headache risk with pencil-point needles held in both groups","Pencil-point needles helped only obstetric patients, with no benefit elsewhere","Pencil-point needles helped only nonobstetric patients, with no benefit in obstetric patients","Pencil-point needles raised the headache risk in obstetric patients","The groups could not be compared because the trials differed too much"],"k":0,"e":"The result held in obstetric and nonobstetric patients, with a risk ratio of 0.41 and low heterogeneity across 57 trials."},{"c":12,"id":"Q12.17","s":"Ch 12, section 12.3","q":"A 45-year-old man is booked for a 30-minute ambulatory arthroscopy and wants to leave as soon as possible. Which additive should you not mix with spinal 2-chloroprocaine?","o":["Nothing; epinephrine is routinely added","Bupivacaine","Sodium bicarbonate buffered with saline","Preservative-free saline","Epinephrine"],"k":4,"e":"Epinephrine should not be used with spinal 2-chloroprocaine because it caused flu-like symptoms in volunteers. Only the preservative-free formulation belongs in the subarachnoid space."},{"c":12,"id":"Q12.18","s":"Ch 12, section 12.3","q":"Why are old reports of neurotoxicity not an argument against preservative-free spinal 2-chloroprocaine?","o":["They came from spinal doses given too slowly, over many minutes at the bedside","They came from intrathecal injection of a bisulfite-containing epidural preparation","They came from using the drug in children only, because of the larger dose per kilogram","They were never reported in humans and are known only from animal experiments","They were caused by adding bupivacaine to the chloroprocaine solution"],"k":1,"e":"The older neurotoxicity reports followed accidental intrathecal injection of an epidural preparation containing bisulfite, which is why only the preservative-free formulation belongs in the subarachnoid space."},{"c":12,"id":"Q12.19","s":"Ch 12, section 12.3","q":"A review compared spinal 2-chloroprocaine with lidocaine and bupivacaine for ambulatory surgery. What did it conclude about recovery?","o":["Chloroprocaine delayed discharge by about an hour compared with the other drugs","Recovery was identical for all three drugs in every measured outcome","Chloroprocaine gave a longer motor block than the other two local anesthetics","Chloroprocaine required an indwelling catheter for recovery to occur","Block regression, voiding and discharge were faster with chloroprocaine"],"k":4,"e":"The review found faster regression of block, voiding and discharge with chloroprocaine than with lidocaine or bupivacaine, and no cases of transient neurologic symptoms in the main chart reviews. Adequacy for a 40-minute operation was not settled."},{"c":12,"id":"Q12.20","s":"Ch 12, section 12.3","q":"In the dose-ranging study of 42 women having elective cesarean delivery under combined spinal-epidural anesthesia, the dose that worked in 95% of women was:","o":["At the lowest dose tested","Close to the top of the range of doses tested","Below the range tested, at the limit of detection","Unrelated to the dose given within the range tested","Equal to the dose used for sacral surgery alone"],"k":1,"e":"The dose that worked in 95% of women was close to the top of the range tested. The study could not show a clear advantage of lower doses for hypotension, nausea or satisfaction and was underpowered for those outcomes."},{"c":12,"id":"Q12.21","s":"Ch 12, section 12.4","q":"An anesthesiologist asks why many practitioners choose saline over air for loss of resistance, or the reverse. The Cochrane review of 7 studies with 852 participants concluded that:","o":["Evidence was of low quality and showed no clear difference between them","Air caused far more headaches than saline in all of the reviewed trials","Saline caused far more unblocked segments than air in the trials","Saline was clearly superior in every outcome that the trials measured","Air was clearly superior in every outcome that the trials measured"],"k":0,"e":"The review found no significant difference in headache, accidental subarachnoid catheter placement, unblocked segments or failure to locate the space, and graded the evidence as low quality. Choice should rest on training."},{"c":12,"id":"Q12.22","s":"Ch 12, section 12.4","q":"You are using saline for loss of resistance and fluid drips from the Tuohy needle. What caution applies?","o":["Saline always means that the dura has been punctured by the needle","Saline cannot be mistaken for anything else when it returns through the needle","Fluid returning through the needle can be mistaken for cerebrospinal fluid","Saline should be replaced by contrast before the catheter is threaded in","Saline makes the epidural catheter unusable once the space has been entered"],"k":2,"e":"If you use saline, remember that fluid returning through the needle can be mistaken for cerebrospinal fluid. If you use air, use small volumes."},{"c":12,"id":"Q12.23","s":"Ch 12, section 12.5","q":"In a combined spinal-epidural using the needle-through-needle technique, which sequence is correct?","o":["Give the spinal dose first, then locate the epidural space with a second needle and thread the catheter","Thread the catheter first, then pass the spinal needle alongside the catheter into the subarachnoid space and inject","Remove the Tuohy needle before giving the spinal dose, then thread the catheter through the spinal needle","Give the epidural dose before the spinal dose, then pass the spinal needle through the Tuohy","Locate the epidural space, pass the spinal needle through the Tuohy, give the spinal dose, thread the catheter"],"k":4,"e":"The Tuohy needle is placed in the epidural space, a longer pencil-point spinal needle is passed through it into the subarachnoid space, the spinal dose is given, the spinal needle is removed, and the catheter is threaded."},{"c":12,"id":"Q12.24","s":"Ch 12, section 12.5","q":"Why should the epidural catheter in a combined spinal-epidural not be tested until the spinal block has settled?","o":["The catheter is sterile only after the block settles and the drapes are removed","Local anesthetic is inactive during the spinal block, so the epidural dose is delayed","The spinal block prevents loss of resistance from being felt when the epidural needle is advanced into the space","Testing is dangerous during a spinal because the dose can then reach the brain","The usual test of the catheter is unreliable while the spinal works, so a misplaced catheter may not show itself"],"k":4,"e":"The catheter may be intrathecal or intravenous without showing it until epidural drug is injected, and a test is not possible while the spinal block is working."},{"c":12,"id":"Q12.25","s":"Ch 12, section 12.5","q":"A Cochrane review of 27 trials compared combined spinal-epidural analgesia with a traditional epidural for labor. Compared with a traditional epidural, the combined technique:","o":["Gave analgesia 30 minutes sooner","Increased instrumental delivery rates without any change in analgesia onset time","Prevented all post-dural puncture headaches in the women studied","Was worse for rescue analgesia and gave a slower onset of effect","Gave effective analgesia about 3 minutes sooner with less rescue analgesia"],"k":4,"e":"Against a traditional epidural, the combined technique gave effective analgesia about 2.9 minutes sooner, with a relative risk of 0.31 for rescue analgesia and 0.81 for instrumental delivery. Against a low-dose epidural there was little difference."},{"c":12,"id":"Q12.26","s":"Ch 12, section 12.5","q":"A laboring woman asks whether combined spinal-epidural analgesia has any disadvantage compared with a low-dose epidural. What do the trials show?","o":["More pruritus, with no clear gain in satisfaction or delivery outcomes","More cesarean births, with no change in analgesia or satisfaction scores","More headaches in every trial, with a higher rate of blood patches","Less analgesia at all time points, with a higher rate of rescue doses","A higher rate of meningitis, with a longer stay in the labor ward"],"k":0,"e":"Against a low-dose epidural, satisfaction, rescue analgesia, instrumental delivery, cesarean birth and headache were not different, and pruritus was more frequent with the combined technique (relative risk 1.80, high heterogeneity)."},{"c":12,"id":"Q12.27","s":"Ch 12, section 12.6","q":"Following a spinal, a patient's sensory block is at T6. Compared with the sensory level, the sympathetic block can extend up to about how many levels higher?","o":["Six levels","One level","Two levels","Eight levels above the head","It never extends above the sensory level"],"k":0,"e":"Sympathetic fibers are blocked first and highest, and the sympathetic block can extend up to about six levels above the sensory block. The autonomic effects are wider than the level you test."},{"c":12,"id":"Q12.28","s":"Ch 12, section 12.6","q":"A 38-year-old, otherwise fit, develops a sudden fall in heart rate and pressure during a spinal and then arrests. Which description best fits the mechanism proposed in the review of arrests during spinal anesthesia?","o":["Direct toxicity of the local anesthetic on the heart after absorption into the circulation","Pulmonary embolism from the needle dislodging a clot in the epidural veins","Phrenic nerve palsy from spread of local anesthetic to the cervical roots","A fall in venous return triggers a vagal slowing that can progress to arrest","Blocking of the cardioaccelerator fibers alone, with no change in venous return"],"k":3,"e":"The proposed chain is a fall in venous return followed by a vagal slowing of the heart. Risk factors are strong vagal tone, a block above T6 and rapid blood loss or fluid shifts."},{"c":12,"id":"Q12.29","s":"Ch 12, section 12.6","q":"A patient develops profound bradycardia under spinal anesthesia. Following the stepwise treatment in the review, the first drug is:","o":["Atropine","Epinephrine","Naloxone","Neostigmine","Lipid emulsion"],"k":0,"e":"Treatment is stepwise: atropine, then ephedrine, then epinephrine, with early leg elevation and fluid, and full resuscitation for arrest."},{"c":12,"id":"Q12.30","s":"Ch 12, section 12.6","q":"For spinal anesthesia in cesarean delivery, which statement about vasopressors is supported by the review?","o":["Ephedrine is preferred because it does not cross the placenta and so spares the fetus from any acidosis","Starting a prophylactic vasopressor infusion at the spinal reduces hypotension more than boluses alone","Phrenic nerve block is the main cause of hypotension after a spinal block in pregnancy","Infusions are never used because the fetus cannot tolerate steady vasopressor exposure","Vasopressors worsen neonatal acidosis in every case, whatever agent or regimen is used"],"k":1,"e":"A prophylactic infusion started at the time of the spinal lowers hypotension more effectively than boluses alone. Ephedrine crosses the placenta more readily, and phenylephrine can cause bradycardia and lower cardiac output."},{"c":12,"id":"Q12.31","s":"Ch 12, section 12.6","q":"A heart transplant recipient develops hypotension during a cesarean under spinal anesthesia, and ephedrine has no effect. What is the explanation?","o":["Indirect-acting agents such as ephedrine are ineffective after transplant, so a direct-acting agent is needed","The transplanted heart is rejected by the block, so cardiac output falls and drugs cannot restore the pressure","Ephedrine always fails after spinal anesthesia in every patient, so phenylephrine is used instead","Phenylephrine is contraindicated after transplant because the denervated heart cannot slow down","The block has reached the brainstem, which is why no vasopressor can raise the blood pressure"],"k":0,"e":"In heart transplant recipients, indirect-acting agents such as ephedrine are ineffective and a direct-acting agent should be ready."},{"c":12,"id":"Q12.32","s":"Ch 12, section 12.7","q":"In nonpregnant adults, an epinephrine test dose is considered positive when heart rate rises by at least:","o":["2 beats per minute","40 beats per minute","60 beats per minute","It cannot be detected by heart rate","10 beats per minute"],"k":4,"e":"A rise in heart rate of at least 10 beats a minute, or in systolic pressure of at least 15 mm Hg, after a small dose of epinephrine was the criterion, with sensitivity about 93% to 100% in nonpregnant adults."},{"c":12,"id":"Q12.33","s":"Ch 12, section 12.7","q":"A 72-year-old patient on a beta blocker is given an epidural test dose with epinephrine, and the heart rate does not change. Which interpretation is best?","o":["The catheter is certainly not intravenous if the test dose is negative","The catheter is certainly intravenous if the heart rate rises at all","The test dose is always unreliable in the elderly and should therefore be skipped altogether","Epinephrine always raises heart rate regardless of the drugs the patient takes","Beta blockade and age blunt the response, so a negative test is less reassuring"],"k":4,"e":"Beta blockade, advanced age, sedatives, opioids and some volatile anesthetics blunt the heart rate response, so a negative epinephrine test is less reassuring in such patients."},{"c":12,"id":"Q12.34","s":"Ch 12, section 12.7","q":"The review of epidural test doses found that detection of intrathecal misplacement was:","o":["Better than detection of intravenous placement, according to the randomized trials in the review","Perfectly reliable with lidocaine at the usual test doses in all patients","Weaker than for intravenous placement, with no randomized trial meeting the review's criteria","Not needed because intrathecal catheters are always obvious on aspiration and testing","Established by many large trials, all showing the same level of reliability"],"k":2,"e":"No randomized trial met the review's criteria for detecting intrathecal misplacement, and the classic lidocaine test may miss subdural placement."},{"c":12,"id":"Q12.35","s":"Ch 12, section 12.7","q":"In labor, undetected intravenous catheter placement was estimated at 2.3% with single-orifice catheters. What was the estimate for multi-orifice catheters?","o":["0.01%","5%","12%","0.6%","It was the same"],"k":3,"e":"Undetected intravenous placement was estimated at 2.3% with single-orifice catheters and 0.6% with multi-orifice catheters."},{"c":12,"id":"Q12.36","s":"Ch 12, section 12.7","q":"An older study argued that a safer approach to epidural dosing in obstetrics is to:","o":["Give the full dose as a single test dose, then wait ten minutes before proceeding","Skip aspiration and rely on the test dose alone to exclude intravenous placement","Fractionate the dose into small portions, each serving as its own test","Give the dose rapidly to ensure wide spread of block","Use a test dose only in nonpregnant adults, since pregnancy makes it unreliable"],"k":2,"e":"The study argued that fractionating the dose into small portions was safer than a single test dose and that no controlled study had shown that test doses reduce complications."},{"c":12,"id":"Q12.37","s":"Ch 12, section 12.6","q":"Which statement about the effect of neuraxial blockade on the respiratory system is supported by the evidence?","o":["Block of abdominal and intercostal muscles weakens expiration and cough; phrenic involvement needs a block reaching C3 to C5","Neuraxial blocks always cause phrenic palsy, because local anesthetic spreads up to the cervical roots","Neuraxial blocks increase vital capacity, because relaxed muscles allow deeper breaths in every patient","Respiratory effects occur only with neuraxial opioids, never with local anesthetic alone at any level","Lumbar epidurals commonly paralyze the diaphragm, because the phrenic nerve arises at the lumbar roots"],"k":0,"e":"Block of abdominal and intercostal muscles reduces expiratory force and cough. A block reaching C3 to C5 can impair the phrenic nerve, but this is rare with thoracic or lumbar epidurals."},{"c":12,"id":"Q12.38","s":"Ch 12, section 12.4","q":"A woman has a one-sided epidural block 30 minutes after the catheter was placed, and you suspect the catheter was threaded too far. What is the usual response?","o":["Advance the catheter a further 2 cm, give a bolus with the patient lying on the blocked side, and wait an hour","Withdraw the catheter 1 to 2 cm, give a bolus with the patient on the unblocked side, and replace it if that fails","Withdraw the catheter 1 to 2 cm, and give the next bolus with the patient lying on the blocked side and the head down","Leave the catheter where it is, and change the concentration of the local anesthetic","Replace the catheter at once without a trial of withdrawal, since it cannot be repositioned"],"k":1,"e":"Many unilateral or patchy epidural blocks come from a catheter threaded too far, which ends up beside the nerve root on one side or out of a foramen. The usual response is to withdraw the catheter 1 to 2 cm, add a bolus with the patient lying on the unblocked side, and replace the catheter if that fails."},{"c":12,"id":"Q12.39","s":"Ch 12, section 12.7","q":"You are about to test an epidural catheter in a woman in active labor, and you plan to rely on an epinephrine test dose to detect intravenous placement. What is the limitation?","o":["The test dose detects intravenous placement poorly in nonpregnant adults and well in women in labor","The test dose is perfectly reliable in every patient","The test dose detects intravenous placement well in nonpregnant adults and poorly in women in labor","The test dose only detects subarachnoid placement","The test dose is unreliable in the elderly and reliable in pregnancy"],"k":2,"e":"An epinephrine test dose works in nonpregnant adults and is unreliable in labor. A test dose exists to catch a catheter that has entered a vein or the subarachnoid space, and it catches the first better than the second."},{"c":13,"id":"Q13.1","s":"Ch 13, section 13.1","q":"You are teaching a trainee caudal block in a 4-year-old. Between which landmarks does the needle pass to reach the epidural space of the sacral canal?","o":["Between the two posterior superior iliac spines, through the sacroiliac joints","Through the coccyx itself, at the tip of the bone","Between the sacral foramina on one side, through the posterior sacral wall","Above the sacral promontory, through the anterior sacral wall","Between the two sacral cornua, through the sacrococcygeal ligament above the coccyx"],"k":4,"e":"The sacral hiatus lies between the two sacral cornua, covered by the sacrococcygeal ligament above the coccyx. A needle through the ligament lands in the epidural space of the sacral canal."},{"c":13,"id":"Q13.2","s":"Ch 13, section 13.1","q":"In the randomized trial of ultrasound-guided versus conventional caudal block in about 106 children, what was the advantage of ultrasound?","o":["A shorter time to perform the block, because the sacral hiatus is seen directly","A higher overall block success, because the needle is placed under direct vision in every case","A block that spread to the thoracic level in most of the children studied","Fewer skin punctures and higher first-puncture success, with no difference in overall success","Elimination of vascular puncture, since the vessels are visible on the scan"],"k":3,"e":"Skin punctures were fewer with ultrasound (1.09 against 1.45), and overall block success was similar (98.1% against 100%). Ultrasound took longer. The advantage is fewer needle passes, not a better block."},{"c":13,"id":"Q13.3","s":"Ch 13, section 13.1","q":"A colleague plans a caudal block in a 3-year-old and expects a large volume of ropivacaine to give a mid-thoracic level. What does the ultrasound spread literature suggest?","o":["It reliably reaches T4 at larger volumes","It reaches only the sacral canal, whatever volume is injected into it","Spread is the same at low volumes as at higher volumes","Even the largest volume studied rarely went above the thoracolumbar level","Spread cannot be measured with contrast or ultrasound"],"k":3,"e":"In ultrasound studies of ropivacaine at three increasing volumes, the median spread was lumbar, the largest volume spread further than the smallest, but even the largest rarely went above the thoracolumbar level."},{"c":13,"id":"Q13.4","s":"Ch 13, section 13.1","q":"After a caudal injection in a child, a bulge appears over the sacrum and the block fails. The most likely explanation is:","o":["A subcutaneous injection","A successful epidural injection","An intrathecal injection","An intraosseous block with excellent spread","A phrenic block"],"k":0,"e":"Subcutaneous injection that looks like a failed block is a listed pitfall. Ultrasound can show the bulge or a missing cornua, and the needle should be repositioned."},{"c":13,"id":"Q13.5","s":"Ch 13, section 13.2","q":"A 62-year-old man has a thoracic epidural for postoperative analgesia after a bowel resection. In a series of 3,126 patients, accidental dural puncture occurred in about:","o":["0.01%","10%","25%","1.8%","50%"],"k":3,"e":"Accidental dural puncture occurred in 58 of 3,126 patients (1.8%), hypotension in 4.8% and postdural puncture headache in 0.5%. One patient had an epidural abscess with permanent sequelae."},{"c":13,"id":"Q13.6","s":"Ch 13, section 13.2","q":"In the same series, what proportion of patients stopped their thoracic epidural early because of complications?","o":["0.45%","7.4%","2%","20%","40%"],"k":1,"e":"231 patients (7.4%) stopped early because of complications, and about 18% had at least one episode of inadequate pain control. The series recorded no epidural hematoma."},{"c":13,"id":"Q13.7","s":"Ch 13, section 13.2","q":"In a study of 166 patients having a paramedian thoracic epidural, the average depth at which resistance was lost, and its range, were:","o":["1.5 cm, ranging from 1 to 2 cm","3.0 cm, ranging from 2 to 4 cm","9.5 cm, ranging from 8 to 12 cm","The depth was identical in every patient","6.1 cm, ranging from 3.5 to 8 cm"],"k":4,"e":"The most common level was T8 to T9 (28%), and the loss-of-resistance depth averaged 6.1 cm with a range of 3.5 to 8 cm. A chart cannot replace the scan and the feel."},{"c":13,"id":"Q13.8","s":"Ch 13, section 13.2","q":"A patient has a BMI above 35 and a preexisting CT scan. According to the thoracic epidural depth study, what does the CT distance give the operator?","o":["An exact prediction of the catheter length, independent of body habitus or sex","No information about depth; the distance must be measured at the bedside only","A guarantee of a successful block in obese patients if the scan was done","A rough prediction of the depth at which resistance is lost, shallower in patients with BMI above 35","A prediction of the risk of hematoma"],"k":3,"e":"The distance from skin to epidural space on a CT scan predicted the loss-of-resistance depth, and the depth was shallower for the same CT distance when the BMI was above 35. The practical use is a modest warning that this is a deep spine."},{"c":13,"id":"Q13.9","s":"Ch 13, section 13.2","q":"A surgeon plans a right-sided thoracotomy in a patient with a borderline coagulation profile. A meta-analysis of 14 trials compared paravertebral block with thoracic epidural. Which finding supports choosing a paravertebral block?","o":["Better pain relief at every time point, in all of the trials, with fewer side effects","More hypotension but less cost, with no difference in pain relief","Comparable pain relief with less minor hypotension and less urinary retention","Fewer pulmonary complications by a large margin, with no change in pain","Higher success for bilateral surgery, with less need for catheters"],"k":2,"e":"Pain relief was comparable at all time points, with relative risks of 0.16 for minor hypotension and 0.22 for urinary retention after paravertebral block. Pulmonary complications were not clearly different, and the evidence was at moderate to high risk of bias."},{"c":13,"id":"Q13.10","s":"Ch 13, section 13.3","q":"A pain physician plans an interlaminar cervical epidural steroid injection. At which level is the posterior epidural space largest, making it the usual entry?","o":["C1 to C2","C2 to C3","C7 to T1","C3 to C4","T6 to T7 or lower"],"k":2,"e":"The interlaminar epidural space is entered most often at C7 to T1 because the posterior epidural space is largest there. A cryomicrotome study found no posterior epidural space above C7 to T1."},{"c":13,"id":"Q13.11","s":"Ch 13, section 13.3","q":"During a cervical epidural under fluoroscopy, the operator injects contrast and sees a venous pattern. What should be done?","o":["Inject the steroid at once","Reposition the needle","Give twice the volume of steroid","Continue because venous spread is expected","Abandon fluoroscopy and inject blindly"],"k":1,"e":"A venous pattern means reposition, and an arterial or myelographic pattern means stop. Loss of resistance may be absent even when the needle is in the epidural space, so it is not a reliable sole endpoint."},{"c":13,"id":"Q13.12","s":"Ch 13, section 13.3","q":"Why is a cervical epidural not recommended in a heavily sedated or anesthetized patient?","o":["Cord puncture can be painless; the patient who can report pain is the safety device, and sedation removes it","Sedation prevents local anesthetic from working at the dorsal root ganglia","Sedation makes the epidural space smaller and the ligamentum flavum thinner","The epidural space is absent in sedated patients because the dura collapses","Sedatives cause hematoma by interfering with platelet function in the epidural veins"],"k":0,"e":"Cord puncture can be painless, and cases of cord injury and tetraplegia have been reported, particularly in sedated patients. The patient who can say that it hurts is the safety device."},{"c":13,"id":"Q13.13","s":"Ch 13, section 13.4","q":"A systematic review of 32 trials with 3,439 adults compared preprocedural lumbar ultrasound with landmark technique. The relative risk of first-attempt success with ultrasound was about:","o":["1.5","0.5","1.0","4.0 or more","10"],"k":0,"e":"First-attempt success was higher with ultrasound (relative risk 1.5, number needed to treat 5), and needle redirections were fewer. The review rated overall quality of most outcomes as low or very low."},{"c":13,"id":"Q13.14","s":"Ch 13, section 13.4","q":"In the same review, which subgroup benefited the most from preprocedural ultrasound?","o":["Thin patients with easy landmarks and a palpable spinous process","Children only","Obese patients and patients with a difficult spine","Patients having caudal block","Patients who had a spinal for cesarean delivery only"],"k":2,"e":"The effect was larger in obese patients and those with a difficult spine (relative risk 1.84, number needed to treat 3)."},{"c":13,"id":"Q13.15","s":"Ch 13, section 13.4","q":"A department introduces preprocedural neuraxial ultrasound. Which advice is consistent with current guidance?","o":["Stop using loss of resistance because the scan replaces it entirely, in thin and obese patients alike","Learn the sawtooth pattern and midline on easy backs first, and keep loss-of-resistance checks","Use the scan only in thin patients, since in obese patients it is not helpful","Skip training because the images are simple and the pattern is easy to read","Use real-time guidance for all patients, with the probe held beside the needle"],"k":1,"e":"The scan helps the first pass and does not remove the need for loss-of-resistance or aspiration checks, and it has no value if the operator cannot interpret it."},{"c":13,"id":"Q13.16","s":"Ch 13, section 13.5","q":"A multisociety consensus on postdural puncture headache listed 46 recommendations in 10 areas. How is the evidence behind most of them characterized?","o":["All rested on high-grade randomized trials of consistent quality","Most rested on low-grade evidence, and the authors called for better trials","None had any supporting evidence of any kind from published studies","They rested on a single large trial from one center with a long follow-up","They were written without any formal evidence review or search of the literature"],"k":1,"e":"The authors called for better trials because most recommendations rest on low-grade evidence."},{"c":13,"id":"Q13.17","s":"Ch 13, section 13.5","q":"The Cochrane review of epidural blood patching included 9 studies with 379 participants. What did it find about a prophylactic patch?","o":["It eliminated headache in all patients and was recommended for routine use after dural puncture","It was worse than no treatment and was associated with more headache at one week","It reduced headache compared with no treatment but not compared with sham, and too few participants to recommend it","It was proven better than a sham procedure in several large randomized trials","It caused no backache and no new neurological symptoms in any of the participants"],"k":2,"e":"A prophylactic patch reduced headache compared with no treatment, with conservative care and with a saline patch, but not compared with a sham procedure. The authors found too few participants to recommend it, and backache was more common after a patch."},{"c":13,"id":"Q13.18","s":"Ch 13, section 13.6","q":"The Third National Audit Project estimated permanent injury after central neuraxial block at:","o":["Between 2 and 4 per 1,000 procedures in the census","Between 20 and 42 per 100,000 procedures","Between 0.2 and 0.4 per 100,000 procedures","Between 2.0 and 4.2 per 100,000 procedures","None in the census"],"k":3,"e":"The audit counted about 707,000 procedures and estimated permanent injury at 4.2 per 100,000 on a pessimistic reading and 2.0 on an optimistic one."},{"c":13,"id":"Q13.19","s":"Ch 13, section 13.6","q":"Which group had the highest estimated risk of permanent harm in the national audit?","o":["Obstetric blocks","Caudal blocks","Spinal anesthesia in labor and delivery","All obstetric epidurals","Adult perioperative epidurals"],"k":4,"e":"Adult perioperative epidurals had the highest estimate (17.4 per 100,000 pessimistic, 8.2 optimistic), compared with 1.2 and 0.3 for obstetric blocks overall."},{"c":13,"id":"Q13.20","s":"Ch 13, section 13.6","q":"In the national audit, what proportion of initially disabling injuries recovered fully?","o":["One tenth","One quarter","Two thirds","About one half","Nearly all of them with no exception"],"k":2,"e":"Two thirds of initially disabling injuries recovered fully. Of 41 patients with a serious initial injury, 25 (61%) had a major or near-complete recovery at 6 months."},{"c":13,"id":"Q13.21","s":"Ch 13, section 13.6","q":"Which complication was reported most often among the specific complications counted in the national audit?","o":["Vertebral canal hematoma (8)","Meningitis (6)","Spinal cord ischemia (6)","Wrong-route errors (50 reported)","Epidural abscess (20 reported)"],"k":4,"e":"The reported counts were vertebral canal hematoma 8, epidural abscess 20, meningitis 6, spinal cord ischemia 6, nerve injury 18 and wrong-route errors 11."},{"c":13,"id":"Q13.22","s":"Ch 13, section 13.6","q":"A patient two days after surgery with a thoracic epidural reports new severe back pain and a block that has not worn off. What is the correct first set of actions?","o":["Stop the infusion, examine the legs and obtain urgent imaging and surgical review","Increase the infusion rate for analgesia and reassess the legs in the morning","Wait several hours to see if the block regresses before deciding on imaging","Treat with an oral analgesic and reassess in the morning if the legs improve","Remove the catheter and discharge the patient with a warning leaflet"],"k":0,"e":"Early signs include new or severe back pain, a denser block than expected or one that does not wear off, new leg weakness, and bladder or bowel dysfunction. The response is to stop the infusion, examine the legs and obtain urgent imaging and surgical review."},{"c":13,"id":"Q13.23","s":"Ch 13, section 13.7","q":"A patient has buttock and leg pain beginning the day after a spinal anesthetic, with no motor or sensory deficit. Which spinal drug is most associated with this?","o":["Bupivacaine","Prilocaine","Lidocaine","Procaine","Levobupivacaine"],"k":2,"e":"Transient neurologic symptoms are far more likely after spinal lidocaine than after bupivacaine, prilocaine or procaine. They resolve in days."},{"c":13,"id":"Q13.24","s":"Ch 13, section 13.7","q":"The Cochrane network meta-analysis found that bupivacaine, compared with lidocaine, produced a relative risk of transient neurologic symptoms of about:","o":["0.16","1.0","2.0","6.0","16 or more"],"k":0,"e":"Bupivacaine probably reduced the risk compared with lidocaine (relative risk 0.16, moderate certainty). Prilocaine (0.18) and procaine (0.14) also probably reduced the risk."},{"c":13,"id":"Q13.25","s":"Ch 13, section 13.7","q":"In the same network meta-analysis, how did mepivacaine compare with lidocaine for transient neurologic symptoms?","o":["No clear difference, with very low certainty","Much safer than other approaches, with high certainty","Much worse than other approaches, with high certainty","Absolutely no symptoms","It was not studied at all"],"k":0,"e":"Mepivacaine showed no clear difference from lidocaine, with very low certainty, while levobupivacaine, ropivacaine and 2-chloroprocaine may reduce the risk with low-certainty evidence."},{"c":13,"id":"Q13.26","s":"Ch 13, section 13.8","q":"A patient receives a single intrathecal injection of morphine for postoperative analgesia. According to the ASA and ASRA recommendations, monitoring should continue for at least:","o":["2 hours, checked once at the end of the infusion and then stopped","24 hours, hourly for the first 12 hours and every 2 hours from 12 to 24 hours","6 hours, checked every 3 hours and then at the discretion of the nurse","24 hours, checked once at the end by the surgeon without a set interval","48 hours, checked every 12 hours by the ward team, with hourly checks only if the patient complains"],"k":1,"e":"For a single injection of a hydrophilic opioid, monitoring is for at least 24 hours, with a check at least hourly for the first 12 hours and at least every 2 hours from 12 to 24 hours."},{"c":13,"id":"Q13.27","s":"Ch 13, section 13.8","q":"A patient has a continuous epidural infusion containing a hydrophilic opioid. How long should monitoring continue?","o":["Only the first 6 hours, since most complications declare themselves early","The whole time the infusion runs, with checks at least every 4 hours after the first 24 hours","Only while the patient is in recovery, since the ward cannot monitor neuraxial infusions safely","Only at night, when the patient is asleep and cannot report symptoms","Until the first mobilization of the patient, when the legs have regained power"],"k":1,"e":"For a continuous infusion or patient-controlled epidural analgesia with a hydrophilic opioid, monitoring continues for the whole time the infusion is running, on the same schedule for the first 24 hours and at least every 4 hours after that."},{"c":13,"id":"Q13.28","s":"Ch 13, section 13.8","q":"The ASA and ASRA guideline advises against which practice?","o":["Neuraxial bupivacaine","Neuraxial opioids in any inpatient, given as a single injection","Spinal anesthesia for cesarean","Epidural catheters after surgery","Neuraxial morphine or hydromorphone for outpatient surgery"],"k":4,"e":"The guidelines advise against neuraxial morphine or hydromorphone for outpatient surgery. They state that the evidence is insufficient to set an optimal interval and that recommendations rest on expert consensus."},{"c":13,"id":"Q13.29","s":"Ch 13, section 13.8","q":"A woman with suspected obstructive sleep apnea and obesity had intrathecal morphine for a cesarean. What does the obstetric consensus statement advise?","o":["No monitoring is ever needed after a single neuraxial dose","Routine monitoring is the same for everyone, whatever the risk factors","Neuraxial morphine is contraindicated for all women having a cesarean birth","Individual judgment, with extra monitoring for patients with risk factors","Extra monitoring beyond 12 hours is mandatory for everyone"],"k":3,"e":"The obstetric consensus ties monitoring to dose, notes no reported respiratory depression beyond 12 hours at obstetric doses without confounders, and advises individual judgment for patients with obesity, suspected sleep apnea, chronic opioid use or other risk factors."},{"c":13,"id":"Q13.30","s":"Ch 13, section 13.1","q":"Before you do a caudal block in a child, which two dangers sit beside the target?","o":["The dural sac ends low in a child, at about S3 or lower, and the epidural veins run in the canal","The spinal cord end
