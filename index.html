s at L5 in a child, and the pleura lies beside the canal, so use a long needle and a rapid injection","The dural sac ends at L1 in a child, and the sciatic nerve lies in the canal, so use a long needle and a rapid injection","The conus medullaris ends at S5, and the aorta runs in the canal, so use a short needle and a rapid injection","The dural sac ends at S1 in a child, and the epidural veins are empty, so use a long needle and a slow injection"],"k":0,"e":"A needle through the sacrococcygeal ligament lands in the epidural space of the sacral canal. Two dangers sit beside the target: the dural sac ends low in a child, at about S3 or lower, and the epidural veins run in the canal. Both are reasons why this block is done with a short needle and a slow injection."},{"c":13,"id":"Q13.31","s":"Ch 13, section 13.6","q":"A very elderly patient has a continuous spinal anesthetic with bupivacaine, and the block stays dense and low in the sacral region after the end of the operation. Which finding from the study of 80 elderly patients receiving continuous spinal bupivacaine bears on this?","o":["Maldistribution occurred in 70 of the 80 patients, and the main factor was a catheter tip pointing cranially","Maldistribution never occurred, and the block that stays low and dense is always a normal finding","Maldistribution occurred in 10 of the 80 patients, and the main factor was a catheter tip pointing caudally, so use the smallest dose that works and be wary of a block that stays low and dense","Maldistribution occurred in 10 of the 80 patients, and the main factor was a dilute solution","Maldistribution occurred in 1 of the 80 patients, and the main factor was the patient's age"],"k":2,"e":"Cauda equina syndrome after spinal anesthesia was associated in older reports with continuous spinal catheters and concentrated local anesthetic pooling in the sacral region. In the study of 80 patients, maldistribution was found in 10, and the main factor was a catheter tip pointing caudally. The lesson is to use the smallest dose that works and to be wary of a block that stays low and dense."},{"c":13,"id":"Q13.32","s":"Ch 13, section 13.5","q":"You are about to perform an epidural blood patch for a persistent postdural puncture headache. Which statement from the guideline summary is correct?","o":["Use 5 mL of blood injected quickly, and give a course of antibiotics before the patch","Use up to 60 mL of blood, and a low platelet count is not a contraindication","Use 15 to 20 mL of blood, and give prophylactic antibiotics because infection is common after a patch","Use 15 to 20 mL of blood, no more than 30 mL, injected slowly with aseptic technique; antithrombotic use and a low platelet count are contraindications, and antibiotics are not recommended","Use 15 to 20 mL of saline in place of blood, injected slowly with aseptic technique"],"k":3,"e":"For the blood patch itself, the guideline summary advises 15 to 20 mL of blood, not more than 30 mL, injected slowly with aseptic technique. It lists antithrombotic use and a low platelet count as contraindications, with antibiotics not recommended. Follow-up after any dural puncture, with clear instructions on whom to contact, is part of the standard of care."},{"c":14,"id":"Q14.1","s":"Ch 14, section 14.1","q":"A 70-year-old woman is having a total knee replacement and will have severe pain for two to three days. Which feature of the pooled evidence best supports choosing a catheter over a single injection?","o":["Proven lower cost, including pump and nursing time for home catheters","Fewer complications of every kind, including infection, nerve injury and catheter failure","Proven better long-term function, measured at six months and at one year after surgery","Lower worst pain on days 0 to 2, less opioid use, less nausea and higher satisfaction","Shorter operating time and a faster turnover of the operating room"],"k":3,"e":"Pooled trials of continuous versus single-injection peripheral nerve blocks found lower worst pain on days 0 to 2, lower opioid use, less nausea and higher satisfaction. Complications, functional recovery and cost could not be compared."},{"c":14,"id":"Q14.2","s":"Ch 14, section 14.1","q":"What did the meta-analysis of continuous and single-injection peripheral nerve blocks fail to establish?","o":["Whether complications, long-term function or cost differed","Whether opioid use fell on any of the days that were measured","Whether pain on day 1 fell after surgery in the catheter group","Whether satisfaction rose in the catheter group after surgery","Whether nausea fell in the catheter group compared with controls"],"k":0,"e":"The review could not tell whether the extra risks of a catheter, the effect on functional recovery, or the cost differed from a single injection."},{"c":14,"id":"Q14.3","s":"Ch 14, section 14.1","q":"Which patient is the best candidate for a continuous catheter rather than a single injection?","o":["An amputee whose pain will last for days and who cannot take much opioid","A patient having a short day-case procedure whose pain ends in half a day","A patient with no phone and no follow-up after discharge from hospital","A patient with sepsis near the catheter site and a high fever now","A patient who refuses any foreign body in the skin or the tissues"],"k":0,"e":"Tipping factors toward a catheter include surgery that hurts for more than a day, a patient who cannot take much opioid, early physical therapy and a trauma patient to keep comfortable on a ward. Lack of follow-up, infection and short operations tip the other way."},{"c":14,"id":"Q14.4","s":"Ch 14, section 14.1","q":"A patient on an anticoagulant has a deep catheter in place. Which statement about catheter removal is correct?","o":["Anticoagulation governs removal as well as insertion; the guideline rules apply","Removal is never affected by anticoagulants, only insertion matters, so the catheter may be pulled at any time","Only insertion is affected","Catheters can always be pulled at any time","The rules apply only to superficial catheters"],"k":0,"e":"Anticoagulation also governs catheter removal, not only insertion, so the timing rules for pulling a deep catheter must be checked."},{"c":14,"id":"Q14.5","s":"Ch 14, section 14.2","q":"Which placement method is the default for perineural catheters?","o":["Stimulating catheters only, placed without ultrasound guidance and confirmed by motor twitch at low current","Ultrasound-guided, nonstimulating placement, with stimulation as a check where anatomy is unclear","Blind landmark technique with a paresthesia as the endpoint for every catheter","Fluoroscopy for every catheter, with contrast injected at each placement","Placement by the patient after a short teaching session on the ward"],"k":1,"e":"Adding stimulation to ultrasound has not shown a clear advantage in recent data, so ultrasound-guided nonstimulating placement is the default, with stimulation used as a check."},{"c":14,"id":"Q14.6","s":"Ch 14, section 14.2","q":"After threading a perineural catheter, what is the best way to confirm it is working?","o":["Check only that the catheter advances easily when it is threaded through the needle and then fix it","Inject a small volume while watching the screen and look for fluid spread around the nerve","Inject a large volume without imaging and judge success by the dermatome later","Rely on tape for fixation and on the dressing to hold the catheter at the site","Assume it works if the needle was well placed and the catheter went in easily"],"k":1,"e":"A catheter that does not spread fluid on the screen is not working, however well the needle was placed. Aspirate before each injection."},{"c":14,"id":"Q14.7","s":"Ch 14, section 14.2","q":"Which skin preparation is consistent with the ASRA review for placing a catheter?","o":["Povidone iodine applied and wiped away at once, with clean gloves","Alcohol alone on dirty skin, applied once with a single wipe","No skin preparation if the skin looks clean and the patient has bathed","Sterile barrier precautions and 2% chlorhexidine-alcohol, fully dried","Chlorhexidine applied and the dressing placed while the skin is still wet"],"k":3,"e":"The review recommends sterile-barrier precautions, 2% chlorhexidine-alcohol skin preparation with full dry time and checklist-based daily inspection."},{"c":14,"id":"Q14.8","s":"Ch 14, section 14.2","q":"In the volunteer study of 20 subjects with ultrasound-guided catheters, how did the dislocation rate behave over time?","o":["It rose with time, with a correlation of 0.99","It fell with time","It was unrelated to time in the studied patients","It was zero after 1 hour","It was constant regardless of exercise"],"k":0,"e":"The dislocation rate rose with time (r = 0.99), so both movement and the clock contribute. Ultrasound could show spread through the catheter in all cases in the volunteers."},{"c":14,"id":"Q14.9","s":"Ch 14, section 14.2","q":"Tunneling a perineural catheter is recommended as an extra precaution when:","o":["The catheter will stay only one day","The patient is an infant only","The catheter is in the interscalene space for a few hours","Use over five days is planned","A single injection has been given"],"k":3,"e":"Tunneling is recommended as an extra precaution when use over five days is planned. The tunneling data come mostly from thoracic epidural catheters and are not clear for peripheral catheters."},{"c":14,"id":"Q14.10","s":"Ch 14, section 14.2","q":"Why should the depth at the skin and the date be written on the dressing and in the chart?","o":["It is required to bill for the catheter, to register the pump and to satisfy hospital audit rules","It prevents leaks","It stops infection","It makes the catheter stay in place","A recorded depth shows whether the catheter has moved, and a clear label prevents mistaking it for another line"],"k":4,"e":"A catheter with a clear label cannot be mistaken for a vein or an epidural line, and a recorded depth tells the next person whether it has moved."},{"c":14,"id":"Q14.11","s":"Ch 14, section 14.3","q":"A nurse asks why raising the infusion rate of a more dilute solution can match a lower rate of a stronger one. According to the review of continuous peripheral nerve blocks, what determines the effect?","o":["The concentration alone","The dose of local anesthetic delivered over time","The rate alone","The brand of pump","The color of the dressing and the make of the tape"],"k":1,"e":"A higher rate of a more dilute solution can match a lower rate of a stronger one, so the pump settings must be read as a daily total, not as a number on a screen."},{"c":14,"id":"Q14.12","s":"Ch 14, section 14.3","q":"In a randomized comparison of 126 laboring women, programmed intermittent epidural bolus compared with continuous infusion:","o":["Used more bupivacaine and raised pain","Gave identical results in every way","Used less bupivacaine per hour, needed fewer manual rescue boluses and raised satisfaction, with similar pain scores","Increased rescue boluses","Reduced satisfaction"],"k":2,"e":"Programmed intermittent epidural bolus used less bupivacaine per hour, needed fewer manual rescue boluses and raised satisfaction, with similar pain scores. This was in obstetric epidurals, not peripheral nerve catheters."},{"c":14,"id":"Q14.13","s":"Ch 14, section 14.3","q":"For peripheral nerve catheters, what is the state of the evidence on automated intermittent boluses versus continuous infusion?","o":["All trials favored boluses","Mixed: some sites favored boluses and others showed no difference","All trials favored continuous infusion over intermittent boluses of any size","No trials had been done","Boluses were proven to cause toxicity"],"k":1,"e":"A review of seven studies found that some, such as sciatic and adductor canal catheters, favored automated boluses, while others including interscalene and paravertebral catheters showed no difference. It remained unclear whether boluses give superior analgesia or less motor block."},{"c":14,"id":"Q14.14","s":"Ch 14, section 14.3","q":"What is the purpose of the lockout period on a patient-controlled regional analgesia pump?","o":["It increases the basal rate over the first hour","It cools the drug","It records the dressing changes","It prevents stacking of boluses","It shortens catheter life"],"k":3,"e":"The lockout prevents stacking, and the bolus volume should be small enough to avoid motor block yet large enough to reach the nerve. The number of button presses is the best guide to whether the block is working."},{"c":14,"id":"Q14.15","s":"Ch 14, section 14.4","q":"A catheter block has stopped working and the patient is in pain. Which is the correct first check in the troubleshooting sequence?","o":["Whether the pump is running: look for a clamp, a kink, an empty reservoir, a flat battery or a locked-out button","Replace the catheter at once","Increase the concentration immediately","Remove the dressing and pull the catheter","Culture the exit site"],"k":0,"e":"The sequence is the pump first, then the catheter position by comparing the depth at the skin with the chart, then whether the pain is surgical or positional, and then a test bolus."},{"c":14,"id":"Q14.16","s":"Ch 14, section 14.4","q":"A patient has a toxicity warning such as ringing in the ears, a metallic taste, numb lips and twitching during a catheter infusion. What is the immediate action?","o":["Give a bolus to treat the symptoms and then reassess the patient","Continue at a lower rate and observe the patient over the next hour or two","Stop the infusion, call for help and follow the toxicity algorithm","Wait until morning","Remove the dressing"],"k":2,"e":"These are signs of local anesthetic systemic toxicity. Stop the infusion, call for help and follow the local anesthetic toxicity algorithm."},{"c":14,"id":"Q14.17","s":"Ch 14, section 14.4","q":"A catheter falls out in hospital. What is advised?","o":["Re-thread the same catheter","Ignore it if the pain is controlled","Examine the tip for completeness, inspect the site and replace with a new catheter instead of re-threading","Cut the catheter and leave it","Tape the catheter back in"],"k":2,"e":"Do not re-thread a catheter that has come out. Examine the tip for completeness, inspect the exit site and decide whether to replace it with a new one."},{"c":14,"id":"Q14.18","s":"Ch 14, section 14.4","q":"A well patient has a catheter removed on day 3, and the tip is cultured routinely. What does the ASRA review say about this practice?","o":["Routine culturing is mandatory, because colonization always leads to infection","Culture is required for all patients before the catheter is removed","Colonization is rare and always dangerous, so every catheter should be cultured","Culture should replace clinical examination, because the signs of infection are unreliable at the site","Routine culturing is not recommended because colonization is common and seldom needs treatment"],"k":4,"e":"Routine culturing of catheter tips in a well patient is not recommended because colonization is common (up to 57% in some studies) and seldom needs treatment without symptoms."},{"c":14,"id":"Q14.19","s":"Ch 14, section 14.4","q":"A patient with a catheter develops redness, pus, fever and new pain at the site. Which response is correct?","o":["Reassure and continue the infusion","Increase the infusion rate","Treat it as infection until shown otherwise: remove the catheter, culture if symptomatic and escalate","Change only the dressing","Wait a week"],"k":2,"e":"Redness, swelling, pus, fever or new back, groin or thigh pain at the site is infection until shown otherwise. Remove the catheter, culture only if there are symptoms and escalate."},{"c":14,"id":"Q14.20","s":"Ch 14, section 14.4","q":"In the large prospective study of 1,416 orthopedic patients, which complication was seen once?","o":["A neural lesion in every patient","A death","A pneumothorax","A permanent paralysis","A psoas abscess"],"k":4,"e":"A deep infection near the lumbar plexus or femoral sheath can present as a psoas abscess, seen once in 1,416 patients (0.07%)."},{"c":14,"id":"Q14.21","s":"Ch 14, section 14.6","q":"In the multicenter prospective study of 1,416 patients with continuous peripheral nerve blocks, what was the median catheter duration and the rate of effective pain control?","o":["12 hours, with 50%","56 hours, with effective pain control in 96.3%","10 days, with 99%","24 hours, with 60% of patients reporting good pain control","3 weeks, with 90%"],"k":1,"e":"Median catheter time was 56 hours and pain control was effective in 96.3%. There were three neural lesions (0.21%), all resolved, and positive cultures in 28.7%."},{"c":14,"id":"Q14.22","s":"Ch 14, section 14.6","q":"In the same study, which were risk factors for local infection?","o":["Female sex and short duration","Young age and ambulatory care","Use of tunneling","Catheter duration over 48 hours, male sex, intensive care monitoring and no antibiotic prophylaxis","Use of ultrasound guidance"],"k":3,"e":"Risk factors for local infection were a catheter in place for more than 48 hours, male sex, intensive care monitoring and no antibiotic prophylaxis. Local inflammation occurred in 3%."},{"c":14,"id":"Q14.23","s":"Ch 14, section 14.6","q":"Does the 2017 ASA or 2025 ASRA guidance set a fixed maximum duration for perineural catheters?","o":["Yes, 24 hours, after which the catheter must be removed whatever the pain or the clinical picture","Yes, 72 hours, after which the catheter must be removed whatever the pain","No; individual judgment applies, and the catheter is removed when analgesic goals are met","Yes, 7 days, after which the catheter must be removed whatever the pain","Yes, 14 days, after which the catheter must be removed whatever the pain"],"k":2,"e":"No fixed maximum is set. The review advises individual judgment with removal as soon as analgesic goals are met, and most perioperative nerve catheters are removed in three to five days."},{"c":14,"id":"Q14.24","s":"Ch 14, section 14.5","q":"A 55-year-old man is having a lower-limb block, and you want dexamethasone's effect without exposing the nerve to an off-label preparation. What does the meta-analysis support?","o":["Perineural dexamethasone is far superior to the intravenous route in all trials and in all settings","The intravenous route gives nearly the same effect; perineural adds about 2.7 hours","Intravenous dexamethasone has no effect on the duration of the block at all","Perineural dexamethasone doubles the analgesia time compared with intravenous","The routes cannot be compared because no trial has tested both of them"],"k":1,"e":"Duration was 22.27 hours with perineural and 19.54 hours with intravenous dexamethasone, a difference of 2.73 hours judged probably not clinically relevant, with no difference by block site or local anesthetic."},{"c":14,"id":"Q14.25","s":"Ch 14, section 14.5","q":"In the trial of 132 patients having upper-limb fracture fixation under single-shot block, how often did rebound pain occur at 48 hours with and without perineural dexamethasone?","o":["11.1% with dexamethasone and 48.8% in controls","48.8% with dexamethasone and 11.1% in controls","30% in both groups","0% in both groups","90% with dexamethasone and 10% in the control group at the end"],"k":0,"e":"Rebound pain occurred in 11.1% of patients given dexamethasone and 48.8% of controls, as the trial reported. Pain began later in the dexamethasone group, 19.7 against 14.7 hours."},{"c":14,"id":"Q14.26","s":"Ch 14, section 14.5","q":"A meta-analysis of 20 trials of clonidine as an adjunct found it extended postoperative analgesia by about:","o":["12 minutes","12 hours","24 hours","48 hours after the end of the surgery","122 minutes"],"k":4,"e":"Clonidine extended analgesia by 122 minutes, sensory block by 74 minutes and motor block by 141 minutes, but raised hypotension (number needed to harm 11), bradycardia and sedation."},{"c":14,"id":"Q14.27","s":"Ch 14, section 14.5","q":"In a meta-analysis of brachial plexus blocks, perineural dexmedetomidine prolonged analgesia by about 266 minutes. Which harm was reported at a raised odds ratio?","o":["Pneumothorax","Nausea only, with no change in sedation or heart rate at any dose","Somnolence (odds ratio 19.67) and bradycardia (8.25)","Hearing loss","Renal failure"],"k":2,"e":"Dexmedetomidine prolonged sensory block by 257 minutes and analgesia by 266 minutes but raised the odds of bradycardia (8.25), hypotension (5.62) and somnolence (19.67)."},{"c":14,"id":"Q14.28","s":"Ch 14, section 14.6","q":"Which patient is suitable for discharge home with a perineural catheter?","o":["A patient who lives alone far away with no phone and no caretaker at home","A confused patient who cannot follow instructions about the pump or the limb","A patient who cannot protect a numb limb from pressure, heat or injury","A patient who cannot be contacted by telephone after discharge from hospital","A patient who understands the pump, can call for help, has a caretaker and can protect a numb limb"],"k":4,"e":"A suitable patient is able to understand the pump, can reach help by phone at any time, has a caretaker, lives within reach of the hospital and has a limb that can be protected while numb."},{"c":14,"id":"Q14.29","s":"Ch 14, section 14.6","q":"Which of the following belongs in the written teaching sheet for a patient going home with a catheter?","o":["Only the pump's brand name","Only the date of removal","Only a request not to call the service","What the pump does, what the bolus button and lockout do, limb protection, what to do if the limb is completely numb or the catheter falls out, and warning signs of toxicity","Only advice to drive carefully"],"k":3,"e":"The sheet covers the pump, the bolus button and lockout, limb protection, breakthrough pain, a completely numb limb, a catheter that falls out or an alarm, and the warning signs of toxicity. Patients should not drive while the catheter is in place."},{"c":14,"id":"Q14.30","s":"Ch 14, section 14.2","q":"You place an ultrasound-guided femoral catheter and an interscalene catheter, and you want to know how likely each is to move in the first hours. What did the volunteer study find?","o":["About 5% of catheters moved, and femoral catheters moved less than interscalene catheters in the same period","No catheters moved in the first six hours","About 15% moved within six hours, and femoral catheters moved more (25%) than interscalene catheters (5%)","About 15% moved, and interscalene catheters moved five times more than femoral catheters","All catheters moved in the first hour"],"k":2,"e":"In 20 volunteers, 15% of ultrasound-guided catheters moved out of position within six hours, with 5% of interscalene and 25% of femoral catheters. The risk rises with time. Secure the catheter well, check the block regularly, and be ready to re-image or replace a catheter that has stopped working."},{"c":14,"id":"Q14.31","s":"Ch 14, section 14.4","q":"A patient at home with a femoral nerve catheter calls to say the dressing around the exit site is wet, but the pump is working and the leg is numb. What is the likely explanation and the right first steps?","o":["Leakage at the exit site is the most common complaint at home and is usually harmless: check that the catheter has not moved, reinforce the dressing, and reassure the patient","Leakage means the catheter has fractured, so stop the pump and remove the catheter at once","Leakage means the catheter is infected, so start antibiotics and send the patient to the operating room","Leakage always means an intravascular catheter, so give lipid emulsion","Leakage is rare and means the patient has an allergy, so give an antihistamine"],"k":0,"e":"Leakage at the exit site is the most common complaint of patients at home, reported in 31% in one survey, and it is usually harmless. Check that the catheter has not moved, reinforce the dressing, and reassure the patient. A large and rising leak, a pump that empties too early, or cloudy or foul-smelling fluid suggests a break in the system, and the catheter should be replaced if it has moved."},{"c":14,"id":"Q14.32","s":"Ch 14, section 14.5","q":"You are choosing an adjuvant for a single-shot block in a patient who is not a good candidate for a drop in heart rate or pressure. Which statement about clonidine and dexmedetomidine is correct?","o":["Clonidine adds about 4 hours and dexmedetomidine about 2 hours, and neither affects the heart rate or pressure","Both add about 12 hours of analgesia and have no hemodynamic effects","Clonidine adds about 2 hours and dexmedetomidine about 4 hours, and both cause bradycardia and hypotension","Clonidine adds nothing and dexmedetomidine adds 10 hours","Both shorten the block and cause hypertension"],"k":2,"e":"Clonidine adds about 2 hours of analgesia and dexmedetomidine about 4 hours, and both cause bradycardia and hypotension. In a patient who cannot tolerate those effects, the gain is a poor trade. Perineural dexamethasone adds only about 2.7 hours over the intravenous route."},{"c":15,"id":"Q15-01","s":"15.1 ERAS Pathways and Where Blocks Fit","q":"A hospital is writing a colorectal enhanced recovery protocol and wants a source that grades every pathway item. Which description fits the ERAS Society colorectal guideline?","o":["A single-center audit of epidural use that gives no graded recommendations","A guideline limited to analgesic drug choices after open surgery","A fourth update with graded recommendations for each pathway item, rated with the GRADE system","A consensus statement that rates evidence by expert vote only","A registry of complications after colorectal surgery"],"k":2,"e":"The ERAS Society colorectal guideline is the fourth update of graded, evidence-based recommendations for each item of the pathway, and it rates the evidence with GRADE."},{"c":15,"id":"Q15-02","s":"15.1 ERAS Pathways and Where Blocks Fit","q":"A patient with a femoral block after total knee replacement cannot lift the leg, and the physiotherapist cannot mobilize him. Which of the four tests for a block in an enhanced recovery pathway did the block fail?","o":["Does it let the patient eat and pass urine?","Does it spare opioids?","Can it be done safely and reliably?","Does it let the patient move?","Does it lower the resting pain score?"],"k":3,"e":"The first test asks whether motor block prevents walking. A femoral block that weakens the quadriceps after knee replacement is the example of failing it. Resting pain score is not one of the four tests."},{"c":15,"id":"Q15-03","s":"15.1 ERAS Pathways and Where Blocks Fit","q":"On the first morning after surgery a patient with a thoracic epidural has low blood pressure and a distended bladder. Which of the four tests of a block in an enhanced recovery pathway does this fail?","o":["Does it let the patient move?","Does it let the patient eat and pass urine?","Does it spare opioids?","Can it be done safely and reliably?","Does it give a lower pain score than the alternatives?"],"k":1,"e":"An epidural with hypotension and urinary retention is the example of failing the test of eating and passing urine without autonomic or visceral side effects."},{"c":15,"id":"Q15-04","s":"15.1 ERAS Pathways and Where Blocks Fit","q":"A colleague asks how the PROSPECT group presents its procedure-specific advice. Which statement is accurate?","o":["It recommends the same regional technique for every operation in the pathway, whatever the surgery","It names techniques as recommended or not recommended, with the reason for each","It lists only the techniques it recommends and omits those without evidence","It advises avoiding all opioids in every procedure","It ranks techniques only by their cost to the hospital"],"k":1,"e":"PROSPECT builds recommendations for each operation from systematic reviews and trials, and it names techniques that are recommended and techniques that are not, with the reason."},{"c":15,"id":"Q15-05","s":"15.2 Multimodal Analgesia: Opioid-Sparing Strategies","q":"A resident asks why several analgesic drugs are combined in a multimodal plan. Which answer is best?","o":["It guarantees that no opioid will ever be needed after any operation","It removes the need for any regional technique in the pathway","It shortens the operation and the time under anesthesia","Each drug can be used at a lower exposure","It allows a single high-dose drug to replace all of the others"],"k":3,"e":"Multimodal analgesia combines drugs that act on different targets so that each can be used at a lower exposure. The aim is to spare opioids, not to avoid them at any cost."},{"c":15,"id":"Q15-06","s":"15.2 Multimodal Analgesia: Opioid-Sparing Strategies","q":"In a multimodal plan, which combination forms the scheduled base layer?","o":["A gabapentinoid plus an oral opioid","Dexamethasone plus intrathecal morphine, with a nerve block as rescue","A nerve block plus a gabapentinoid","Paracetamol plus an NSAID or COX-2 inhibitor","An opioid infusion plus paracetamol"],"k":3,"e":"The base layer is scheduled paracetamol plus an NSAID or COX-2 inhibitor, which acts at the site of injury and centrally and spares opioids."},{"c":15,"id":"Q15-07","s":"15.2 Multimodal Analgesia: Opioid-Sparing Strategies","q":"A surgeon asks that a gabapentinoid be added to every laparoscopic cholecystectomy order set. What do the PROSPECT recommendations say?","o":["Use it only when the basic analgesia cannot be given","Give it routinely before surgery in every patient having an operation","Give it for 72 hours after surgery in all patients","Use it in place of NSAIDs","Use it instead of dexamethasone"],"k":0,"e":"For laparoscopic cholecystectomy the recommendations reserve gabapentinoids for patients in whom the basic analgesia cannot be given."},{"c":15,"id":"Q15-08","s":"15.2 Multimodal Analgesia: Opioid-Sparing Strategies","q":"A surgeon requests a quadratus lumborum block for a routine laparoscopic cholecystectomy. Which plan matches the PROSPECT recommendations?","o":["Port-site infiltration with long-acting local anesthetic plus paracetamol, an NSAID and dexamethasone","A quadratus lumborum block with an epidural catheter for every patient, and opioids kept for rescue only","A rectus sheath block as the first choice, with scheduled opioids as the base of the plan","A paravertebral block as the first choice with a gabapentinoid before surgery","Spinal anesthesia with intrathecal morphine, with paracetamol held back for rescue"],"k":0,"e":"Port-site infiltration with long-acting local anesthetic is the first choice. Erector spinae plane and transversus abdominis plane blocks are second-line, and quadratus lumborum, rectus sheath, paravertebral, spinal and epidural techniques are not recommended."},{"c":15,"id":"Q15-09","s":"15.2 Multimodal Analgesia: Opioid-Sparing Strategies","q":"What is the role of the single intraoperative dose of intravenous dexamethasone in a multimodal plan?","o":["It replaces the nonopioid base","It provides motor block","It is the rescue for breakthrough pain after the base regimen has failed","It prolongs a nerve block on its own","It reduces inflammation and postoperative nausea"],"k":4,"e":"The table lists the steroid layer as a single intraoperative dose that reduces inflammation and postoperative nausea."},{"c":15,"id":"Q15-10","s":"15.3 Blocks for Orthopedic, Abdominal, Thoracic, and Breast Surgery","q":"Which element belongs to the PROSPECT regimen for unilateral primary total knee arthroplasty?","o":["A continuous femoral nerve catheter","Intrathecal morphine for every patient having the operation, without exception","A scheduled gabapentinoid for all patients","An opioid infusion as the base","A single intraoperative intravenous dose of dexamethasone"],"k":4,"e":"The recommended regimen is paracetamol plus an NSAID or COX-2 inhibitor, a single-shot adductor canal block, peri-articular infiltration and one intraoperative dose of dexamethasone, with opioids for rescue."},{"c":15,"id":"Q15-11","s":"15.3 Blocks for Orthopedic, Abdominal, Thoracic, and Breast Surgery","q":"When does the PROSPECT knee guideline reserve intrathecal morphine?","o":["As the first-line technique for every patient having knee replacement","Only when neither the adductor canal block nor infiltration can be done","Only for outpatients who are going home on the same day","Whenever the patient is anxious about the block being performed","In place of paracetamol as the scheduled nonopioid base for every patient in the pathway"],"k":1,"e":"Intrathecal morphine is held back for the uncommon case where neither the adductor canal block nor peri-articular infiltration can be performed."},{"c":15,"id":"Q15-12","s":"15.3 Blocks for Orthopedic, Abdominal, Thoracic, and Breast Surgery","q":"Which technique does the 2026 PROSPECT update for total hip arthroplasty not recommend?","o":["Quadratus lumborum block","Suprainguinal fascia iliaca compartment block","Preoperative PENG block","Single-shot local infiltration when a regional technique is not feasible","Scheduled paracetamol and NSAIDs"],"k":0,"e":"The update prefers a suprainguinal fascia iliaca block or a preoperative PENG block, and it does not recommend quadratus lumborum or lumbar erector spinae plane blocks."},{"c":15,"id":"Q15-13","s":"15.3 Blocks for Orthopedic, Abdominal, Thoracic, and Breast Surgery","q":"A surgeon declines any regional technique for a total hip arthroplasty. What alternative does the 2026 PROSPECT update offer?","o":["A continuous lumbar plexus catheter","A lumbar erector spinae plane block","Single-shot local infiltration","A thoracic epidural","Opioids alone"],"k":2,"e":"Single-shot local infiltration is the alternative when a regional technique is not feasible."},{"c":15,"id":"Q15-14","s":"15.3 Blocks for Orthopedic, Abdominal, Thoracic, and Breast Surgery","q":"In the Cochrane review of paravertebral block versus thoracic epidural after thoracotomy, how did pulmonary complications compare?","o":["Paravertebral block halved them, and the evidence for this was of high certainty","Epidural halved them with moderate certainty in all included trials","They were not measured in any of the trials that were included","Paravertebral block doubled them, though the quality was very low","They did not differ, though the evidence was of low to very low quality"],"k":4,"e":"Pulmonary complications did not differ between the techniques, and the review rated that finding low to very low quality."},{"c":15,"id":"Q15-15","s":"15.3 Blocks for Orthopedic, Abdominal, Thoracic, and Breast Surgery","q":"A meta-analysis of ten trials in 670 patients compared erector spinae plane block with paravertebral block in thoracic surgery. Which result was reported?","o":["Erector spinae plane block lowered resting pain at 24 hours and also used less opioid in the first day","There was no difference between the two techniques in any outcome that was measured","Paravertebral block lowered pain on movement at 12 hours and used less opioid; resting pain at 24 hours did not differ","Erector spinae plane block used less opioid in the first 24 hours, with low heterogeneity between trials","Paravertebral block raised pain on movement at 12 hours but lowered resting pain at 24 hours"],"k":2,"e":"The paravertebral block gave better analgesia on movement and more opioid sparing, with high heterogeneity. The erector spinae plane block is a reasonable substitute when a paravertebral block is hard to do, but it is not shown to be equal."},{"c":15,"id":"Q15-16","s":"15.4 Postoperative Epidural Analgesia","q":"Which outcome was more likely with epidural analgesia than with intravenous patient-controlled analgesia after intra-abdominal surgery in the Cochrane review?","o":["Nausea","Sedation or drowsiness needing a change of dose","Hypotension needing treatment","Desaturation needing oxygen or a change of dose","Venous thromboembolism needing anticoagulation"],"k":2,"e":"Epidural analgesia was more likely to fail to establish, to cause itching and to cause hypotension needing treatment. There was no clear difference in nausea, sedation, desaturation or venous thromboembolism."},{"c":15,"id":"Q15-17","s":"15.4 Postoperative Epidural Analgesia","q":"The Royal College of Anaesthetists' third National Audit Project estimated the risk of permanent harm after central neuraxial block at roughly:","o":["About 420 per 100,000 pessimistically and 200 per 100,000 optimistically","About 42 per 100,000 pessimistically and 20 per 100,000 optimistically","About 0.42 per 100,000 pessimistically and 0.20 per 100,000 optimistically","About 4.2 per 100,000 pessimistically and 2.0 per 100,000 optimistically","About 4,200 per 100,000 pessimistically and 2,000 per 100,000 optimistically"],"k":3,"e":"The Third National Audit Project found permanent harm after central neuraxial block in about 4.2 per 100,000 blocks on a pessimistic count and 2.0 per 100,000 on an optimistic count."},{"c":15,"id":"Q15-18","s":"15.4 Postoperative Epidural Analgesia","q":"In NAP3, perioperative epidurals accounted for what share of central neuraxial blocks and of complications leading to harm?","o":["About half of the blocks, but only one in seven of the complications leading to harm","About one in seven blocks, but more than half of the complications leading to harm","About one in seven of the blocks and about one in seven of the complications","More than half of the blocks and more than half of the complications leading to harm","Fewer than one in twenty of the blocks and none of the complications leading to harm"],"k":1,"e":"Perioperative epidurals made up about one in seven of all central blocks but more than half of the complications leading to harm. The report could not say whether that reflects the technique or the higher risk of the patients."},{"c":15,"id":"Q15-19","s":"15.4 Postoperative Epidural Analgesia","q":"An epidural is planned for a major open abdominal operation. Which preparation should be settled before the catheter goes in?","o":["The observation and treatment plan for hypotension","A plan to avoid all NSAIDs","A decision to use air rather than saline for loss of resistance","An intravenous PCA as the main plan","A prophylactic vasopressor infusion for every patient"],"k":0,"e":"The bailout for an unmonitored epidural is to set the observation and treatment plan for hypotension before the catheter is placed."},{"c":15,"id":"Q15-20","s":"15.5 Patient-Controlled Analgesia","q":"Compared with non-patient-controlled opioid analgesia, which effect was more common with patient-controlled analgesia in the Cochrane review?","o":["Longer hospital stay","More nausea and vomiting","Itching, 15% against 8%","More sedation","Lower satisfaction"],"k":2,"e":"Itching was more common with the pump, 15% against 8%. Other side effects and length of stay did not differ, and satisfaction was higher."},{"c":15,"id":"Q15-21","s":"15.5 Patient-Controlled Analgesia","q":"Where does patient-controlled analgesia fit best in an opioid-sparing pathway?","o":["A rescue layer under a block and a nonopioid base","The main plan of the pathway, because it reliably spares opioids in every patient who uses it","A replacement for the scheduled nonopioid base, because patients prefer it to tablets","A technique that is contraindicated in an enhanced recovery pathway after any operation","The technique that most reduces total opioid use compared with any regional block"],"k":0,"e":"Patients using the pump consumed slightly more opioid in the first 24 hours, so it is a reasonable backup that works best under a regional technique and a scheduled nonopioid base."},{"c":15,"id":"Q15-22","s":"15.5 Patient-Controlled Analgesia","q":"A Cochrane review of 49 studies compared patient-controlled opioid analgesia with non-patient-controlled analgesia. Which pair of findings is correct?","o":["Pain about 9 points higher in the first 24 hours on a 100-point scale, and satisfaction 61% against 81%","Pain unchanged in the first 24 hours on a 100-point scale, and satisfaction 81% against 61%","Pain about 30 points lower on a 100-point scale, and satisfaction 95% against 50% for the pump","Pain about 9 points lower in the first 24 hours on a 100-point scale, and satisfaction 81% against 61%","Pain about 9 points lower on a 100-point scale, and satisfaction unchanged between the groups"],"k":3,"e":"Pain scores were about 9 points lower at 24 hours and about 10 points lower at 48 hours, and satisfaction was 81% with the pump against 61% without it."},{"c":15,"id":"Q15-23","s":"15.6 Chronic Postsurgical Pain Prevention","q":"A pooled analysis of seven studies (2,161 patients) examined paravertebral block and chronic pain after breast cancer surgery. Which statement is accurate?","o":["Significantly reduced pain at 6 months (risk ratio 0.82), with high certainty of a true effect","Not significant at 6 months (risk ratio 0.82, 95% CI 0.62 to 1.08); less neuropathic pain at 12 months, low certainty","Increased chronic pain at 12 months compared with no block at all, with moderate certainty","No change in chronic neuropathic pain at 12 months and no change in pain at 6 months","Only acute pain in the first week after surgery was studied in the pooled analysis of the trials"],"k":1,"e":"The effect on chronic pain at 6 months was not significant, while chronic neuropathic pain at 12 months was lower (risk ratio 0.51) with low certainty. The honest summary is promising and unproven."},{"c":15,"id":"Q15-24","s":"15.6 Chronic Postsurgical Pain Prevention","q":"A patient asks whether a paravertebral block will stop chronic pain after her breast operation. Which reply is best?","o":["It will prevent chronic pain","It prevents chronic pain only if the dose is doubled or the block repeated","No block can have any effect on pain","Its effect on chronic pain is proven after breast surgery","It treats acute pain, and a possible effect on chronic pain is not proven"],"k":4,"e":"The advice is to give a block to every patient who needs one for acute pain and not to promise that it will prevent chronic pain."},{"c":15,"id":"Q15-25","s":"15.4 Postoperative Epidural Analgesia","q":"A surgeon wants to know whether a thoracic epidural is safer than intravenous patient-controlled analgesia after intra-abdominal surgery, because all five deaths in the Cochrane review were in the epidural group. What is the correct reply?","o":["The deaths prove that the epidural is more dangerous, and it should no longer be used","The deaths prove that intravenous patient-controlled analgesia is more dangerous, because it had none","The deaths were due to the block in all five patients, and the review confirms it","The difference was not statistically significant, so the review cannot say which approach is safer","The review found no deaths in either group, so the question does not arise"],"k":3,"e":"All five deaths in the review were in the epidural group, a difference that was not statistically significant, so the review cannot say which approach is safer. The same review found that epidural analgesia was more likely to fail to establish, to cause itching and to cause hypotension needing treatment. A rare event in one group does not prove cause when the numbers are small."},{"c":15,"id":"Q15-26","s":"15.2 Multimodal Analgesia: Opioid-Sparing Strategies","q":"In a large US cohort of patients who were not taking opioids before surgery, what proportion were still using them more than three months after the operation, and why does it matter to an opioid-sparing plan?","o":["About 60%, and no plan can change it","About 6%, and an opioid-sparing plan is partly an attempt to stop that","About 0.6%, and it matters only in patients with a history of misuse","About 6%, and it is the same whether or not the plan includes a nerve block","About 16%, and it is caused only by chronic pain that existed before surgery"],"k":1,"e":"In the large US cohort, about 6% of patients who were not taking opioids before surgery were still using them more than three months afterward. An opioid-sparing plan is partly an attempt to stop that. The multimodal plan combines drugs that act on different targets, and the aim is pain control with little or no opioid."},{"c":15,"id":"Q15-27","s":"15.4 Postoperative Epidural Analgesia","q":"In the Cochrane review of epidural analgesia against patient-controlled intravenous analgesia, epidural pain scores at rest were lower by about 5 to 9 points on a 100-point scale. How did the authors describe this difference?","o":["Large, and clearly important to patients in every operation","Large, and enough to recommend an epidural for every abdominal operation","Absent, because pain scores did not differ at any time","Reversed, with lower pain scores in the intravenous group","Small, and perhaps not important to patients"],"k":4,"e":"Epidural analgesia gave lower pain scores at rest by about 5 to 9 points on a 100-point scale at different times, a difference the authors described as small and perhaps not important to patients. The pain-on-movement data could not be pooled. Against that gain, epidural analgesia was more likely to fail, to cause itching and to cause hypotension needing treatment."},{"c":15,"id":"Q15-28","s":"15.2 Multimodal Analgesia: Opioid-Sparing Strategies","q":"A surgeon books a short operation with a small incision and asks you for a nerve block 'for the enhanced recovery pathway'. What is the right thinking?","o":["Every enhanced recovery pathway requires a nerve block, so place one in every patient","A nerve block should replace all other drugs in the plan, so the base can be left out","A nerve block is justified by its cost alone, so the added benefit does not need to be measured","A nerve block is never part of an enhanced recovery pathway, because it delays discharge","A block does not have to be the main event; the best plan may contain no block at all"],"k":4,"e":"For a short operation with a small incision, the best multimodal plan may contain no nerve block at all. A regional technique is judged by the same standard as a drug, by what it adds to the base. The base of acetaminophen plus an NSAID or COX-2 inhibitor, and dexamethasone where appropriate, comes first."},{"c":16,"id":"Q16-01","s":"16.1 Pediatric Regional Anesthesia","q":"A 4-year-old under general anesthesia is about to have a peripheral nerve block. A resident asks whether a test dose is mandatory. What does the ESRA and ASRA joint advisory say?","o":["It is mandatory before every pediatric block, whatever the technique or the child's age","It is mandatory only for neuraxial blocks in infants and children","It is contraindicated under general anesthesia in children of any age","It is required only for children younger than six months of age","It is hard to interpret under anesthesia and is left to the clinician's discretion"],"k":4,"e":"The advisory says a test dose is difficult to interpret in an anesthetized child and so should stay discretionary. Aspirating and injecting slowly remain the practical safeguards."},{"c":16,"id":"Q16-02","s":"16.1 Pediatric Regional Anesthesia","q":"Which loss-of-resistance medium does the pediatric advisory support for epidural placement?","o":["Either air or saline, because both are supported by expert opinion","Air only","Saline only","Neither; ultrasound alone is required for every pediatric block","Air for infants and saline for older children"],"k":0,"e":"The advisory states that both air and saline loss of resistance are supported by expert opinion."},{"c":16,"id":"Q16-03","s":"16.1 Pediatric Regional Anesthesia","q":"How does the pediatric advisory describe the evidence behind its recommendations?","o":["Several large randomized trials support each of the recommendations in the advisory","Only anecdotal case reports of single children support any of the recommendations","A single randomized trial of caudal blocks supports every one of the recommendations","The evidence is graded high for each recommendation made by the joint committee","High-level evidence is lacking; most recommendations rest on observational studies"],"k":4,"e":"The authors are clear that high-level evidence is lacking and that most recommendations rest on observational studies, including the registry data."},{"c":16,"id":"Q16-04","s":"16.1 Pediatric Regional Anesthesia","q":"A resident calculates a pediatric local anesthetic dose from the child's age group. What is advised?","o":["Use age bands because a child's weight changes quickly between visits","Halve the adult dose per kilogram for every child under twelve","Calculate every dose from weight, check it twice and have a second person verify","Dose by body surface area alone and ignore the weight of the child","Use the lowest concentration available whatever the child's weight and the block performed"],"k":2,"e":"The dose calculation is done on the weight of the child and not the age, and the youngest infants carry the highest toxicity risk."},{"c":16,"id":"Q16-05","s":"16.1 Pediatric Regional Anesthesia","q":"A surgeon worries that a nerve block in a child with a forearm fracture will hide compartment syndrome. What does the joint advisory say about children?","o":["It doubles the risk of acute compartment syndrome in every child","No evidence shows a higher risk or delayed diagnosis","It delays diagnosis in all children who have a nerve block and a fracture","Evidence shows harm only after caudal blocks in small children","It is contraindicated in any child who has a fracture of a limb"],"k":1,"e":"The advisory states that no current evidence shows regional anesthesia increasing the risk of acute compartment syndrome or delaying its diagnosis in children."},{"c":16,"id":"Q16-06","s":"16.2 Obstetric Regional Anesthesia","q":"A parturient with an anticipated difficult airway is in early labor. According to the 2016 ASA and SOAP guideline, which of the following is given as a reason to consider early catheter placement?","o":["Multiparity","Maternal age under 25","An anticipated difficult airway","Cervical dilation of 8 cm","A previous uncomplicated vaginal delivery"],"k":2,"e":"The guideline lists twin gestation, preeclampsia, an anticipated difficult airway and obesity as examples of complicated patients in whom early catheter placement should be considered."},{"c":16,"id":"Q16-07","s":"16.2 Obstetric Regional Anesthesia","q":"A healthy primigravida asks for an epidural. The resident wants a platelet count first. What does the 2016 guideline say?","o":["A count is mandatory before any neuraxial block in every parturient, whatever the history","No routine count; decide individually","A count above 150 is required in every patient before the block","A count is needed only for spinal and never for epidural techniques","A bleeding time replaces the platelet count in all patients here"],"k":1,"e":"The guideline says a routine platelet count is not needed in the healthy parturient, the decision should be individualized, and no specific threshold predicting neuraxial complications has been found."},{"c":16,"id":"Q16-08","s":"16.2 Obstetric Regional Anesthesia","q":"The 2016 obstetric guideline supports which type of spinal needle?","o":["A cutting needle","A pencil-point needle, which the guideline prefers to a cutting needle","A Tuohy needle","Any needle of the same gauge","The guideline gives no preference"],"k":1,"e":"The guideline supports pencil-point spinal needles rather than cutting needles."},{"c":16,"id":"Q16-09","s":"16.2 Obstetric Regional Anesthesia","q":"Which labor epidural solution does the 2016 guideline support to limit motor block?","o":["Concentrated local anesthetic alone","An opioid alone","Local anesthetic with epinephrine alone, given as a single bolus","Continuous dilute local anesthetic infusion combined with an opioid","Saline alone"],"k":3,"e":"The guideline supports continuous infusion of dilute local anesthetic with an opioid, and patient-controlled epidural analgesia as an alternative to a fixed rate."},{"c":16,"id":"Q16-10","s":"16.2 Obstetric Regional Anesthesia","q":"Which situation does the 2016 guideline give as a reason to keep general anesthesia for a cesarean delivery?","o":["Profound fetal bradycardia, uterine rupture, severe hemorrhage or severe abruption","Maternal obesity alone","A request for a faster recovery","An epidural already in place and working","Routine elective repeat cesarean"],"k":0,"e":"General anesthesia is kept for situations such as profound fetal bradycardia, uterine rupture, severe hemorrhage and severe abruption. Neuraxial techniques are preferred for most cesarean deliveries."},{"c":16,"id":"Q16-11","s":"16.2 Obstetric Regional Anesthesia","q":"In the Cochrane review of combined spinal-epidural against epidural analgesia in labor, compared with a traditional epidural CSE showed:","o":["Faster onset of effective pain relief and fewer instrumental deliveries","Slower onset of effective pain relief and more maternal itching only, with no other change","More instrumental deliveries and worse neonatal Apgar scores overall","More neonatal unit admissions with no change in onset of relief","Lower maternal satisfaction with higher cesarean delivery rates"],"k":0,"e":"CSE gave faster onset by about three minutes and fewer instrumental deliveries (risk ratio near 0.81) than a traditional epidural. Against a low-dose epidural there was no difference in instrumental deliveries, and neonatal outcomes did not differ."},{"c":16,"id":"Q16-12","s":"16.3 The Older Adult and the Frail Patient","q":"In REGAIN, about 15% of patients assigned to spinal anesthesia for hip fracture surgery received general anesthesia, often after failed spinal attempts. Why does this matter?","o":["It proves that spinal anesthesia is unsafe","The crossover limits interpretation","It shows general anesthesia is superior","It makes the trial invalid for any use","It shows that delirium was higher with spinal anesthesia"],"k":1,"e":"The crossover limits interpretation. The practical conclusion remains that spinal anesthesia is a reasonable choice and not a requirement."},{"c":16,"id":"Q16-13","s":"16.3 The Older Adult and the Frail Patient","q":"In REGAIN, delirium occurred in 20.5% after spinal anesthesia and 19.7% after general anesthesia, and 60-day mortality was 3.9% against 4.1%. What is the best conclusion?","o":["Spinal anesthesia halved the risk of delirium in older adults","General anesthesia halved the 60-day mortality in these patients","Spinal anesthesia doubled the rate of delirium after hip fracture","Mortality was much higher after spinal anesthesia than after general anesthesia","The two did not differ in a meaningful way"],"k":4,"e":"These differences were small and the primary outcome, death or inability to walk at 60 days, was 18.5% against 18.0%, which was not significant."},{"c":16,"id":"Q16-14","s":"16.3 The Older Adult and the Frail Patient","q":"An 82-year-old with a hip fracture is at risk of delirium. According to the Cochrane review of 49 trials, nerve blocks compared with no block:","o":["Reduced death at 6 months, with high certainty of the benefit","Reduced pain on movement and acute confusion, both with high certainty","Increased the rate of acute confusion, with high certainty of the harm shown","Had no effect on pain on movement but reduced chest infection","Reduced chest infection with high certainty and shortened stay"],"k":1,"e":"Pain on movement fell by about 2.5 points on a 0 to 10 scale and acute confusion was reduced, both with high certainty. Death at 6 months was uncertain, and the chest infection result was of moderate certainty."},{"c":16,"id":"Q16-15","s":"16.3 The Older Adult and the Frail Patient","q":"What is concluded about choosing between spinal and general anesthesia for hip fracture in an older adult?","o":["Spinal anesthesia is reasonable but not required; add a nerve block for pain and delirium","Spinal anesthesia is required for every older adult with hip fracture, whatever the risk or the preference","General anesthesia is required for every older adult with hip fracture","The choice should be made by the patient's age and nothing else","A nerve block should be avoided in all frail older adult patients"],"k":0,"e":"Death or inability to walk at 60 days did not differ, so either anesthetic is acceptable. A nerve block helps with pain and confusion."},{"c":16,"id":"Q16-16","s":"16.4 Obesity and Obstructive Sleep Apnea","q":"A patient with obstructive sleep apnea will have a regional block with moderate sedation. What monitoring does the 2006 ASA guideline advise?","o":["Pulse oximetry alone, checked at regular intervals by the nurse","Intermittent checks of the airway every fifteen minutes","Blood pressure cycling only, with no ventilation monitor","Continuous ventilation monitoring, preferably capnography, throughout the sedation","No monitoring beyond the standard for an awake patient"],"k":3,"e":"The guideline says moderate sedation should be accompanied by continuous monitoring of ventilation, preferably by capnography."},{"c":16,"id":"Q16-17","s":"16.4 Obesity and Obstructive Sleep Apnea","q":"A patient with sleep apnea is anxious before a block. What does the ASA guideline note about premedication?","o":["Benzodiazepines are protective against obstruction","Barbiturates are the preferred anxiolytic","Sedatives have no effect on the airway","Sedation is contraindicated even at low dose in every patient with a difficult airway","Benzodiazepines and barbiturates raise the risk of airway obstruction"],"k":4,"e":"The guideline notes that benzodiazepines and barbiturates raise the risk of airway obstruction, so sedation is kept light and monitored."},{"c":16,"id":"Q16-18","s":"16.4 Obesity and Obstructive Sleep Apnea","q":"A review reported the first epidural catheter was placed successfully in what proportion of obese patients compared with controls?","o":["94% against 42%","60% against 62%","42% against 94%, with overall success still much lower after repeated attempts","42% against 94%, with overall success similar after more attempts","80% against 94%, with no extra attempts needed"],"k":3,"e":"Landmarks are harder to find in obesity and fat pockets can give a false loss of resistance, but overall success was similar after more attempts."},{"c":16,"id":"Q16-19","s":"16.4 Obesity and Obstructive Sleep Apnea","q":"Success of supraclavicular block in obese compared with non-obese patients was reported in a review as:","o":["97.3% in obese patients and 94.3% in non-obese patients overall","60% in obese patients and 97.3% in non-obese patients","94.3% in obese patients and 97.3% in non-obese patients","94.3% in both groups","Success could not be measured in obese patients"],"k":2,"e":"Peripheral block success is slightly lower in obesity, and ultrasound improves it, but obesity is not a contraindication in experienced hands."},{"c":16,"id":"Q16-20","s":"16.4 Obesity and Obstructive Sleep Apnea","q":"Rapid weight loss after gastric bypass is linked to injury of which nerve, so that positioning needs care?","o":["The radial nerve at the elbow","The ulnar nerve","The peroneal nerve, which is vulnerable after rapid weight loss","The median nerve","The femoral nerve"],"k":2,"e":"The review links rapid weight loss to peroneal nerve injury and advises a neurologic history and care with positioning."},{"c":16,"id":"Q16-21","s":"16.5 Trauma and the Risk of Masking Compartment Syndrome","q":"A systematic review of regional anesthesia and patient-controlled analgesia in orthopedic procedures included 34 articles, 28 of them case reports. What does the evidence show?","o":["Regional anesthesia clearly delays diagnosis of compartment syndrome in children","Harm has not been demonstrated, but safety has not been proven either","Regional anesthesia clearly prevents compartment syndrome","Patient-controlled analgesia is proven unsafe","Compartment syndrome occurred in every prospective study"],"k":1,"e":"Only two small prospective studies were found, with no cases of compartment syndrome, and the authors asked for prospective or large retrospective data."},{"c":16,"id":"Q16-22","s":"16.5 Trauma and the Risk of Masking Compartment Syndrome","q":"Of the case reports published after 2009 in the review of regional anesthesia and compartment syndrome, what proportion concluded that regional anesthesia does not increase the risk of delayed diagnosis?","o":["25%","50%","10%","100%","75%"],"k":4,"e":"Of the case reports published after 2009, 75% concluded that regional anesthesia does not increase the risk of delayed diagnosis."},{"c":16,"id":"Q16-23","s":"16.5 Trauma and the Risk of Masking Compartment Syndrome","q":"A patient with a tibial shaft fracture and a block has breakthrough pain out of proportion. What is advised?","o":["Add more local anesthetic through the catheter to relieve the pain without examining the limb","Assume the block is wearing off and increase the opioid infusion","Examine the limb for compartment syndrome first","Delay any assessment of the limb until the next morning round","Remove the dressing and reassess the pain after twenty-four hours"],"k":2,"e":"The pitfall is treating breakthrough pain in an at-risk limb with more local anesthetic. Diagnosis comes first."},{"c":16,"id":"Q16-24","s":"16.6 Blocks in the Patient with a Pre-existing Neuropathy","q":"A patient with diabetic neuropathy needs a limb block. What does the second ASRA practice advisory on neurologic complications recommend?","o":["Never block a limb with a pre-existing neuropathy","Block as for any patient because risk is unchanged","Use only a proximal plexus block","A deliberate risk-to-benefit analysis for the individual patient","Give a steroid with the local anesthetic in all cases to protect the nerve"],"k":3,"e":"The advisory gives no fixed rule. It calls for a risk-to-benefit analysis for each patient with a pre-existing neurologic disease."},{"c":16,"id":"Q16-25","s":"16.6 Blocks in the Patient with a Pre-existing Neuropathy","q":"What does the review of nerve injury after peripheral nerve blockade state about patients with pre-existing neuropathy?","o":["They are at lower risk because the nerve is already damaged and less sensitive","Their risk is identical to other patients","They are at increased risk only after neuraxial blocks","They may be at increased risk of postoperative neurologic dysfunction","They are protected by ultrasound guidance"],"k":3,"e":"The review states that patients with pre-existing neuropathy may be at increased risk of postoperative neurologic dysfunction."},{"c":16,"id":"Q16-26","s":"16.7 Blocks in the Anesthetized or Heavily Sedated Patient","q":"An adult is already under general anesthesia when a lower limb block is suggested for postoperative analgesia. What does the second ASRA advisory advise?","o":["Routine blocks are preferred in all anesthetized adult patients","Block only when a nerve stimulator is used and the patient is asleep","Block only above the clavicle in sedated adults","Blocks are equally contraindicated in anesthetized children","Avoid routine blocks in anesthetized or deeply sedated adults"],"k":4,"e":"The advisory advises against routine blocks in anesthetized or deeply sedated adults, because the patient cannot report the pain that warns of intraneural injection."},{"c":16,"id":"Q16-27","s":"16.7 Blocks in the Anesthetized or Heavily Sedated Patient","q":"What does the ASRA advisory note about children having blocks under general anesthesia or heavy sedation?","o":["Registry data show injury rates no higher than expected","Injury rates are three times higher than in adults in the registry data","Blocks under anesthesia are contraindicated","Registry data are lacking","Only awake blocks are acceptable"],"k":0,"e":"For children the registry data show that blocks under general anesthesia or heavy sedation do not raise injury rates above those expected. The difference from adults reflects how harm has been measured, not biology."},{"c":16,"id":"Q16-28","s":"16.8 Renal, Hepatic, and Coagulation Disorders","q":"A meta-analysis compared regional anesthesia with local infiltration for arteriovenous fistula creation. Which statement about its results is accurate?","o":["Regional anesthesia gave a lower primary patency than infiltration","Regional anesthesia gave a smaller brachial artery diameter","No significant difference in infection or thrombosis of the access, though primary patency was higher","Regional anesthesia required more analgesic use afterward in the first week","Regional anesthesia caused more infection of the access"],"k":2,"e":"Regional anesthesia was associated with higher primary patency and a larger brachial artery diameter, with less analgesic use, and no significant difference in infection or thrombosis of the access."},{"c":16,"id":"Q16-29","s":"16.8 Renal, Hepatic, and Coagulation Disorders","q":"In the fistula meta-analysis, regional anesthesia was associated with a larger brachial artery diameter by a mean difference of:","o":["0.083 mm","8.3 mm","1.88 mm","0.83 mm","0.01 mm"],"k":3,"e":"The mean difference in brachial artery diameter was 0.83 mm, alongside an odds ratio for primary patency of 1.88."},{"c":16,"id":"Q16-30","s":"16.8 Renal, Hepatic, and Coagulation Disorders","q":"A review of anesthesia in liver disease states that the half-life of lidocaine may:","o":["Increase by more than 300%","Fall by half","Remain unchanged","Increase by about 10%","Fall by more than 300% from baseline"],"k":0,"e":"Drug clearance changes in liver disease, so local anesthetic doses need care and total doses are kept lower with close monitoring."},{"c":16,"id":"Q16-31","s":"16.8 Renal, Hepatic, and Coagulation Disorders","q":"A patient with advanced liver disease is considered for a regional technique. What does the review advise?","o":["Limit regional anesthesia to selected patients with an acceptable coagulation profile","Use regional techniques in all patients because they avoid the liver entirely and are safe","Avoid every regional technique","Ignore coagulation tests","Use higher doses to compensate for slow clearance"],"k":0,"e":"Coagulopathy is a contraindication to some regional techniques. Thromboelastography may help identify the cause of coagulopathy."},{"c":16,"id":"Q16-32","s":"16.8 Renal, Hepatic, and Coagulation Disorders","q":"How does the liver disease review describe thoracic epidural analgesia for major abdominal or thoracic surgery?","o":["Contraindicated in every patient who has any liver disease","Proven to protect liver function after major surgery","A useful option, though its hepatic effects are understudied","Required for every patient having major abdominal surgery","Unsafe because it slows the clearance of every local anesthetic"],"k":2,"e":"The review describes thoracic epidural analgesia as a useful option for major abdominal and thoracic surgery, with its hepatic effects understudied."},{"c":16,"id":"Q16-33","s":"16.8 Renal, Hepatic, and Coagulation Disorders","q":"A patient who had a gastric bypass is booked for a neuraxial block. Which pre-block step is advised?","o":["No testing, because a deficiency of vitamin K never affects coagulation in these patients","A coagulation check, because vitamin K deficiency is common after gastric bypass","A repeat bariatric operation before any regional technique is attempted at all","A platelet transfusion for every patient, whatever the coagulation results show","Routine omission of every neuraxial technique in all patients after gastric bypass"],"k":1,"e":"The review warns of vitamin K deficiency in a large proportion of patients after gastric bypass and advises a coagulation check and a neurologic history before a neuraxial block."},{"c":16,"id":"Q16-34","s":"16.4 Obesity and Obstructive Sleep Apnea","q":"A patient with a body mass index above 25 kg/m² is booked for an outpatient limb block. What does a prospective study of 9,342 blocks tell you?","o":["A body mass index above 25 kg/m² was protective against failure, so no rescue plan is needed in these patients","Obesity is a contraindication to outpatient blocks","Body mass index did not relate to block failure in any analysis","A body mass index above 25 kg/m² was an independent risk factor for a failed block, so plan a rescue","Failure was higher only in patients with a body mass index above 50 kg/m"],"k":3,"e":"In the prospective study of 9,342 blocks, a body mass index above 25 kg/m² was an independent risk factor for failed outpatient blocks. Obesity raises block failure but is not a contraindication, and the airway risk remains. Plan for a possible failure and a rescue."},{"c":16,"id":"Q16-35","s":"16.8 Renal, Hepatic, and Coagulation Disorders","q":"A nephrologist asks whether regional anesthesia helps arteriovenous fistula creation in a patient with end-stage renal disease. What did the review of 7 trials and 1 retrospective study find?","o":["Primary patency was lower with regional anesthesia than with local infiltration, with an odds ratio of 0.53","Primary patency was higher with regional anesthesia, with an odds ratio of 1.88","Primary patency was identical with both techniques","Regional anesthesia caused fistula failure in most patients","Primary patency could not be assessed in any of the studies"],"k":1,"e":"In patients with end-stage renal disease, regional anesthesia for fistula creation was associated with higher primary patency than local infiltration, with an odds ratio of 1.88."},{"c":17,"id":"Q17-01","s":"17.1 Block Failure and Rescue Strategies","q":"Thirty minutes after a block the patient says he still feels pain, but he is anxious and tearful. Which assessment is preferred to decide whether the block has failed?","o":["The patient's report of pain on its own, whatever his anxiety or his previous experience","The pulse rate recorded at the time of the assessment","The time since injection on its own, without examining the patient","The surgeon's impression of the patient's mood during the case","Strength in the target muscles and loss of cold sensation against a control site"],"k":4,"e":"Patient-reported pain may reflect fear or numbness rather than true pain, so use strength, loss of cold sensation against a control site and, for truncal blocks, the ability to cough and take an incentive breath."},{"c":17,"id":"Q17-02","s":"17.1 Block Failure and Rescue Strategies","q":"After an axillary block, the hand is numb but the lateral forearm is not. Which rescue is favored?","o":["Repeat the whole axillary block with the same volume of the same drug at the same site","Convert to general anesthesia without any further assessment of how the block has worked or why","Give a large intravenous opioid dose to cover the whole of the unblocked territory","Block the spared nerve alone with a small distal volume","Inject the same site again with a stronger concentration of the same long-acting drug"],"k":3,"e":"A partial failure means the first dose was in the correct plane and one nerve was missed, as with the musculocutaneous nerve. A small, distal, single-nerve block is the rescue, and the cumulative dose is counted."},{"c":17,"id":"Q17-03","s":"17.1 Block Failure and Rescue Strategies","q":"Which type of block is described as a potentially safer rescue option after failed truncal analgesia?","o":["A repeat paravertebral injection at the same level as the first, with a larger volume","A repeat epidural top-up at the same level as the block that failed to work","A blind intercostal injection given without any imaging guidance at all","Intravenous regional anesthesia given with a double tourniquet cuff in place","Plane blocks such as transversus abdominis plane or rectus sheath"],"k":4,"e":"Plane blocks are described as potentially safer rescue options for failed truncal analgesia."},{"c":17,"id":"Q17-04","s":"17.1 Block Failure and Rescue Strategies","q":"A supraclavicular block has partly failed and the patient is uncomfortable. Which approach may reach the cords as a rescue?","o":["A repeat supraclavicular injection with a larger volume","An infraclavicular approach, which may reach the cords after a supraclavicular attempt","An interscalene block on the same side","A Bier block","A wrist block alone"],"k":1,"e":"After a supraclavicular attempt, an infraclavicular approach may reach the cords, and individual forearm nerve blocks rescue a patchy distal block."},{"c":17,"id":"Q17-05","s":"17.1 Block Failure and Rescue Strategies","q":"A rescue is needed after a failed block and an opioid will be used. What is advised?","o":["A long-acting opioid so that one dose suffices for the rest of the case","Short-acting fentanyl, and write the rescue down","No note, so the procedure record stays short and unchanged","An opioid given only after the surgeon has left the operating room","A benzodiazepine alone, with the rescue left unrecorded afterward"],"k":1,"e":"Short-acting fentanyl is advised if an opioid is needed, with confirmed monitoring and assistance and a written note so the next anesthesiologist knows what was given."},{"c":17,"id":"Q17-06","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"A multicenter Australian and New Zealand registry of 25,336 peripheral nerve blocks reported toxicity at what rate, and what was associated with a lower rate?","o":["0.87 per 1,000 blocks, with ultrasound guidance associated with a lower rate","8.7 per 1,000 blocks, with nerve stimulation associated with a lower rate of the injury","0.087 per 1,000 blocks, with no association with technique","0.87 per 1,000 blocks, with ultrasound associated with a higher rate","27 per 1,000 blocks, with catheters associated with a lower rate"],"k":0,"e":"The registry found 22 episodes in 25,336 blocks, or 0.87 per 1,000. The site of injection, drug, dose per weight and the patient's weight predicted toxicity."},{"c":17,"id":"Q17-07","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"In the review of 47 case reports of toxicity published between 2014 and 2016, which block type accounted for the largest share at 23% of cases?","o":["Interscalene block","Femoral block","Spinal anesthesia","Sciatic block","Penile block"],"k":4,"e":"Penile blocks accounted for 23% of cases and local infiltration for 17%. Twenty-two patients (47%) received lipid emulsion and two (4.3%) died."},{"c":17,"id":"Q17-08","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"A patient on a ward develops confusion and perioral numbness many hours after an infusion through a nerve catheter was started. What is known about toxicity timing?","o":["Toxicity occurs only within the first five minutes after any single injection","Toxicity cannot occur with catheters because the doses delivered are always small","Toxicity occurs only with single-shot blocks and never with continuous infusions","Toxicity can occur hours or days after a catheter or infusion starts, often without anyone linking it to the drug","Toxicity always begins with a cardiac arrest and with no earlier signs at all"],"k":3,"e":"Late toxicity from catheters and infusions is often missed because the link to the drug is not made, so ward staff must be told what to look for."},{"c":17,"id":"Q17-09","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"A sedated patient has a sudden arrhythmia and hypotension ten minutes after a large-volume block, with no seizure. Why might the central nervous system signs be absent?","o":["General anesthesia or heavy sedation masks the early central nervous system signs of toxicity","Toxicity never causes central nervous system signs in any patient","The block was too small to cause any toxicity of the heart","Lipid emulsion had already been given and had hidden the signs","Seizures occur only when the drug involved is bupivacaine alone, and never with ropivacaine"],"k":0,"e":"Many cases with cardiovascular signs only occurred in patients under general anesthesia or heavy sedation, where the early central nervous system signs are masked."},{"c":17,"id":"Q17-10","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"A conscious patient reports ringing in the ears, a metallic taste and numbness around the mouth after a block. What is the most likely cause?","o":["Early local anesthetic systemic toxicity, from rising blood levels of the drug","A vasovagal reaction after the injection","Anaphylaxis to latex in the gloves","A hypoglycemic episode in a fasting patient","A delayed pneumothorax after the block"],"k":0,"e":"Ringing in the ears, a metallic taste, confusion and numbness around the mouth are the early signs of toxicity."},{"c":17,"id":"Q17-11","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"A patient received liposomal bupivacaine earlier. What warning applies to its use with other local anesthetics?","o":["Blood levels fall to zero within one hour of the original injection being given","The formulation is free of any systemic toxicity risk, whatever else is given afterward and however soon after","Giving another agent always lowers the free bupivacaine level in the blood","Another local anesthetic within 20 minutes may raise free bupivacaine; levels can persist for 96 hours or longer","Blood levels persist for no more than six hours, so no extra monitoring is needed"],"k":3,"e":"Liposomal bupivacaine has shown a safety signal in a reporting-system analysis. Its blood levels persist for about 96 hours after local infiltration and about 120 hours after interscalene block, so other local anesthetics given soon afterward can add to the free bupivacaine."},{"c":17,"id":"Q17-12","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"An 80-kg adult has a cardiac arrest from local anesthetic toxicity. According to the 2020 ASRA checklist , what is the initial lipid emulsion 20% regimen?","o":["A bolus of about 1.5 mL/kg over 2 to 3 minutes, then about 0.25 mL/kg/min","A bolus of about 250 mL over 2 minutes, then about 100 mL over 15 minutes, repeated twice","A bolus of about 100 mL over 2 to 3 minutes, then about 250 mL over 15 to 20 minutes","A bolus of about 12 mL/kg, then about 0.25 mL/kg/min","A bolus of about 50 mL, then a stop"],"k":2,"e":"For a patient over 70 kg the checklist gives a bolus of about 100 mL over 2 to 3 minutes followed by about 250 mL over 15 to 20 minutes. The weight-based regimen is for patients under 70 kg."},{"c":17,"id":"Q17-13","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"A 55-kg adult develops signs of local anesthetic toxicity with cardiovascular instability. According to the 2020 ASRA checklist , the initial lipid emulsion 20% regimen is:","o":["A bolus of about 100 mL over 2 to 3 minutes, then about 250 mL over 15 to 20 minutes","A bolus of about 15 mL/kg, then about 2.5 mL/kg/min","A bolus of about 0.15 mL/kg, then about 0.025 mL/kg/min","An infusion at about 0.25 mL/kg/min without a bolus","A bolus of about 1.5 mL/kg over 2 to 3 minutes, then about 0.25 mL/kg/min"],"k":4,"e":"For a patient under 70 kg the checklist gives about 1.5 mL/kg over 2 to 3 minutes, then about 0.25 mL/kg/min, and suggests considering a pump under 40 kg."},{"c":17,"id":"Q17-14","s":"17.2 Local Anesthetic Systemic Toxicity: Recognition and Treatment","q":"The patient has been stabilized after lipid emulsion. According to the 2020 checklist , how long should lipid continue and what is the ceiling?","o":["At least 10 minutes after stability, with a maximum of about 12 mL/kg","At least 15 minutes after stability, with a maximum of about 5 mL/kg","At least 15 minutes after stability, with a maximum of about 12 mL
