<title>Regional Anesthesia Practice Handbook: Bonus Question Bank</title>
<style>
:root{--w:#5A3A22;--o:#5C6B14;--ot:#F0F2DA;--p:#FBF6DC;--r:#C84406;--g:#5F6458}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#222;font:17px/1.45 Georgia,'Times New Roman',serif}
header{background:var(--w);color:#fff;padding:18px 16px}
header h1{margin:0;font:700 22px/1.2 Calibri,Carlito,Arial,sans-serif}
header p{margin:4px 0 0;font:15px Calibri,Carlito,Arial,sans-serif;color:var(--ot)}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font:700 20px Calibri,Carlito,Arial,sans-serif;color:var(--w);border-bottom:2px solid var(--o);padding-bottom:4px;margin:20px 0 10px}
button{font:600 16px Calibri,Carlito,Arial,sans-serif;cursor:pointer;border-radius:6px;border:1.5px solid var(--o);background:#fff;color:var(--w);padding:10px 14px;min-height:44px}
button.primary{background:var(--o);color:#fff}
button:disabled{opacity:.45;cursor:default}.opt:disabled{opacity:1;color:#222}.opt.right:disabled,.opt.wrong:disabled{opacity:1}
button:focus-visible,a:focus-visible{outline:3px solid var(--r);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.modes button{flex:1 1 220px}
.chs{list-style:none;padding:0;margin:0}
.chs li{display:flex;gap:8px;align-items:stretch;margin:0 0 8px}
.chs .name{flex:1;text-align:left;background:var(--ot)}
.chs .name span{color:var(--g);font-weight:400}
.chs .rnd{flex:0 0 auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font:600 15px Calibri,Carlito,Arial,sans-serif;color:var(--g);margin-bottom:8px}
.tag{font:14px Calibri,Carlito,Arial,sans-serif;color:var(--o)}
.stem{font-size:18px;margin:8px 0 14px}
.opts{list-style:none;padding:0;margin:0}
.opts li{margin:0 0 8px}
.opt{display:flex;width:100%;text-align:left;gap:10px;align-items:flex-start;font:17px/1.35 Georgia,serif;font-weight:400;background:#fff}
.opt .l{flex:0 0 26px;font:700 16px Calibri,Carlito,Arial,sans-serif;color:var(--w)}
.opt.sel{background:var(--p);border-color:var(--w)}
.opt.right{background:var(--ot);border:2px solid var(--o)}
.opt.wrong{background:#fff;border:2px solid var(--r)}
.opt.right .l::after{content:" ✓"}
.opt.wrong .l::after{content:" ✗"}
.exp{background:var(--p);border:1.5px solid var(--w);border-radius:6px;padding:12px 14px;margin:14px 0}
.exp h3{margin:0 0 6px;font:700 16px Calibri,Carlito,Arial,sans-serif;color:var(--w)}
.verdict{font:700 16px Calibri,Carlito,Arial,sans-serif;margin-bottom:6px}
.verdict.ok{color:var(--o)}.verdict.no{color:var(--r)}
.hidden{display:none}
.score{background:var(--ot);border:1.5px solid var(--o);border-radius:6px;padding:10px 14px;margin:10px 0}
table{border-collapse:collapse;width:100%;font:15px Calibri,Carlito,Arial,sans-serif}
th{background:var(--o);color:#fff;text-align:left;padding:5px 8px}td{padding:5px 8px;border-bottom:1px solid #d6d9bd}
footer{max-width:760px;margin:24px auto 30px;padding:0 16px;font:13px Calibri,Carlito,Arial,sans-serif;color:var(--g)}
@media(max-width:480px){body{font-size:16px}.stem{font-size:17px}}
</style></head><body>

<script type="application/json" id="payload">{"titles":{"1":"Planning a Regional Anesthetic","2":"Local Anesthetic Pharmacology","3":"Ultrasound, Nerve Stimulation, and Needle Technique","4":"Safety, Anticoagulation, and Nerve Injury","5":"Brachial Plexus Anatomy and the Shoulder Blocks","6":"Infraclavicular, Axillary, and Distal Upper Limb Blocks","7":"Head, Neck, and Airway Blocks","8":"Lumbar Plexus and Hip Blocks","9":"Sciatic, Popliteal, and Foot and Ankle Blocks","10":"Thoracic Wall and Chest Blocks","11":"Abdominal Wall and Fascial Plane Blocks","12":"Spinal, Epidural, and Combined Spinal-Epidural Anesthesia","13":"Caudal, Thoracic, and Cervical Epidurals and Neuraxial Complications","14":"Catheters, Infusions, and Adjuncts","15":"Regional Anesthesia for Enhanced Recovery and Multimodal Analgesia","16":"Special Populations","17":"Complications and Crisis Management"},"q":[{"c":1,"id":"1.","s":"Ch 1, Section 1.1","q":"A 71-year-old woman with a hip fracture is anxious about a nerve block. She nods when you describe the risks but cannot say what the block will feel like when it wears off. Which approach best checks her understanding?","o":["Ask her to say back in her own words what will happen and what the main risks are","Ask her to sign the form now and offer to explain the details afterward if she asks","Repeat the full list of risks more slowly and then ask whether she has any questions","Accept the nod, since she did not object","Ask the nurse to confirm that she understood"],"k":0,"e":"Patients often believe they understand more than they do, so a nod is not enough. Teach-back, in which the patient says the plan and risks in their own words, is the way to check understanding. It also suits patients with limited health literacy."},{"c":1,"id":"2.","s":"Ch 1, Section 1.1","q":"A preoperative clinic note says a patient \"understood the block.\" Which set lists the elements used to judge whether the patient has capacity to consent?","o":["Age, language, education and signature","Understanding, signature, witness and date, with a second clinician countersigning","Risk tolerance, cost, convenience and preference","Understanding, appreciating risks and benefits, reasoning, and communicating a choice","Agreement with the anesthetist, a calm manner, prior surgical experience and a named surrogate"],"k":3,"e":"Capacity is judged by whether the patient can understand the information, appreciate how it applies to them, reason about the options and communicate a choice. A signature or a calm manner does not establish capacity."},{"c":1,"id":"3.","s":"Ch 1, Section 1.1","q":"A 66-year-old man scheduled for knee replacement asks why he should have a block instead of just a general anesthetic. Which statement is best supported by the evidence reviewed for hip fracture?","o":["Blocks reduce six-month mortality with high certainty, and they also reduce myocardial infarction in the pooled trials","Blocks have been shown to prevent myocardial infarction, and they also shorten the time to first mobilization by a day","Blocks reduce pain on movement and probably delirium, but effects on infarction and six-month mortality are unclear","Blocks have no effect on any outcome","Blocks reduce delirium but increase pneumonia"],"k":2,"e":"In the Cochrane review of 49 trials and 3,061 participants, blocks reduced pain on movement and delirium and probably reduced pneumonia. No clear effect was found on myocardial infarction or six-month mortality, and the certainty for those outcomes was low."},{"c":1,"id":"4.","s":"Ch 1, Section 1.1","q":"In the Cochrane review of nerve blocks for hip fracture, which outcome shortened by about 10.8 hours was rated moderate certainty?","o":["Length of hospital stay","Time to first mobilization","Time to surgery","Duration of delirium","Time to first opioid request"],"k":1,"e":"Blocks probably shortened the time to first mobilization by about 10.8 hours. Pain on movement and acute confusion were the outcomes rated high certainty."},{"c":1,"id":"5.","s":"Ch 1, Section 1.2","q":"A 58-year-old woman is being consented in the anesthetic room for an interscalene block on the morning of surgery. She says nobody has mentioned a block before. What does United Kingdom guidance say about this timing?","o":["It is the preferred time because the anesthetist is present","It is acceptable routinely if the patient is calm, because the patient can still decline at that point and no delay results","It is required by law to repeat consent on the day","It is acceptable only for neuraxial blocks","Consent in the anesthetic room should be exceptional; discuss the block before the day of surgery when possible"],"k":4,"e":"The Royal College of Anaesthetists guidance allows consent to be taken earlier, for example at preoperative assessment, and treats consent in the anesthetic room as exceptional. The day of surgery should confirm a decision already discussed."},{"c":1,"id":"6.","s":"Ch 1, Section 1.2","q":"A 45-year-old man with several rib fractures is offered an erector spinae block as the only procedure. Under United Kingdom guidance, what consent is expected?","o":["Verbal consent only, recorded in the anesthetic notes by the clinician doing the block","Separate written consent, because the block is the only procedure","No consent, because it is analgesia","Consent from the surgeon alone","Consent only if a catheter is placed"],"k":1,"e":"Separate written consent for a block is not needed when the block helps surgery, but it is needed when the block is the only procedure, for example for rib fractures."},{"c":1,"id":"7.","s":"Ch 1, Section 1.2","q":"After a sciatic block a nurse asks what should have been recorded in the notes. Which set best matches the guidance?","o":["The block and the time only","The surgeon's name and the operation","Only the volume of local anesthetic","Only complications, if any occurred, together with the surgeon's name, the operation and the time of the procedure","The block, side, approach, guidance, local anesthetic and volume, any difficulty, and the patient's condition"],"k":4,"e":"Document the block promptly and clearly, including the side, approach, guidance, drug and volume, any difficulty and the patient's condition. A record written later from memory is a weak record."},{"c":1,"id":"8.","s":"Ch 1, Section 1.2","q":"In a ten-year review of a large health system, what was the approximate rate of wrong-site nerve blocks, and what happened after time-outs were introduced?","o":["About 1 per 100 blocks, and they stopped","About 1 per 1,000,000 blocks, and they stopped","About 1 per 10,000 blocks, and wrong-site blocks continued","About 1 per 500 blocks, and they fell by half after the checklist was introduced","About 1 per 10,000 blocks, and they disappeared after the checklist was introduced"],"k":2,"e":"Wrong-site blocks occurred at about 1 per 10,000 nerve blocks and persisted after time-out procedures were adopted. This is why the stop must happen at the moment of injection and involve the patient."},{"c":1,"id":"9.","s":"Ch 1, Section 1.2","q":"A 63-year-old man is booked for ankle surgery with a popliteal block and a saphenous block. The first block is placed correctly after a time-out. While the team handles a fall in oxygen saturation, the second block is placed on the other leg. Which feature of this case most strongly predicts the error?","o":["A second block, a change of position, and a distraction together","Use of ultrasound guidance, which shows the nerve but not which side is operated on","A clear surgical site mark","Light sedation","A long preoperative discussion held in the clinic a week before surgery"],"k":0,"e":"A second block, a change of position and a distraction are the conditions in which the check is skipped. In the investigation's index case, the check was done for the first block and not for the second."},{"c":1,"id":"10.","s":"Ch 1, Section 1.2","q":"Which is the final step of the nine-step ASRA checklist for performing a regional nerve block?","o":["Document the block in the anesthetic record once the block has been completed","Confirm allergies","Apply sterile gloves","A time-out before needle insertion for each block site","Label the syringes"],"k":3,"e":"The checklist ends with a time-out before needle insertion for each new block site, especially if the position changed, time has passed or a different team is involved."},{"c":1,"id":"11.","s":"Ch 1, Section 1.2","q":"A patient is awake for a lower limb block. Following the United Kingdom \"Stop Before You Block\" approach, what is the best way to confirm the side immediately before the needle goes in?","o":["Ask the patient which side is being operated on, and check the mark","Rely on the ward nurse's handover and the side written on the theatre list","Check only the consent form","Ask the surgeon by phone","Use the side recorded at sign-in"],"k":0,"e":"If the patient is awake, ask which side is being operated on. If the patient is not awake, check the side on the consent form. Any member of the team may call the stop."},{"c":1,"id":"12.","s":"Ch 1, Section 1.2","q":"Before a lower limb block you cannot see the surgical arrow because the patient is covered with warming blankets. What is the best action?","o":["Proceed using the side in the schedule, because the schedule was checked at booking","Mark the side yourself from memory","Look for the mark again, and check the consent form if the patient is not awake","Ask the patient to guess which leg","Proceed and check afterward"],"k":2,"e":"For lower limb blocks the mark may be hard to see, and blankets can hide it. Look again just before the block. The stop is a second check at the bedside."},{"c":1,"id":"13.","s":"Ch 1, Section 1.3","q":"A new block area is being equipped. Which statement about NRFit connectors is correct?","o":["They are used only for intravenous lines and are identified by a blue color code in every hospital","They are optional in the United Kingdom","They prevent all wrong-site blocks","They make it harder to connect to an incompatible line, and regional equipment is marked yellow","They are required only for neuraxial anesthesia in children, where the risk of error is highest"],"k":3,"e":"NRFit connectors follow ISO 80369-6 and make wrong-route connections less likely. Regional equipment is colored yellow with a sticker near the patient end of the line."},{"c":1,"id":"14.","s":"Ch 1, Section 1.3","q":"NHS England required providers to complete the transition to NRFit connectors by which date?","o":["31 January 2020","31 January 2025","1 July 2022","31 December 2023","1 January 2027"],"k":1,"e":"NHS England required the transition by 31 January 2025, with documented exceptions where no NRFit product exists."},{"c":1,"id":"15.","s":"Ch 1, Section 1.3","q":"A resident asks what must be immediately accessible wherever local anesthetics are given. Which answer matches United Kingdom guidance for regional anesthesia services?","o":["A blood warmer in each block bay and an infusion pump","A second ultrasound machine for each bay in the unit","A cardiac surgeon","A ventilator in each bay","Lipid emulsion and a written toxicity protocol"],"k":4,"e":"Lipid emulsion must be immediately accessible wherever local anesthetics are given, along with emergency equipment and a defibrillator."},{"c":1,"id":"16.","s":"Ch 1, Section 1.3","q":"During a nerve block under light sedation, how often does the ASA standard require blood pressure and heart rate to be evaluated?","o":["Every minute","Every 15 minutes","Only before and after the block","At least every five minutes","Only if the patient is hypotensive"],"k":3,"e":"The ASA standard for basic anesthetic monitoring requires blood pressure and heart rate at least every five minutes for all anesthetics, with continuous ECG."},{"c":1,"id":"17.","s":"Ch 1, Section 1.3","q":"A patient receiving moderate sedation for a block is breathing spontaneously. Which addition to ventilation monitoring does the ASA standard call for where possible?","o":["Continuous exhaled carbon dioxide monitoring with clinical observation","No change, since clinical observation by the nurse is enough in a block bay","Arterial blood gas every ten minutes","Chest radiograph","Peak flow measurement"],"k":0,"e":"With moderate or deep sedation, clinical observation is supplemented by continuous exhaled carbon dioxide monitoring where possible. Qualitative observation is enough with minimal or no sedation."},{"c":1,"id":"18.","s":"Ch 1, Section 1.3","q":"After a block is placed in the operating theater under the 2025 United Kingdom guidance, what is expected of the anesthetist?","o":["Leave immediately to start the next case, and ask a colleague to cover the block bay if needed","Remain at the bedside for two hours","Be contactable within one hour","No specific expectation is stated","Be immediately available for the first 15 minutes, and then contactable within two minutes"],"k":4,"e":"The guidance asks for immediate availability for the first 15 minutes, then contactability and ability to attend within two minutes for the rest of the procedure."},{"c":1,"id":"19.","s":"Ch 1, Section 1.3","q":"A patient in the emergency department has a fascia iliaca block. According to the 2025 United Kingdom guidance, how long should the patient be monitored?","o":["Fifteen minutes","Six hours, whatever the type of block and the patient","At least one hour after the block","Until the block has fully resolved and sensation has returned","No monitoring is required"],"k":2,"e":"Patients in an emergency department should be monitored for at least one hour after a fascial plane or peripheral nerve block, by staff who can recognize the signs of local anesthetic toxicity."},{"c":1,"id":"20.","s":"Ch 1, Section 1.4","q":"A patient answers when you speak to her but responds to a light touch on the shoulder only when you also call her name, and her airway and breathing are unaffected. Which level of sedation is this?","o":["Minimal sedation","Moderate sedation","Deep sedation","General anesthesia","Anxiolysis only"],"k":1,"e":"Moderate sedation is a purposeful response to verbal or light tactile stimulation, with no airway intervention needed and adequate spontaneous breathing. Deep sedation needs repeated or painful stimulation."},{"c":1,"id":"21.","s":"Ch 1, Section 1.4","q":"You are giving moderate sedation for a block and the patient becomes difficult to rouse and her breathing slows. What is the standard that applies?","o":["Continue the block, since the patient is asleep and still","Stop all monitoring to avoid disturbing the patient, and restart it once the block procedure has finished","Only a different clinician may rescue the patient, so call that clinician and wait outside the room until they arrive","You must be able to rescue a patient who slips to deep sedation, and should not continue at the unintended depth","Sedation depth does not matter for blocks"],"k":3,"e":"Whoever gives moderate sedation must be able to rescue a patient who slips into deep sedation. Rescue means correcting the physiologic problem and returning to the intended level."},{"c":1,"id":"22.","s":"Ch 1, Section 1.4","q":"In a prospective series of 21,278 blocks, four radiculopathies occurred, all in patients who reported paresthesia during needle puncture. About how often is this per 10,000 blocks?","o":["About 19","About 0.19","About 4","About 190","About 1.9"],"k":4,"e":"Four radiculopathies in 21,278 blocks is about 1.9 per 10,000. The reassuring rate does not remove the principle that an anesthetized patient cannot warn of an impending injury."},{"c":1,"id":"23.","s":"Ch 1, Section 1.5","q":"In the REGAIN trial of 1,600 older patients having hip fracture surgery, which was the primary outcome?","o":["Death or inability to walk about 10 feet at 60 days","Delirium in hospital during the first week after surgery","Death at one year after discharge from hospital","Length of stay","Pain at 24 hours"],"k":0,"e":"The primary outcome was a composite of death or inability to walk about 10 feet at 60 days, 18.5% with spinal and 18.0% with general anesthesia, with a relative risk of 1.03 and a confidence interval of 0.84 to 1.27."},{"c":1,"id":"24.","s":"Ch 1, Section 1.6","q":"A department wants to start a block room. A meta-analysis of 15 studies of parallel processing found that anesthesia-controlled time fell by 10.4 minutes. How should the result be interpreted?","o":["The benefit is certain and large","The direction of benefit was consistent, but the gain is uncertain because every study had a moderate to critical risk of bias","The studies were all randomized and unbiased, so the estimate of the gain is precise and can be applied to any block in any patient group","Recovery unit stay did not change","The gain was shown only for peripheral blocks in children"],"k":1,"e":"The review of 8,888 patients found shorter anesthesia-controlled time, turnover and recovery stay. Because all included studies carried a moderate to critical risk of bias, the size of the gain remains uncertain."},{"c":1,"id":"25.","s":"Ch 1, Section 1.2","q":"You audit your department's block-room practice. Surveys of anesthetists elsewhere found that more than 90% said they did a \"Stop Before You Block\" check. Which finding from those surveys should concern you most about how the check is done?","o":["Most of those who said they did the check did not write it in the notes afterward","Fewer than half of the anesthetists asked the patient to say the side, even when the patient was awake","The check was done more often for second blocks than for first blocks, and it was usually skipped in recovery","Nearly all of the anesthetists who did the check did it only when a surgical mark was visible on the skin","About four in ten did the check too early for it to work as a true stop before the injection"],"k":4,"e":"In the surveys, 41% did the check too early to serve as the final stop. A check done in the holding area or in the corridor cannot catch a change of side that happens afterward. The other options describe habits that sound plausible but are not what the surveys reported. Do the final check at the bedside with the needle in your hand."},{"c":1,"id":"26.","s":"Ch 1, Section 1.2","q":"A patient has a right-sided block placed in the supine position and is then turned to the lateral position for a second block on the other side while the room is busy. Which set of conditions describes the situation in which a wrong-site block tends to happen?","o":["A change of position, a second block and a distraction","A first block, a sedated patient and a missing consent form","A language barrier, a mark on the wrong limb and a new assistant","A long list, an urgent add-on case and a surgeon who has already scrubbed","A catheter technique, a second needle and a patient who asks about the side"],"k":0,"e":"The three conditions are a change of position, a second block and a distraction. Each one breaks the sequence in which the side was first confirmed. The other options list factors that matter for other safety problems, but they are not the pattern reported for wrong-site blocks. Repeat the full time-out for every new site, especially after the patient has been turned."},{"c":1,"id":"27.","s":"Ch 1, Section 1.4","q":"A surgeon asks you to place interscalene blocks after induction of general anesthesia in all of his shoulder patients, to save time in the block room. What does the 2015 ASRA advisory on neurologic complications advise?","o":["Place all upper-limb blocks after induction, because an anesthetized patient cannot move and the needle is safer","Place the block after induction only if you use a nerve stimulator and keep the current above 1 mA, since the stimulator replaces the patient's warning","Place blocks under deep sedation in adults as routine, but never place them under general anesthesia in children","Place the block after induction whenever the surgeon requests it, with consent from the surgeon","Do not routinely place blocks in anesthetized or deeply sedated adults, and place neuraxial procedures in them only rarely"],"k":4,"e":"The advisory advises against routinely placing regional blocks in anesthetized or deeply sedated adults, and says neuraxial or interventional procedures should be performed only rarely in adults whose sensorium is compromised. The principle is nonmaleficence: an anesthetized patient cannot warn of an impending injury. Pediatric blocks under general anesthesia are the exception, and they are considered standard of care."},{"c":1,"id":"28.","s":"Ch 1, Section 1.4","q":"A colleague quotes a French pediatric study of 29,870 general anesthetics with regional blocks to argue that central blocks are no riskier than peripheral ones. What did the study actually report?","o":["A complication rate of 12%, usually severe, with central blocks about the same as peripheral blocks","A complication rate of 0.12%, usually minor, with central blocks about six times higher than peripheral blocks","A complication rate of 0.12%, usually permanent, with peripheral blocks about six times higher than central blocks","A complication rate of 0.66%, always without sequelae, with no difference between central and peripheral blocks","A complication rate of 6%, usually minor, with central blocks about half as common as peripheral blocks"],"k":1,"e":"The French study found a complication rate of 0.12%, with complications usually minor and without sequelae, and central blocks had a rate about six times higher than peripheral blocks. The joint ESRA and ASRA advisory, by contrast, put the overall complication risk at about 0.66% and called pediatric blocks under general anesthesia or deep sedation standard of care. Read the two figures as coming from different studies."},{"c":2,"id":"1.","s":"Ch 2, Section 2.1","q":"A 40-year-old man has a local anesthetic injected into an area of infected tissue. A colleague explains that the drug works from inside the nerve. Which form of the drug binds the sodium channel from inside the cell?","o":["The unionized form","Both equally, from outside","Only the protein-bound form","Only the ester metabolite","The ionized form"],"k":4,"e":"Local anesthetics are weak bases. The unionized form crosses the membrane, and the ionized form is thought to bind the sodium channel from inside the cell and keep it inactive."},{"c":2,"id":"2.","s":"Ch 2, Section 2.1","q":"After a spinal anesthetic, a patient can feel pressure on the thigh but no pain or cold. Which principle best explains this?","o":["Large fibers are always blocked first, so motor power is lost before pain and temperature sensation","Pressure fibers are blocked by lower concentrations than pain fibers, which is why numbness precedes touch loss","Touch is carried only by motor nerves","Small myelinated fibers are blocked more readily, so pain and temperature go before touch and motor tone","The block has worn off completely"],"k":3,"e":"Small and myelinated fibers are blocked more readily. Pain and temperature are lost before touch, proprioception and motor tone, which is why surgical anesthesia needs more drug and time than analgesia."},{"c":2,"id":"3.","s":"Ch 2, Section 2.1","q":"Which property of a local anesthetic mainly determines its duration of action?","o":["Protein binding","pKa","Molecular color","Lipid solubility alone","Presence of an ester linkage"],"k":0,"e":"Duration follows protein binding. Onset follows the unionized fraction and potency follows lipid solubility."},{"c":2,"id":"4.","s":"Ch 2, Section 2.1","q":"Approximately how does the potency of bupivacaine compare with that of lidocaine?","o":["Bupivacaine is half as potent","They are equally potent","Bupivacaine is roughly four times as potent","Bupivacaine is about 40 times as potent","Bupivacaine is less potent but lasts longer"],"k":2,"e":"Higher lipid solubility means greater potency, and bupivacaine is roughly four times as potent as lidocaine."},{"c":2,"id":"5.","s":"Ch 2, Section 2.1","q":"Which of the following lists the protein binding of the three agents from highest to lowest?","o":["Procaine about 95%, lidocaine about 65%, bupivacaine about 6%","Bupivacaine about 95%, lidocaine about 65%, procaine about 6%","Lidocaine about 95%, bupivacaine about 65%, procaine about 6%","Bupivacaine about 65%, lidocaine about 95%, procaine about 6%","All three about 65%"],"k":1,"e":"Bupivacaine is about 95% protein bound, lidocaine about 65% and procaine about 6%. Heavy binding lengthens duration and makes bupivacaine toxicity harder to treat."},{"c":2,"id":"6.","s":"Ch 2, Section 2.2","q":"A patient receives a long infusion of an amide agent through a catheter and develops signs of accumulation. Why do amides accumulate more than esters?","o":["Amides are metabolized slowly by the liver, whereas esters are hydrolyzed rapidly by plasma esterases","Amides are excreted unchanged by the kidney","Esters are metabolized mainly by the liver, so hepatic disease prolongs them more than it prolongs amides","Amides are broken down in the blood in minutes","Esters bind tightly to the myocardium"],"k":0,"e":"Esters are broken down rapidly by plasma esterases, while amides are metabolized more slowly by liver enzymes and can build up with repeated dosing or infusion, especially when clearance falls."},{"c":2,"id":"7.","s":"Ch 2, Section 2.2","q":"Which ester is the exception because it is hydrolyzed in the liver rather than by plasma esterases?","o":["Procaine","Cocaine","Chloroprocaine","Tetracaine","Benzocaine"],"k":1,"e":"Esters are broken down by plasma esterases, but cocaine is hydrolyzed in the liver."},{"c":2,"id":"8.","s":"Ch 2, Section 2.2","q":"A 29-year-old woman has a documented immediate reaction after a dental injection of an ester. Why is allergy more of a concern with esters than amides?","o":["Esters contain sulfites","Amides are always more allergenic, because they are metabolized slowly in the liver","Esters accumulate in the liver","Amides are broken down to histamine","Most esters yield para-aminobenzoic acid, linked to allergic reactions"],"k":4,"e":"Most esters are metabolized to para-aminobenzoic acid, which is associated with allergy. Amides only very rarely cause allergy."},{"c":2,"id":"9.","s":"Ch 2, Section 2.2","q":"A pharmacist notes that one family of local anesthetics cannot be autoclaved and is less stable in solution. Which family?","o":["Amides","Both families equally","Esters","Neither family","Only the carbonate salts"],"k":2,"e":"Esters are less stable in solution and cannot be autoclaved. Amides are more stable but are metabolized more slowly by the liver."},{"c":2,"id":"10.","s":"Ch 2, Section 2.3","q":"A surgeon wants a block for a 20-minute procedure that will not outlast the operation by many hours. Which choice follows from the properties of the drugs?","o":["Bupivacaine, because it starts fastest of the amides and lasts longest","Ropivacaine, because it is an ester","Tetracaine, because it is the shortest acting","Lidocaine, which starts faster but is shorter acting","Any amide, because duration depends only on the volume injected"],"k":3,"e":"Lidocaine is faster and shorter than bupivacaine, so choosing lidocaine trades duration for speed and may require a second injection if surgery runs long."},{"c":2,"id":"11.","s":"Ch 2, Section 2.3","q":"You inject a local anesthetic at a highly vascular site and the block is brief with a high peak plasma level. Which principle applies?","o":["Vascular sites prolong blocks, because the drug stays near the nerve for longer in well-perfused tissue","A vascular site clears drug quickly, which shortens the block and raises peak plasma level","Vascular sites lower plasma levels","Vascularity affects only esters","Vascularity has no effect on duration"],"k":1,"e":"Blood flow clears drug. A vascular site shortens the block and raises the peak plasma level, while vasoconstriction with epinephrine slows clearance."},{"c":2,"id":"12.","s":"Ch 2, Section 2.3","q":"In a volunteer study of transversus abdominis plane block with and without epinephrine, what was the effect of epinephrine?","o":["The block lasted twice as long","The peak level doubled, because epinephrine slowed clearance of the drug from the injection site","Epinephrine had no effect on peak level","The peak arterial level of levobupivacaine was lower, though block duration did not change","The block failed more often"],"k":3,"e":"In the small study of 11 volunteers the peak arterial level was lower with epinephrine, but block duration did not change. The study was a conference abstract and is cited for direction only."},{"c":2,"id":"13.","s":"Ch 2, Section 2.4","q":"A meta-analysis of 70 trials in 3,644 patients examined epinephrine added to local anesthetic. For peripheral blocks, what was the approximate prolongation of analgesia?","o":["About 10 minutes","About 4 hours","About an hour","About 12 hours","No prolongation"],"k":2,"e":"Epinephrine lengthened analgesia in peripheral blocks by about 66 minutes, and the authors summarized the benefit as no more than about an hour in either peripheral or intrathecal settings."},{"c":2,"id":"14.","s":"Ch 2, Section 2.4","q":"Which statement about adding epinephrine to a large-volume block is correct?","o":["It lowers the peak plasma level of the local anesthetic, a safety benefit in a vascular space","It raises the peak plasma level of the local anesthetic and shortens the duration of the block","It has no effect on plasma levels","It is contraindicated for all peripheral blocks","It shortens the duration of the block"],"k":0,"e":"Epinephrine slows absorption and so lowers the peak plasma level and lengthens the block, which is a safety benefit when injecting a large volume into a vascular space."},{"c":2,"id":"15.","s":"Ch 2, Section 2.4","q":"A meta-analysis of 11 trials in 914 patients compared perineural with systemic dexamethasone. With bupivacaine, about how much longer did analgesia last with the perineural route (in relative terms)?","o":["About 2% longer","About 80% longer","About 210% longer","No difference","About 21% longer"],"k":4,"e":"With bupivacaine the perineural gain was 21%, a mean of 4.0 hours, while with ropivacaine it was 12%, a mean of 2.0 hours, not statistically significant. The overall mean gain was 3 hours."},{"c":2,"id":"16.","s":"Ch 2, Section 2.4","q":"A colleague wants to add dexamethasone to the perineural solution and also give it intravenously. Which comment is most appropriate?","o":["Perineural use is the only licensed route","Intravenous use does most of what perineural use does, and perineural use is off-label","The intravenous route has no effect on block duration, so only perineural use is useful","Both routes together are required","Perineural use is proven to cause nerve injury"],"k":1,"e":"Perineural dexamethasone adds a few hours at the price of off-label use, and the intravenous route does most of the work. No neurological complications or infections were reported in the review."},{"c":2,"id":"17.","s":"Ch 2, Section 2.4","q":"A meta-analysis of clonidine as an adjuvant in peripheral blocks found it prolonged the time to first analgesic request by about 2 hours. What was the main drawback?","o":["Respiratory depression in every patient who receives the drug","Permanent nerve injury","Hypotension and bradycardia, number needed to harm about 10","Cardiac arrest","A shortened block"],"k":2,"e":"Clonidine was associated with hypotension and bradycardia at a number needed to harm of about 10. The review could not establish a dose-response relationship or rule out a systemic effect."},{"c":2,"id":"18.","s":"Ch 2, Section 2.4","q":"What did the meta-analysis of 24 trials comparing dexmedetomidine with clonidine in brachial plexus blocks conclude?","o":["Dexmedetomidine gave longer sensory, motor and analgesic durations, with very high heterogeneity","Clonidine gave longer blocks","The two drugs were identical","Dexmedetomidine was compared with plain local anesthetic in all of the included trials","Bradycardia was clearly higher with dexmedetomidine, and it was the main reason for stopping the infusion"],"k":0,"e":"Dexmedetomidine gave longer durations and higher block quality than clonidine, but heterogeneity was very high. The comparison was against clonidine and not against local anesthetic alone."},{"c":2,"id":"19.","s":"Ch 2, Section 2.4","q":"A 38-year-old healthy man needs a digital block, and a colleague worries that epinephrine will cause digital necrosis. What does the evidence reviewed for infraclavicular, axillary and distal upper limb blocks show?","o":["Epinephrine causes necrosis in most patients","Epinephrine is contraindicated in every digital block because of the risk of ischemia","Epinephrine always shortens the block","Necrosis occurs only with amides","In healthy patients the evidence does not link epinephrine to digital necrosis"],"k":4,"e":"The belief comes from old case reports. In healthy patients the reviewed evidence does not link epinephrine to digital necrosis, though it should be left out when perfusion is already poor."},{"c":2,"id":"20.","s":"Ch 2, Section 2.4","q":"The meta-analysis of epinephrine added to local anesthetic included mostly neuraxial trials. What did the authors conclude about harm in epidural and combined spinal-epidural use?","o":["Epinephrine clearly caused harm","Epinephrine was clearly safe","Harm was greater than in peripheral blocks","There was too little evidence to draw conclusions","Harm was shown only in children"],"k":3,"e":"The review found too little evidence on harm to draw conclusions for epidural and combined spinal-epidural use, while for peripheral and intrathecal use the prolongation was no more than about an hour."},{"c":2,"id":"21.","s":"Ch 2, Section 2.5","q":"A 90-year-old frail patient with heart failure is to receive a block. How should the maximum dose be set?","o":["Directly from the label maximum for a healthy adult, with no adjustment for the block site used","From block-specific ranges adjusted for site, age, organ function and repeat dosing","By body weight alone","By the surgeon's estimate","It does not need adjustment"],"k":1,"e":"A 2004 review concluded that label maximum doses are not evidence-based and that only block-specific ranges adjusted for site, age, organ function and pregnancy can be justified."},{"c":2,"id":"22.","s":"Ch 2, Section 2.5","q":"Which of the following does the 2004 review of maximum recommended doses say about epinephrine?","o":["It must never be used with large doses","It raises the peak plasma level","It replaces the need for dose adjustment","It can be used for large doses when it is not contraindicated","It is required for every block"],"k":3,"e":"The review added that epinephrine can be used with large doses when not contraindicated, and that repeated or continuous doses should be reduced in renal, hepatic or cardiac disease."},{"c":2,"id":"23.","s":"Ch 2, Section 2.5","q":"A catheter infusion is started in a patient with liver disease. Why is this a concern?","o":["Esters are cleared by the liver","Liver disease speeds clearance","Amides are cleared by the liver, so repeated dosing accumulates when clearance falls","Infusions always lower plasma levels because the dose is spread out over a longer time","Hepatic disease protects against toxicity"],"k":2,"e":"Amides are cleared slowly by the liver, so repeated doses or infusions accumulate, and the accumulation is worse in hepatic and cardiac disease where clearance falls."},{"c":2,"id":"24.","s":"Ch 2, Section 2.5","q":"Which injection site sends local anesthetic into the blood most quickly?","o":["A subcutaneous injection","A tendon sheath injection","A sub-Tenon's injection","A sciatic nerve block at the thigh","An intercostal injection"],"k":4,"e":"Uptake is fastest where tissue is vascular. An intercostal or interpleural injection sends drug into the blood quickly, while a tendon sheath or subcutaneous injection does not."},{"c":2,"id":"25.","s":"Ch 2, Section 2.6","q":"A 55-year-old man develops perioral tingling, slurred speech and then a seizure 10 minutes after a large fascial plane block. Which system is usually affected first in systemic toxicity?","o":["The central nervous system","The cardiovascular system","The renal system","The gastrointestinal system","The hepatic system"],"k":0,"e":"The central nervous system usually goes first, with perioral tingling, slurred speech, falling consciousness and seizures, followed by cardiac arrhythmias and reduced contractility."},{"c":2,"id":"26.","s":"Ch 2, Section 2.6","q":"A review of case reports and registries estimated how often systemic toxicity follows peripheral nerve blocks. What was the frequency?","o":["About 27 per 1,000 blocks","About 0.27 per 1,000 blocks","About 2.7 per 100 blocks","About 1 per 10 blocks","About 0.027 per 1,000 blocks"],"k":1,"e":"The review reported 0.27 per 1,000 peripheral nerve blocks from a denominator of 251,325 blocks, and analyzed 47 case reports in which seizure was the most common presenting feature."},{"c":2,"id":"27.","s":"Ch 2, Section 2.6","q":"The 2017 ASRA advisory described a changing picture of systemic toxicity. Which statement is consistent with it?","o":["Ultrasound guidance is associated with fewer intravascular injections, and presentation seems later than in older reports","Ultrasound guidance has increased intravascular injection, and toxicity now presents earlier and more severely than in older reports","Toxicity now presents earlier","Toxicity occurs only in hospital","Small patients are at lower risk"],"k":0,"e":"Ultrasound guidance is associated with fewer intravascular injections. Local infiltration and infusions are linked to slower uptake and later presentation, and more events occur outside traditional hospital settings. Small size and sarcopenia raise risk."},{"c":2,"id":"28.","s":"Ch 2, Section 2.6","q":"During treatment of systemic toxicity with cardiac arrest, which approach differs from standard cardiac life support?","o":["Use vasopressin as the first vasopressor","Give lidocaine for ventricular arrhythmia, because it is the standard first antiarrhythmic in cardiac arrest","Use reduced epinephrine doses and avoid vasopressin, calcium channel blockers, beta-blockers and lidocaine","Use larger doses of epinephrine","Give a calcium channel blocker for arrhythmia"],"k":2,"e":"The 2020 ASRA checklist prefers smaller doses of epinephrine and avoids local anesthetics, beta-blockers, calcium channel blockers and vasopressin. A benzodiazepine is the preferred seizure drug."},{"c":2,"id":"29.","s":"Ch 2, Section 2.6","q":"How is a patient best observed after treatment of systemic toxicity?","o":["For the same short period in every case","Not at all, after lipid emulsion","Only if the patient requests it","For a longer period after cardiovascular instability than after a seizure alone","For a shorter period after cardiovascular instability"],"k":3,"e":"The checklist advises observation for a period that depends on what happened, longer after cardiovascular instability than after a seizure."},{"c":2,"id":"30.","s":"Ch 2, Section 2.6","q":"Which statement about the mechanism of lipid emulsion in systemic toxicity is best supported?","o":["It works only as a sink","It acts as a sodium channel agonist","It is a licensed treatment for local anesthetic toxicity in every country, and it acts only by binding drug in the plasma compartment","It works only by chelation","It is multimodal: a scavenging effect moves drug away from vulnerable organs, and other effects improve contractility"],"k":4,"e":"A 2018 review described a multimodal action: a scavenging effect (the lipid shuttle) and non-scavenging effects including protection during recovery and increased contractility and vascular tone. Lipid emulsion for this use is off-label."},{"c":2,"id":"31.","s":"Ch 2, Section 2.6","q":"A reviewer notes that most reported reactions to local anesthetics are not true allergy. What is the first and most important step in evaluating a labeled allergy?","o":["A detailed history","Immediate intravenous challenge","Patch testing in every case","Avoiding all local anesthetics permanently","Measuring methemoglobin"],"k":0,"e":"True IgE-mediated allergy accounts for less than 1% of reactions, and most are non-allergic or due to preservatives or other culprits. Testing follows a history that suggests hypersensitivity."},{"c":2,"id":"32.","s":"Ch 2, Section 2.6","q":"A 25-year-old woman develops hives and wheeze within minutes of a local anesthetic injection. After recovery, which testing sequence fits an immediate hypersensitivity reaction?","o":["Patch testing alone","Serum lidocaine level","Skin prick and intradermal testing followed by graded challenge","No testing, only lifelong avoidance of all local anesthetics and all drugs of related structure","Methylene blue challenge"],"k":2,"e":"A reaction that suggests immediate hypersensitivity can be investigated with skin prick and intradermal testing followed by graded challenge, and a delayed reaction with patch testing. Mislabeling a patient as allergic leads to unnecessary avoidance."},{"c":2,"id":"33.","s":"Ch 2, Section 2.6","q":"A 30-year-old man has buttock and leg pain the day after a spinal with lidocaine. A network meta-analysis compared agents for this complication. Compared with lidocaine, which agent was associated with less transient neurologic symptoms (moderate certainty)?","o":["Mepivacaine, with a clear reduction","No agent","Only liposomal bupivacaine","Bupivacaine","Only epinephrine"],"k":3,"e":"Compared with lidocaine, transient neurologic symptoms were less frequent with bupivacaine, prilocaine and procaine, all with moderate certainty. Mepivacaine showed no clear difference, with very uncertain evidence."},{"c":2,"id":"34.","s":"Ch 2, Section 2.6","q":"In the network meta-analysis of transient neurologic symptoms, what was the relative risk with bupivacaine compared with lidocaine?","o":["About 1.6","About 0.16","About 16","About 0.9","About 6"],"k":1,"e":"The relative risk of transient neurologic symptoms was 0.16 with bupivacaine, 0.18 with prilocaine and 0.14 with procaine compared with lidocaine, all with moderate certainty."},{"c":2,"id":"35.","s":"Ch 2, Section 2.7","q":"The US label for liposomal bupivacaine lists which peripheral nerve block among its approved uses?","o":["Sciatic nerve block at the popliteal level","Femoral nerve block at the inguinal crease","Thoracic paravertebral block at one level","Caudal block in an adult","Interscalene brachial plexus block"],"k":4,"e":"The 2018 label approves infiltration in adults and interscalene brachial plexus block, and states that safety and efficacy have not been established in other nerve blocks or in patients under 18."},{"c":2,"id":"36.","s":"Ch 2, Section 2.7","q":"A meta-analysis of nine trials in 619 adults assessed perineural liposomal bupivacaine. How is the main result best summarized?","o":["A large clinically important reduction in pain that persisted when the industry-sponsored trial was excluded from the analysis","A statistically significant but clinically unimportant pain reduction that disappeared without the industry-sponsored trial","A large reduction in opioid use","Worse pain at 24 to 72 hours","No data on pain were available"],"k":1,"e":"The area under the pain curve between 24 and 72 hours fell by 1.0 cm.h, below the 2.0 cm.h threshold for clinical importance, and the difference became non-significant without the one industry-sponsored trial. Opioid use did not differ."},{"c":2,"id":"37.","s":"Ch 2, Section 2.7","q":"A later meta-analysis of 27 trials in 2,122 patients, including field blocks, found that liposomal bupivacaine lowered rest pain by about how much at 24 hours?","o":["About 5 points on a 0 to 10 scale at 24 hours after surgery","About 3 points on a 0 to 10 scale at 24 hours after surgery","About 0.9 points on a 0 to 10 scale","About 0.09 points","No difference at all"],"k":2,"e":"Rest pain was lower by 0.9 points at 24 hours and 0.7 points at 48 and 72 hours, with no difference in morphine use and considerable heterogeneity."},{"c":2,"id":"38.","s":"Ch 2, Section 2.1","q":"Lidocaine starts working faster than bupivacaine at body pH. Which pair of facts explains this?","o":["Lidocaine has a pKa of 7.9 and is about a quarter unionized, while bupivacaine has a pKa of 8.1 and is about 15% unionized","Lidocaine has a pKa of 8.1 and is about 15% unionized, while bupivacaine has a pKa of 7.9 and is about a quarter unionized","Lidocaine has a higher protein binding than bupivacaine, so more of it reaches the sodium channel at once","Lidocaine and bupivacaine have the same pKa, and lidocaine is faster only because it is given in a larger volume","Lidocaine is a weak acid and bupivacaine is a weak base, so lidocaine crosses the membrane in its ionized form"],"k":0,"e":"Lidocaine has a pKa of 7.9 and is about a quarter unionized at body pH, while bupivacaine has a pKa of 8.1 and is about 15% unionized. More of the lidocaine can cross the membrane at once, so lidocaine starts faster. The same logic explains why infected tissue, with its low local pH, resists a block: less of the drug is unionized."},{"c":2,"id":"39.","s":"Ch 2, Section 2.6","q":"Soon after a block, a patient looks blue, but the pulse oximeter reads steadily in the high 80s and does not respond to oxygen. What is the next step?","o":["Increase the oxygen flow and wait for the saturation to rise","Give a lipid emulsion bolus because this is the first sign of systemic toxicity","Repeat the block on the other side to deepen the anesthesia","Send co-oximetry and consider methylene blue","Give an intravenous dose of an antihistamine and observe for rash"],"k":3,"e":"A patient who looks blue, with a saturation stuck in the high 80s that does not respond to oxygen, should make you think of methemoglobinemia, because standard pulse oximetry misreads it. Co-oximetry measures it directly, and intravenous methylene blue is the first-line treatment. More oxygen does not fix it, lipid emulsion is for systemic toxicity with its own pattern, and an antihistamine addresses allergy, which this is not."},{"c":3,"id":"1.","s":"Ch 3, Section 3.1","q":"You are about to scan the interscalene plexus, a superficial target, in a thin adult. Which frequency range is most suitable?","o":["About 1 MHz","About 3 MHz","About 5 MHz","Frequency does not matter for superficial targets","Above 10 MHz"],"k":4,"e":"Higher frequency gives better resolution but is absorbed faster and reaches less deep. Superficial targets such as the interscalene plexus are best scanned above 10 MHz, and deep targets in roughly the 3 to 8 MHz range."},{"c":3,"id":"2.","s":"Ch 3, Section 3.1","q":"On an ultrasound image, a structure returns almost no echo and appears black. What is the term for this appearance?","o":["Anechoic","Hyperechoic","Isoechoic","Anisotropic","Reverberant"],"k":0,"e":"Fluid returns almost nothing and looks black (anechoic). Bone returns nearly everything at the first surface and looks white with a black shadow behind it."},{"c":3,"id":"3.","s":"Ch 3, Section 3.1","q":"A vessel is hard to see on color Doppler because the beam strikes it almost perpendicularly. What is the best adjustment?","o":["Increase the depth to the maximum","Switch to a lower gain only","Tilt the probe to reveal flow","Apply heavy pressure","Remove the gel"],"k":2,"e":"Flow appears poorly when the beam is nearly perpendicular to the vessel, so tilting the probe reveals it. Color Doppler is the quickest way to tell a vessel from a nerve."},{"c":3,"id":"4.","s":"Ch 3, Section 3.1","q":"Which statement about the trade between frequency and depth is correct?","o":["Higher frequency penetrates deeper and resolves less detail, which is why linear probes image deep targets","Higher frequency gives better resolution but is absorbed faster, so it reaches less deep","Frequency has no effect on resolution","Lower frequency gives better detail","Depth is set only by the gain"],"k":1,"e":"The central trade in ultrasound physics is between frequency and depth. A higher frequency resolves finer detail but is absorbed faster and reaches less deep."},{"c":3,"id":"5.","s":"Ch 3, Section 3.2","q":"The four hand maneuvers remembered as PART help improve an image. Which word list matches them?","o":["Probe, angle, reflection, time","Pressure, amplitude, range, tilt","Position, attenuation, rotation, targeting","Pressure, alignment, rotation, tilting","Pulse, alignment, resolution, tilting"],"k":3,"e":"PART stands for pressure, alignment, rotation and tilting. When the image is poor, change the hand before the machine."},{"c":3,"id":"6.","s":"Ch 3, Section 3.2","q":"While scanning, a nerve looks dark and indistinct. A small tilt of the probe makes it bright. Which phenomenon does this illustrate?","o":["Acoustic shadowing from bone lying deep to the nerve in that region of the neck","Mirror image artifact","Bayonet artifact","Anisotropy: a nerve reflects the beam best when the beam strikes it square on","Dropout shadow"],"k":3,"e":"Anisotropy makes a nerve or tendon darken or vanish when the beam is not square on. Tilting or sweeping the probe until the structure brightens resolves it."},{"c":3,"id":"7.","s":"Ch 3, Section 3.2","q":"Which probe is best suited to a small supraclavicular fossa or a child's neck where space is tight?","o":["A large curved array","A small hockey-stick linear probe","A phased-array cardiac probe only","Any probe with the lowest frequency","A probe is not needed"],"k":1,"e":"A small hockey-stick linear probe fits tight spaces such as the supraclavicular fossa, the wrist and a child's neck."},{"c":3,"id":"8.","s":"Ch 3, Section 3.3","q":"In which technique does the needle cross the ultrasound beam so that only a dot is seen, and the shaft cannot be distinguished from the tip?","o":["In-plane","Long-axis","Out-of-plane","Compound imaging","Hydrodissection"],"k":2,"e":"In the out-of-plane technique the needle cuts across the beam from the side or front and appears as a single bright dot. In the in-plane technique the whole shaft and tip lie along the beam."},{"c":3,"id":"9.","s":"Ch 3, Section 3.3","q":"A study of six residents performed 520 videotaped blocks. What were the commonest errors identified?","o":["Advancing the needle before it was seen, and unintentional probe movement","Wrong choice of local anesthetic","Failure to obtain consent","Using too little gel","Positioning the machine on the wrong side of the bed, away from the operator"],"k":0,"e":"The commonest errors were advancing the needle without seeing it and letting the probe drift. The success rate was 93.6%, with 4 complications and 398 recorded errors."},{"c":3,"id":"10.","s":"Ch 3, Section 3.3","q":"In a randomized trial of 60 blocks comparing needles, how did a standard needle behave as the insertion angle steepened?","o":["It became brighter","Its visibility did not change","It lost all visibility beyond 10 degrees of steepening, whatever the needle type","It was identical to an echogenic needle at every angle of insertion tested","It lost about 12% of its visibility for each 10 degrees of steeper insertion"],"k":4,"e":"The echogenic needle was seen better, and the standard needle lost about 12% of its visibility for each 10 degrees of steeper insertion, whereas the echogenic needle's visibility did not depend on angle across the range tested."},{"c":3,"id":"11.","s":"Ch 3, Section 3.4","q":"A bright, shadowing line deep in the image is the lung pleura or bone. Which artifact describes a repeated series of bright lines behind a strong reflector?","o":["Anisotropy","Reverberation, sometimes called a comet tail","Posterior acoustic enhancement","Dropout shadow","Bayonet artifact"],"k":1,"e":"Reverberation produces repeated parallel lines or a comet tail behind a strong reflector, because sound bounces between two strong surfaces. A comet tail can signal pleura or bone."},{"c":3,"id":"12.","s":"Ch 3, Section 3.4","q":"A needle appears bent on the screen even though it is straight. Which artifact explains this?","o":["Bayonet artifact: sound travels at different speeds in different tissues","Mirror image","Dropout shadow from a strong reflector lying superficial to the structure","Posterior acoustic enhancement","Anisotropy"],"k":0,"e":"The bayonet artifact makes a needle appear bent because sound travels at different speeds in different tissues. Use the proximal shaft as your guide."},{"c":3,"id":"13.","s":"Ch 3, Section 3.4","q":"A dark wedge appears under part of the probe footprint. What is the usual cause and remedy?","o":["A nerve injury; stop the procedure","A vessel; apply Doppler","Bone shadow; change to a lower frequency","Posterior enhancement behind a vessel; reduce the gain and lower the frequency to compensate","Incomplete skin contact or air under the cover; add gel and press the whole footprint"],"k":4,"e":"A dropout shadow is a dark wedge under part of the probe from incomplete contact or air under the cover. Add gel and press the whole footprint to the skin."},{"c":3,"id":"14.","s":"Ch 3, Section 3.4","q":"What is a known example of a mirror-image artifact in regional anesthesia?","o":["The single-barreled femoral vein","A comet tail behind the pleura","The double-barreled subclavian artery","A bent needle","A black wedge under the probe"],"k":2,"e":"A mirror image is a second copy of a vessel deeper than the real one, produced by reverberation. The double-barreled subclavian artery is the example."},{"c":3,"id":"15.","s":"Ch 3, Section 3.5","q":"In a cadaver study of interscalene needle tip placement, what did injection of a tiny volume of ink beside a plexus fascicle show?","o":["Ink never entered the epineurium","Ink crossed the perineurium in all specimens","Ink stayed in the muscle in all specimens, showing that the needle tip was extraneural in each of the cases examined by the investigators","Ink lay within the epineurium in 5 of 10 specimens, so a tip that looks extraneural can lie under the sheath","The ink study showed no difference between sites"],"k":3,"e":"In 5 of 10 specimens the ink was within the epineurium without crossing the perineurium. A needle tip that looks extraneural on ultrasound can lie under the epineurium."},{"c":3,"id":"16.","s":"Ch 3, Section 3.6","q":"In a study of 103 patients having axillary block, with real-time ultrasound as the reference, what was the sensitivity of a motor response at 0.5 mA or less for detecting needle-to-nerve contact?","o":["38.2%","74.5%","100%","12%","95%"],"k":1,"e":"A motor response at 0.5 mA or less detected contact 74.5% of the time and paresthesia only 38.2% of the time, so the two methods have low and very different sensitivities."},{"c":3,"id":"17.","s":"Ch 3, Section 3.6","q":"In a pig model, what was the mean distance between needle and nerve when a motor response was obtained at 0.2 mA, compared with 1.0 mA?","o":["About 3 mm at 0.2 mA and 0.3 mm at 1.0 mA of stimulating current","The same distance at both currents, since distance does not depend on current","About 0.3 mm at 0.2 mA and 2.9 mm at 1.0 mA","About 10 mm at 0.2 mA","About 0 mm at 1.0 mA"],"k":2,"e":"Direct needle-nerve contact was required for a response at 0.2 mA in 15 of 16 placements, while at 1.0 mA contact was needed in only 1 of 15. Penetrating the nerve was not needed to trigger a twitch."},{"c":3,"id":"18.","s":"Ch 3, Section 3.6","q":"In a study of ultrasound-guided supraclavicular blocks, what was the median current for a motor response when the needle tip was inside the nerve versus outside?","o":["0.60 mA inside and 0.30 mA outside","1.0 mA inside and 2.0 mA outside","0.10 mA in both","The same in both","0.30 mA inside and 0.60 mA outside"],"k":4,"e":"The median current for a motor response was 0.60 mA outside the nerve and 0.30 mA inside. In diabetic patients the thresholds were higher."},{"c":3,"id":"19.","s":"Ch 3, Section 3.6","q":"A Cochrane review of 32 trials in 2,844 adults compared ultrasound with other localization methods. Which outcome was more likely with ultrasound?","o":["An adequate block (odds ratio 2.94)","Paresthesia (odds ratio above 1)","Vascular puncture","Need for supplementation or general anesthesia","Longer performance time with ultrasound alone"],"k":0,"e":"Ultrasound made an adequate block more likely (odds ratio 2.94), and made supplementation, paresthesia and vascular puncture less likely. Performance time was shorter with ultrasound alone."},{"c":3,"id":"20.","s":"Ch 3, Section 3.6","q":"The second ASRA evidence assessment of ultrasound-guided regional anesthesia found which of the following?","o":["Ultrasound abolished nerve injury","Ultrasound was inferior to stimulation for block success, and it did not reduce systemic toxicity in the trials reviewed","Ultrasound increased systemic toxicity","Ultrasound reduced local anesthetic systemic toxicity and hemidiaphragmatic paresis, with no change in neurologic symptoms","The panel found no evidence about any benefit"],"k":3,"e":"High-level evidence supports a better block with ultrasound for selected blocks, with small absolute differences especially in the upper limb. It reduced the risk of toxicity and hemidiaphragmatic paresis, and did not change postoperative neurologic symptoms."},{"c":3,"id":"21.","s":"Ch 3, Section 3.7","q":"According to the ergonomics review, where should the ultrasound machine be placed relative to the block?","o":["On the same side as the block, behind the operator and at the level of the patient's hip","On the side opposite the block, with the screen aligned to the operator's line of sight","At the foot of the bed regardless of site","Anywhere, since position does not matter","Above the patient's head, out of view"],"k":1,"e":"The recommendations include placing the machine opposite the block, aligning the screen with the line of sight, avoiding head turns of 45 degrees or more and sitting with the arm supported."},{"c":3,"id":"22.","s":"Ch 3, Section 3.7","q":"In a cadaver study of 15 novices performing 30 simulated sciatic blocks each, about how many supervised trials with feedback were needed to reach competency in needle visualization?","o":["About 3","About 100","About 28","About 500","None; competency was immediate"],"k":2,"e":"The average amount of supervised practice needed was about 28 trials with feedback. The curve is steep and can be shortened by feedback."},{"c":3,"id":"23.","s":"Ch 3, Section 3.6","q":"In a randomized trial of 230 patients having interscalene block for shoulder arthroscopy, how did block performance time compare between ultrasound and nerve stimulator guidance?","o":["Ultrasound took 15 minutes longer to perform, and block success at 30 minutes was lower overall","Stimulator took 10 minutes less","Ultrasound blocks failed more often","It was 5 minutes in both groups, and motor block at 5 minutes was better with ultrasound","Performance time was not recorded"],"k":3,"e":"Block performance time was 5 minutes in both groups. Ultrasound cut median needle passes from 3 to 1 and improved motor block at 5 minutes, with no conversion to general anesthesia."},{"c":3,"id":"24.","s":"Ch 3, Section 3.3","q":"A narrative review of ergonomics in ultrasound-guided blocks reported which advantage of in-plane insertion?","o":["It improves block success because the tip stays in view","It eliminates vascular puncture","It is always faster than out-of-plane, because the needle crosses the beam once","It avoids the need for a probe cover","It prevents all nerve symptoms"],"k":0,"e":"The review reported that in-plane insertion improves the chance of success, and many practitioners prefer it for most blocks because it keeps the tip in view."},{"c":3,"id":"25.","s":"Ch 3, Section 3.7","q":"A video review of a trainee's blocks shows the probe drifting off the target while the needle is advanced. Which part of the ergonomic setup most directly gives you the skill to move the probe by millimeters without moving your shoulder?","o":["Hold the probe high with the thumb and two fingers pinched at the top, so that you can see the needle clearly","Rest the arm on the bed, hold the probe low with the fingers on the skin, and do not pinch it","Stand with the head turned 45 degrees to the screen so that the needle and the target are both in view","Hold the needle in the non-dominant hand so that the dominant hand can steady the probe from above","Cross the needle hand over the probe hand so that the needle lies directly beside the transducer"],"k":1,"e":"The ergonomic checklist asks you to sit with the arm supported on the bed, hold the probe low with the fingers resting on the skin, and not pinch it. This lets you move the probe by millimeters without moving your shoulder, which is the skill the trainee study found missing when the probe drifted. Turning the head by 45 degrees or more, crossing the hands, and holding the needle in the non-dominant hand are all things the checklist tells you to avoid."},{"c":3,"id":"26.","s":"Ch 3, Section 3.4","q":"Before you insert the needle for a block in the neck or chest, a trainee asks what to scan. Which instruction is correct?","o":["Scan only the target nerve, because the path is safe when the nerve is clear and the pleura is not in view","Scan the whole path of the needle first, looking for the artery, the pleura or the peritoneum","Scan the path only after the first needle pass, so that the needle can be used as a guide","Scan the path with Doppler only if the patient is anticoagulated","Scan the path from the opposite side of the patient, because the structures are mirrored"],"k":1,"e":"Always scan the whole path of the needle before you insert it. The artery, the pleura and the peritoneum are the structures to avoid, and a vessel hiding behind another structure can be found only if you look. A clear view of the nerve does not prove the path is clear."},{"c":3,"id":"27.","s":"Ch 3, Section 3.6","q":"A trainee compares ultrasound guidance with a nerve stimulator for interscalene block. Which statement about the randomized trial of 230 patients is correct?","o":["Needle passes did not change, but nerve symptoms fell to zero with ultrasound","Median needle passes fell from 3 to 1, and nerve symptoms were significantly lower with ultrasound at both time points","Ultrasound doubled the number of needle passes and had the same nerve symptom rate","Median needle passes fell from 3 to 1, and nerve symptoms at 1 week and at 4 to 6 weeks did not differ significantly","Ultrasound improved speed only, and no nerve symptom data were collected"],"k":3,"e":"With ultrasound, the median number of passes fell from 3 to 1. Nerve symptoms were 11% against 8% at 1 week and 7% against 6% at 4 to 6 weeks, which were not significantly different. Ultrasound improves block success and reduces vascular puncture, but it has not been shown to reduce postoperative nerve symptoms."},{"c":3,"id":"28.","s":"Ch 3, Section 3.4","q":"While scanning the neck, you see a round dark structure with a bright column of enhancement behind it, and a nearby nerve that seems to disappear when you tilt the probe slightly. What do these two findings represent?","o":["Acoustic shadowing behind a vessel, and reverberation from the nerve when the probe is tilted","Posterior acoustic enhancement behind a nerve, and mirror artifact from a vessel","Bayonet artifact from the needle, and a hematoma beside the nerve","Mirror artifact behind bone, and a vessel that has thrombosed","Posterior acoustic enhancement behind a vessel, and anisotropy that makes a nerve vanish"],"k":4,"e":"A fluid-filled structure such as a vessel lets the beam through easily, so the tissue behind it looks brighter, and that can make it resemble a nerve. A nerve can fade when the beam hits it at an angle, which is anisotropy, and tilting or sweeping the probe brings it back. Compress, tilt and use Doppler before you decide what a structure is."},{"c":4,"id":"BQ 4.1","s":"Ch 4, section 4.1","q":"A department reviews its prospective audit of peripheral nerve and plexus blocks. In the audit, the proportion of followed patients who had signs or symptoms warranting neurologic referral was about:","o":["0.5%","1%","2%","5%","10%"],"k":0,"e":"Thirty patients (0.5%) in the audit had findings that warranted neurologic referral, and only 3 of the 30 had a block-related nerve injury. Most new deficits after surgery are not caused by the block."},{"c":4,"id":"BQ 4.2","s":"Ch 4, section 4.1","q":"In the same Australasian audit, systemic local anesthetic toxicity occurred at a rate of about:","o":["0.1 per 1,000 blocks","0.4 per 1,000 blocks","0.98 per 1,000 blocks","2 per 1,000 blocks","5 per 1,000 blocks"],"k":2,"e":"The audit reported local anesthetic systemic toxicity at 0.98 per 1,000 blocks. Block-related nerve injury was a separate, lower figure of about 0.4 per 1,000."},{"c":4,"id":"BQ 4.3","s":"Ch 4, section 4.1","q":"A hospital reviews a prospective series of 1,416 patients with continuous peripheral nerve catheters placed after orthopedic surgery. Which description of the neural lesions in that series is correct?","o":["All three lesions followed continuous femoral block and resolved fully within months","No neural lesions occurred in any patient","The lesions followed sciatic catheters only, and all recovered within 24 hours of removal","Most lesions followed interscalene catheters, and half were permanent","All lesions occurred in awake patients and none recovered"],"k":0,"e":"The series found 3 neural lesions (0.21%), all after continuous femoral block. Two of those patients were anesthetized during the block, and all lesions resolved fully within 36 hours to 10 weeks."},{"c":4,"id":"BQ 4.4","s":"Ch 4, section 4.1","q":"A resident asks which layer of a peripheral nerve is the barrier that matters most when deciding where the drug should be delivered. The best answer is the:","o":["Fascia of the adjacent muscle","Vasa nervorum surrounding the epineurium","Perineurium that surrounds each fascicle","Endoneurium inside the fascicle","Epineurium that surrounds the whole nerve"],"k":2,"e":"The perineurium surrounds each fascicle and is the barrier that matters most. An injection inside the epineurium but outside the perineurium may still be tolerated, while an injection inside a fascicle is the dangerous one."},{"c":4,"id":"BQ 4.5","s":"Ch 4, section 4.1","q":"In a cadaver study, investigators made 30 deliberate in-plane, ultrasound-guided injections of under 1 mL into the median nerve of fresh limbs and then examined 352 histologic sections. What did the sections show?","o":["Red cells inside fascicles in most injections","Fascicular rupture in every limb","Axonal disruption in about half of the injections","Perineurial tears at all three levels","No axonal disruption and no red cells inside a fascicle"],"k":4,"e":"Every injection showed nerve swelling on ultrasound, yet the sections showed no axonal disruption and no intrafascicular red cells. The finding supports giving a small test volume to confirm spread. It is not a license to inject into a nerve."},{"c":4,"id":"BQ 4.6","s":"Ch 4, section 4.1","q":"During an ultrasound-guided block you see the nerve begin to swell as you inject, with a round hypoechoic area growing inside its hyperechoic outline. The most appropriate next action is to:","o":["Stop injecting and pull the needle back","Raise the injection pressure to open the plane","Keep the tip still and switch to out-of-plane imaging","Finish the planned volume more slowly","Advance the needle into the center of the nerve"],"k":0,"e":"Swelling of the nerve as injectate enters is a warning sign. The correct response is to stop injecting, withdraw and reposition, and to document what happened."},{"c":4,"id":"BQ 4.7","s":"Ch 4, section 4.1","q":"Why does blocking a heavily sedated patient reduce the safety margin when the needle is near a nerve that matters?","o":["Sedatives block nerve conduction and mask the spread","The patient cannot report severe pain or paresthesia on needle contact or injection","Sedation makes the needle invisible on ultrasound","Sedation shortens the duration of the block","Sedation increases systemic absorption of the local anesthetic through the vascular bed"],"k":1,"e":"An awake patient who can report pain or a paresthesia works as a safety device, and a sedated patient is a weaker one. Keep the patient able to respond when the block is near a nerve that matters, or accept the thinner margin and document why."},{"c":4,"id":"BQ 4.8","s":"Ch 4, section 4.2","q":"A patient takes low-dose apixaban and needs a neuraxial block. According to the fifth-edition ASRA guideline, the gap since the last dose should be at least:","o":["6 hours","12 hours","24 hours","36 hours","48 hours"],"k":3,"e":"For low-dose apixaban the guideline asks for at least 36 hours before a neuraxial or deep block. The high-dose figure is 72 hours, with a plasma-level alternative."},{"c":4,"id":"BQ 4.9","s":"Ch 4, section 4.2","q":"A patient on high-dose apixaban has had a neuraxial catheter placed. The guideline table asks for how long between catheter removal and the first postoperative dose?","o":["At least 4 hours","At least 6 hours","At least 12 hours","At least 24 hours","At least 48 hours"],"k":3,"e":"For high-dose apixaban the table asks for at least 24 hours between catheter removal (or needle placement) and the first postoperative dose. The corresponding interval for low-dose apixaban is 6 hours."},{"c":4,"id":"BQ 4.10","s":"Ch 4, section 4.2","q":"A patient with normal kidney function takes high-dose rivaroxaban and needs a deep plexus block. The gap since the last dose should be at least:","o":["36 hours","48 hours","72 hours","96 hours","120 hours"],"k":2,"e":"High-dose rivaroxaban needs at least 72 hours before neuraxial or deep blocks. Low-dose rivaroxaban needs 24 hours, and 30 hours if creatinine clearance is below 30 mL/min."},{"c":4,"id":"BQ 4.11","s":"Ch 4, section 4.2","q":"A patient on low-dose rivaroxaban has a creatinine clearance of 25 mL/min and needs a neuraxial block. The guideline asks for at least:","o":["6 hours","12 hours","24 hours","30 hours","36 hours"],"k":3,"e":"Low-dose rivaroxaban needs at least 24 hours, extended to 30 hours when creatinine clearance is below 30 mL/min. Kidney function changes the answer for several drugs, so look at it before reading the row."},{"c":4,"id":"BQ 4.12","s":"Ch 4, section 4.2","q":"A patient on high-dose dabigatran has a creatinine clearance of 40 mL/min. The guideline asks for a gap before a neuraxial block of at least:","o":["24 hours","48 hours","72 hours","96 hours","120 hours"],"k":4,"e":"With high-dose dabigatran the interval is 72 hours when creatinine clearance is 50 mL/min or more and 120 hours when it is 30 to 49 mL/min. Below 30 mL/min, avoid the block unless the residual plasma level is below 30 ng/mL."},{"c":4,"id":"BQ 4.13","s":"Ch 4, section 4.2","q":"A patient on an intravenous unfractionated heparin infusion needs a neuraxial block. Before the block the guideline asks you to:","o":["Stop the infusion 24 hours before and check anti-Xa activity before the needle is placed","Continue the infusion and keep the aPTT below 1.5 times normal throughout the procedure","Stop the infusion at least 4 to 6 hours before and confirm normal coagulation","Stop the infusion 12 hours before and check an INR","Stop the infusion 1 hour before and proceed"],"k":2,"e":"The guideline asks for the infusion to be stopped at least 4 to 6 hours before the block and for coagulation to be confirmed normal (grade IA)."},{"c":4,"id":"BQ 4.14","s":"Ch 4, section 4.2","q":"After needle placement for a neuraxial block, intravenous heparin may be started no sooner than:","o":["1 hour","2 hours","4 hours","6 hours","12 hours"],"k":0,"e":"The guideline asks you to delay intravenous heparin for at least 1 hour after needle placement (grade IA). For catheter removal, wait 4 to 6 hours after the last dose and reheparinize 1 hour after removal."},{"c":4,"id":"BQ 4.15","s":"Ch 4, section 4.2","q":"A patient has received subcutaneous unfractionated heparin at more than 10,000 U per dose. The guideline asks for a gap before a neuraxial block of at least:","o":["6 hours","12 hours","24 hours","36 hours","48 hours"],"k":2,"e":"Doses above 10,000 U per dose, or above 20,000 U per day, need at least 24 hours. Low-dose subcutaneous heparin (5,000 U two or three times daily) needs 4 to 6 hours or a normal coagulation assessment."},{"c":4,"id":"BQ 4.16","s":"Ch 4, section 4.2","q":"A patient received a low dose of low-molecular-weight heparin this morning and wants a neuraxial block. Without using an anti-Xa level, the guideline's interval since the dose is at least:","o":["4 hours","6 hours","12 hours","24 hours","36 hours"],"k":2,"e":"Before a block, low-dose low-molecular-weight heparin needs at least 12 hours (grade IC). High-dose needs at least 24 hours. Anti-Xa is an option if the time is shorter."},{"c":4,"id":"BQ 4.17","s":"Ch 4, section 4.2","q":"A single-shot neuraxial block in a patient scheduled for postoperative low-molecular-weight heparin returns blood from the needle. The guideline's advice is to:","o":["Delay the first low-molecular-weight heparin dose by 24 hours and discuss with the surgeon","Cancel the surgery","Double the first dose to compensate for the delay caused by the traumatic puncture","Proceed with the first dose on schedule, because blood in the needle does not change the plan","Stop all anticoagulants for 7 days"],"k":0,"e":"Blood during needle or catheter placement does not mandate postponing surgery. The guideline asks for a 24-hour delay in starting low-molecular-weight heparin and a discussion with the surgeon (grade IIC)."},{"c":4,"id":"BQ 4.18","s":"Ch 4, section 4.2","q":"A patient on low-dose fondaparinux with a creatinine clearance of 25 mL/min is booked for a neuraxial block. The guideline's advice for this renal function is to:","o":["Wait 42 hours and proceed","Proceed after a normal INR","Wait 36 hours and proceed","Wait 58 hours and proceed","Avoid the block"],"k":4,"e":"For low-dose fondaparinux the guideline asks for 36 to 42 hours with normal renal function and at least 58 hours when creatinine clearance is 30 to 50 mL/min. Below 30 mL/min, avoid the block."},{"c":4,"id":"BQ 4.19","s":"Ch 4, section 4.2","q":"A patient on warfarin has a neuraxial catheter. The guideline allows removal of the catheter when the INR is:","o":["Below 1.2","Below 1.5","Below 2.0","Below 2.5","Below 3.0"],"k":1,"e":"For warfarin the guideline asks you to stop 5 days before the procedure, check the INR, and remove neuraxial catheters when the INR is below 1.5 (grade IIC). Neurologic assessment continues for at least 48 hours after removal."},{"c":4,"id":"BQ 4.20","s":"Ch 4, section 4.2","q":"A patient taking ticagrelor needs a neuraxial block. The guideline asks for a gap before needle placement of at least:","o":["3 days","5 days","7 days","10 days","14 days"],"k":1,"e":"Ticagrelor needs 5 days before needle placement, and no neuraxial catheter should be maintained. Clopidogrel needs 5 to 7 days."},{"c":4,"id":"BQ 4.21","s":"Ch 4, section 4.2","q":"A patient who takes prasugrel is scheduled for a neuraxial block. The guideline's interval, taken from labeling, is:","o":["2 to 3 days","5 days","7 to 10 days","14 days","21 to 28 days"],"k":2,"e":"Prasugrel needs 7 to 10 days (grade IIC), and patients at high bleeding risk may need longer. It has a longer wait than ticagrelor or clopidogrel."},{"c":4,"id":"BQ 4.22","s":"Ch 4, section 4.2","q":"After a patient stops cilostazol, the guideline asks you to avoid ne
